<title>BJJ Map</title>
<style>
/* Mastery is shown as belt colours — the app's one loud idea. Red is reserved
   for selection and focus, like the bar on a black belt. */
:root{
  --paper:#EEF1F3; --card:#FFFFFF; --ink:#18202B; --muted:#5B6672; --faint:#8A949E;
  --rule:#D5DBE0; --soft:#E4E8EC; --red:#C2342C; --red-soft:#F6DEDB;
  --b-white:#ECE8DF; --b-blue:#2B62C4; --b-purple:#7146B8; --b-brown:#7C4E25; --b-black:#18202B;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html.dark{
  --paper:#11161C; --card:#1A2129; --ink:#E9EDF1; --muted:#9AA5B1; --faint:#6F7A86;
  --rule:#2C3540; --soft:#222A33; --red:#E2564C; --red-soft:#3A1E1C;
  --b-white:#ECE8DF; --b-blue:#5E8EE6; --b-purple:#9C7AE0; --b-brown:#B07A47; --b-black:#0A0D11;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--sans);font-size:16px;line-height:1.45;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;padding-bottom:calc(92px + max(env(safe-area-inset-bottom),4px));overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.top{position:sticky;top:0;z-index:30;background:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.top h1{flex:1;margin:0;font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1.05}
.top h1 small{display:block;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--card);color:var(--muted)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);font-size:15px;padding:6px 0}

main{max-width:640px;margin:0 auto;padding:14px 16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);
  border-top:1px solid var(--rule);padding:6px 6px calc(8px + max(env(safe-area-inset-bottom),4px));transform:translateZ(0)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:12px;font-weight:600;color:var(--faint);border-radius:10px;position:relative}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-weight:600;font-size:15px}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)} .tiny{font-size:13px}
h2.sec{font-family:var(--cond);font-weight:600;font-size:20px;margin:22px 2px 8px;letter-spacing:.01em}

/* ---- the ladder ---- */
.ladder{position:relative;padding-left:22px;margin-top:4px}
.ladder::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:2px;background:var(--rule);border-radius:2px}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint);margin:0 2px 6px 22px}
.rung{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;background:var(--card);border:1px solid var(--rule);border-radius:12px}
.rung::before{content:"";position:absolute;left:-20px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--paper);border:2px solid var(--rule)}
.rung.sub::before{border-color:var(--red)}
.rung .nm{flex:1;min-width:0;font-family:var(--cond);font-weight:600;font-size:19px;line-height:1.15}
.rung .nm small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted)}
.rung .n{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:18px;text-align:right}
.mix{display:flex;width:64px;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);flex:none;box-shadow:inset 0 0 0 1px var(--rule)}
.mix i{display:block;height:100%}

/* belts */
.belt{display:inline-block;width:26px;height:9px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);position:relative;flex:none}
.belt.black::after{content:"";position:absolute;right:4px;top:0;bottom:0;width:7px;background:var(--red)}
.b-ny{background:var(--b-white)} .b-drilles{background:var(--b-blue)} .b-sitter{background:var(--b-purple)}
.b-sparring{background:var(--b-brown)} .b-aspill{background:var(--b-black)}
html.dark .b-aspill{box-shadow:inset 0 0 0 1px #4A5562}

/* focus map */
.mapcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:6px 4px;margin-top:6px}
.mapcard svg{display:block;width:100%;height:auto}
.fnode{cursor:pointer}

/* techniques */
.search{display:flex;gap:8px}
.search input{flex:1;padding:11px 13px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tech{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;padding:11px 12px;margin-bottom:7px;background:var(--card);border:1px solid var(--rule);border-radius:12px}
.tech .stripe{width:7px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tech .b{flex:1;min-width:0}
.tech .b b{display:block;font-size:16px;font-weight:650}
.tech .b span{display:block;font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type{align-self:center;flex:none;font-size:12px;font-weight:650;color:var(--muted);padding:3px 8px;border-radius:6px;background:var(--soft)}
.type.sub{color:var(--red);background:var(--red-soft)}
.empty{text-align:center;color:var(--muted);padding:34px 16px}

/* sheets — always above the tab bar */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--paper);
  border-radius:20px 20px 0 0;padding:10px 16px calc(28px + max(env(safe-area-inset-bottom),12px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px}
.sheet h3{margin:0 0 2px;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--rule);background:var(--card);font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--faint);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.box h4{margin:0 0 6px;font-size:13px;font-weight:650;color:var(--muted)}
.box ul{margin:0;padding-left:18px}
.box li{margin:2px 0}
.beltpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.beltpick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 2px;border-radius:10px;border:1px solid var(--rule);background:var(--card);font-size:12px;font-weight:600;color:var(--muted)}
.beltpick button.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--rule)}
.link:first-of-type{border-top:0}
.link .w{font-size:13px;color:var(--muted)}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--card);margin-bottom:6px}
.pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--rule);flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.pick.on .ck{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.sess{display:block;width:100%;text-align:left;padding:12px 13px;margin-bottom:8px;background:var(--card);border:1px solid var(--rule);border-radius:12px}
.sess b{font-family:var(--cond);font-size:19px;font-weight:600}
.sess p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + max(env(safe-area-inset-bottom),4px));z-index:80;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100vw - 40px);text-align:center}
.fab{position:fixed;right:16px;bottom:calc(86px + max(env(safe-area-inset-bottom),4px));z-index:35;display:flex;align-items:center;gap:7px;padding:13px 18px;
  border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.fab[hidden]{display:none}
input.bad{border-color:var(--red)!important}
.threat{border-left:4px solid var(--rule)}
.threat.open{border-left-color:var(--red)}
.threat .ans{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.ansrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<button class="fab" id="fab" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="fabLbl"></span></button>
<nav class="tabs" id="tabs"></nav>

<script>
/* ============================================================
   Data
   ============================================================ */
const KEY='bjjKart_v1';
const SUB='__sub';
/* Belt order = how well a technique sits. */
const BELTS=[
  {k:'ny',      name:'New',             short:'New',    belt:'White',  cls:'b-ny'},
  {k:'drilles', name:'Drilling',        short:'Drill',  belt:'Blue',   cls:'b-drilles'},
  {k:'sitter',  name:'Solid',           short:'Solid',  belt:'Purple', cls:'b-sitter'},
  {k:'sparring',name:'Hits in sparring',short:'Hits',   belt:'Brown',  cls:'b-sparring'},
  {k:'aspill',  name:'A-game',          short:'A-game', belt:'Black',  cls:'b-aspill'},
];
const TYPES=['Sweep','Reversal','Pass','Escape','Defense','Submission','Transition','Takedown'];
/* Ladder order: index 0 is the best place to be. */
const SEED_POS=[
  ['Back control','top'],['Mount','top'],['Knee on belly','top'],['Side control','top'],
  ['Half guard','top'],['Open guard','top'],['Closed guard','top'],['Standing','neutral'],
  ['Closed guard','bottom'],['Open guard','bottom'],['Half guard','bottom'],['Side control','bottom'],
  ['Mount','bottom'],['Back taken','bottom']
];
const uid=()=>Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7);
function seedPositions(){ return SEED_POS.map(([name,side])=>({id:uid(),name,side})); }

let DB;
try{ DB=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ DB=null; }
if(!DB||!Array.isArray(DB.positions)) DB={v:1,lang:'en',positions:seedPositions(),techniques:[],sessions:[],subs:[],settings:{theme:'light'}};
DB.techniques=DB.techniques||[]; DB.sessions=DB.sessions||[]; DB.settings=Object.assign({theme:'light'},DB.settings||{});
migrateToEnglish();
let saveT; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('Couldn\u2019t save: storage is full'); } },120); }

/* ============================================================
   Helpers
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
function toast(m){ const o=$('.toast'); if(o) o.remove(); const t=el(`<div class="toast">${esc(m)}</div>`); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
const pad=n=>String(n).padStart(2,'0');
const todayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isoToDMY=v=>{ const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?`${m[3]}/${m[2]}/${m[1]}`:''; };
function dmyToIso(str){
  const s=String(str||'').trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})[./ -](\d{1,2})[./ -](\d{2,4})$/)||s.match(/^(\d{2})(\d{2})(\d{4})$/);
  if(!m) return null;
  let d=+m[1],mo=+m[2],y=+m[3]; if(y<100) y+=2000;
  const dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCDate()!==d||dt.getUTCMonth()!==mo-1) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
const daysSince=iso=>Math.floor((new Date(todayKey())-new Date(iso))/86400000);
const ICON={
  map:'<svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="11" height="4" rx="1.5"/><rect x="4" y="10" width="9" height="4" rx="1.5"/><rect x="4" y="16.5" width="10" height="4" rx="1.5"/><path d="M17 18.5h2.5v-13H17"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1"/></svg>',
  log:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
  menu:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="18.5" r="1"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20.5 13.2A8.3 8.3 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
};
const pos=id=>DB.positions.find(p=>p.id===id);
const posIdx=id=>id===SUB?-1:DB.positions.findIndex(p=>p.id===id);
const posName=id=>!id?'No position':id===SUB?'Submission':(pos(id)?`${pos(id).name}${pos(id).side!=='neutral'?', '+pos(id).side:''}`:'Unknown position');
const tech=id=>DB.techniques.find(t=>t.id===id);
/* Every position exists twice: what you do from Mount, top is exactly what will be
   tried on you in Mount, bottom. Pairing them by name lets the app show threats
   without any extra data entry. */
const MIRROR_ALIAS={'Back control':'Back taken','Back taken':'Back control'};
const mirrorOf=p=>{ if(!p||p.side==='neutral') return null; const want=p.side==='top'?'bottom':'top';
  return DB.positions.find(x=>x.name===p.name&&x.side===want)
      || DB.positions.find(x=>x.name===MIRROR_ALIAS[p.name]&&x.side===want) || null; };
/* Where a threat leaves YOU: their submission finishes it, otherwise you land in
   the mirror of wherever they end up. */
const threatResult=t=>{ if(t.to===SUB) return 'they finish'; const m=mirrorOf(pos(t.to));
  return m?`you end up in ${posName(m.id)}`:`they get ${pos(t.to)?pos(t.to).name:'a new position'}`; };
const threatsAt=pid=>{ const m=mirrorOf(pos(pid)); return m?DB.techniques.filter(t=>t.from===m.id&&t.type!=='Defense'):[]; };
/* A defense answers a threat directly, or covers the whole submission it belongs to. */
const answersTo=id=>{ const th=tech(id), sid=th&&th.to===SUB&&th.sub;
  return DB.techniques.filter(t=>t.id!==id&&((t.answers||[]).includes(id)||(sid&&(t.defends||[]).includes(sid)))); };
const openThreats=pid=>threatsAt(pid).filter(t=>!answersTo(t.id).length);
/* Bottom to top means the roles flip: sweeps and reversals. */
const flips=t=>{ const a=pos(t.from), b=t.to===SUB?null:pos(t.to); return !!(a&&b&&a.side==='bottom'&&b.side==='top'); };
/* Submissions are a catalogue of their own: "Armbar" once, however many
   positions it comes from. Defenses point at the sub, not at a position. */
const subName=id=>((DB.subs||[]).find(s=>s.id===id)||{}).name||'';
const famName=n=>String(n||'').replace(/\s+(from|fra)\s+.+$/i,'').trim()||String(n||'').trim();
function subByName(n,create){ const k=String(n||'').trim().toLowerCase(); if(!k) return null;
  let s=DB.subs.find(x=>x.name.toLowerCase()===k);
  if(!s&&create){ s={id:uid(),name:String(n).trim(),notes:''}; DB.subs.push(s); } return s||null; }
function ensureSubs(){ DB.subs=Array.isArray(DB.subs)?DB.subs:[];
  DB.techniques.forEach(t=>{
    if(t.to===SUB&&!t.sub){ const s=subByName(famName(t.name),true); if(s) t.sub=s.id; }
    if(t.sub&&!DB.subs.some(s=>s.id===t.sub)) delete t.sub;
    if(t.defends) t.defends=t.defends.filter(i=>DB.subs.some(s=>s.id===i)); }); }
const attacksOf=sid=>DB.techniques.filter(t=>t.sub===sid&&t.to===SUB);
const defensesOf=sid=>DB.techniques.filter(t=>(t.defends||[]).includes(sid)||(t.answers||[]).some(a=>{ const x=tech(a); return x&&x.to===SUB&&x.sub===sid; }));
const openSubs=()=>DB.subs.filter(s=>!defensesOf(s.id).length);
function techWhere(t,full){
  const d=(t.defends||[]).map(subName).filter(Boolean), vs=d.length?`vs ${d.join(', ')}`:'';
  if(!t.from&&!t.to) return vs?`${vs} · any position`:'any position';
  const base=t.from===t.to?`${full?posName(t.from)+' · ':''}stays in position`:full?`${posName(t.from)} → ${posName(t.to)}`:`→ ${posName(t.to)}`;
  return vs?`${base} · ${vs}`:base; }
const belt=k=>BELTS.find(b=>b.k===k)||BELTS[0];
const beltIdx=k=>Math.max(0,BELTS.findIndex(b=>b.k===k));
const lastDone=id=>DB.sessions.filter(s=>(s.techs||[]).includes(id)).map(s=>s.date).sort().pop()||null;

/* ============================================================
   State + render
   ============================================================ */
let view='kart', focusPos=null, tq='', fBelt=null, fType=null;

function topbar(title, sub, back){
  return `${back?`<button class="ib" data-act="${back}" aria-label="Back">${ICON.back}</button>`:''}
    <h1>${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</h1>
    <button class="ib" data-act="theme" aria-label="${DB.settings.theme==='dark'?'Light theme':'Dark theme'}">${DB.settings.theme==='dark'?ICON.sun:ICON.moon}</button>
    <button class="ib" data-act="menu" aria-label="Menu">${ICON.menu}</button>`;
}
function render(){
  const tabs=[['kart','Map',ICON.map],['teknikker','Techniques',ICON.list],['logg','Log',ICON.log]];
  $('#tabs').innerHTML=tabs.map(([k,l,i])=>`<button aria-selected="${view===k}" data-tab="${k}">${i}<span>${l}</span></button>`).join('');
  const a=$('#app'), t=$('#top');
  if(view==='kart' && focusPos===SUB){ const o=openSubs().length; t.innerHTML=topbar('Submissions',`${DB.subs.length} ${DB.subs.length===1?'sub':'subs'}${o?` · ${o} without a defense`:''}`,'unfocus'); a.innerHTML=viewSubs(); }
  else if(view==='kart' && focusPos){ t.innerHTML=topbar(posName(focusPos),'What can I do from here?','unfocus'); a.innerHTML=viewFocus(focusPos); }
  else if(view==='kart'){ t.innerHTML=topbar('BJJ Map',`${DB.techniques.length} ${DB.techniques.length===1?'technique':'techniques'}`); a.innerHTML=viewMap(); }
  else if(view==='teknikker'){ t.innerHTML=topbar('Techniques',`${DB.techniques.length} total`); a.innerHTML=viewTechs(); }
  else { t.innerHTML=topbar('Training log',`${DB.sessions.length} ${DB.sessions.length===1?'session':'sessions'}`); a.innerHTML=viewLog(); }
  const fab=$('#fab');
  fab.hidden=false;
  if(view==='logg'){ $('#fabLbl').textContent='New session'; fab.onclick=()=>sessionEdit(null); }
  else if(view==='kart'&&focusPos===SUB){ $('#fabLbl').textContent='New defense'; fab.onclick=()=>techEdit(null,{type:'Defense'}); }
  else { $('#fabLbl').textContent='New technique'; fab.onclick=()=>techEdit(null,{from:focusPos||''}); }
}

/* ============================================================
   Map: the ladder
   ============================================================ */
function beltMix(list){
  if(!list.length) return `<span class="mix"></span>`;
  const counts=BELTS.map(b=>list.filter(t=>t.status===b.k).length);
  return `<span class="mix" title="${list.length} techniques">${counts.map((n,i)=>n?`<i class="${BELTS[i].cls}" style="width:${n/list.length*100}%"></i>`:'').join('')}</span>`;
}
function viewMap(){
  const subs=DB.techniques.filter(t=>t.to===SUB);
  const rows=DB.positions.map(p=>{
    const out=DB.techniques.filter(t=>t.from===p.id);
    return `<button class="rung" data-act="focus" data-id="${p.id}">
      <span class="nm">${esc(p.name)}<small>${esc(p.side)}${p.notes?' · notes':''}${(()=>{const n=openThreats(p.id).length; return n?` · <b style="color:var(--red)">${n} open</b>`:'';})()}</small></span>
      ${beltMix(out)}<span class="n">${out.length||''}</span></button>`;
  }).join('');
  const intro = DB.techniques.length ? '' : `<div class="box" style="margin-bottom:14px">
      <p style="margin:0 0 10px">Tap a position to see what you can do from there, or add your first technique.</p>
      <button class="btn sm" data-act="examples">Show with examples</button></div>`;
  return `${intro}
    <div class="ends"><span>Better position</span><span>techniques from here</span></div>
    <div class="ladder">
      <button class="rung sub" data-act="focus" data-id="${SUB}"><span class="nm">Submission<small>attacks and defenses${(()=>{const n=openSubs().length; return n?` · <b style="color:var(--red)">${n} open</b>`:'';})()}</small></span>${beltMix(subs)}<span class="n">${subs.length||''}</span></button>
      ${rows}
    </div>
    <div class="ends" style="margin-top:2px"><span>Worse position</span><span></span></div>
    <div class="row" style="margin-top:14px;justify-content:center"><button class="btn sm" data-act="positions">Edit positions</button></div>
    <h2 class="sec">The belts</h2>
    <div class="box">${BELTS.map(b=>`<div class="row" style="margin:5px 0"><span class="belt ${b.cls}${b.k==='aspill'?' black':''}"></span><span>${esc(b.belt)} belt</span><span class="muted tiny" style="margin-left:auto">${esc(b.name)}</span></div>`).join('')}</div>`;
}

/* ============================================================
   Map: focus on one position
   ============================================================ */
const STROKE={ny:'#B4AE9F',drilles:'var(--b-blue)',sitter:'var(--b-purple)',sparring:'var(--b-brown)',aspill:'var(--ink)'};
function focusSvg(pid){
  const rows=[{id:SUB,name:'Submission',side:''},...DB.positions];
  const rowH=30, top=10, W=380, nx=104, nw=172;
  const H=top+rows.length*rowH+10;
  const yOf=id=>top+(posIdx(id)+1)*rowH+rowH/2;
  const out=DB.techniques.filter(t=>t.from===pid && t.to && t.to!==pid);
  const inc=DB.techniques.filter(t=>t.to===pid && t.from && t.from!==pid);
  const related=new Set([pid,...out.map(t=>t.to),...inc.map(t=>t.from)]);
  const yF=yOf(pid);
  const laneR=k=>Math.min(W-8, nx+nw+12+k*Math.min(11, 92/Math.max(1,out.length)));
  const laneL=k=>Math.max(8, nx-12-k*Math.min(11, 92/Math.max(1,inc.length)));
  const head=(x,y,dir,c,big)=>{ const L=big?10:7, h=big?6.5:4.5; return `<path d="M${x} ${y} l${dir*L} -${h} v${h*2} z" fill="${c}" stroke="none"/>`; };
  const sorted=(list,key)=>list.slice().sort((a,b)=>posIdx(a[key])-posIdx(b[key]));
  let arrows='';
  sorted(out,'to').forEach((t,k)=>{ const c=STROKE[t.status]||STROKE.ny, lx=laneR(k), y1=yOf(t.to), big=flips(t);
    arrows+=`<path d="M${nx+nw} ${yF} H${lx} V${y1} H${nx+nw+(big?11:8)}" fill="none" stroke="${c}" stroke-width="${big?4.2:2.2}" stroke-linejoin="round"${t.status==='ny'?' stroke-dasharray="5 4"':''}/>${head(nx+nw+1,y1,1,c,big)}`; });
  sorted(inc,'from').forEach((t,k)=>{ const c=STROKE[t.status]||STROKE.ny, lx=laneL(k), y0=yOf(t.from), big=flips(t);
    arrows+=`<path d="M${nx} ${y0} H${lx} V${yF} H${nx-(big?11:8)}" fill="none" stroke="${c}" stroke-width="${big?4.2:2.2}" stroke-linejoin="round" opacity=".85"${t.status==='ny'?' stroke-dasharray="5 4"':''}/>${head(nx-1,yF,-1,c,big)}`; });
  const nodes=rows.map((r,i)=>{
    const y=top+i*rowH+rowH/2, isF=r.id===pid, on=related.has(r.id), isSub=r.id===SUB;
    const label=isSub?'Submission':`${r.name}${r.side&&r.side!=='neutral'?', '+r.side:''}`;
    return `<g class="fnode" data-act="focus" data-id="${r.id}" opacity="${on?1:.35}">
      <rect x="${nx}" y="${y-11}" width="${nw}" height="22" rx="6" fill="${isF?'var(--red-soft)':'var(--card)'}" stroke="${isF||isSub?'var(--red)':'var(--rule)'}" stroke-width="${isF?2:1}"/>
      <text x="${nx+nw/2}" y="${y}" text-anchor="middle" dominant-baseline="central" font-family="var(--cond)" font-size="14.5" font-weight="${isF?700:600}" fill="var(--ink)">${esc(label)}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of techniques into and out of ${esc(posName(pid))}">${arrows}${nodes}</svg>`;
}
function techRow(t, showFromTo){
  const b=belt(t.status);
  return `<button class="tech" data-act="opentech" data-id="${t.id}">
    <span class="stripe ${b.cls}"></span>
    <span class="b"><b>${esc(t.name)}</b><span>${esc(techWhere(t,showFromTo))}</span></span>
    <span class="type${t.type==='Submission'?' sub':''}">${esc(t.type)}</span></button>`;
}
function threatSection(pid){
  const p=pos(pid), m=mirrorOf(p); if(!m) return '';
  const th=threatsAt(pid).sort((a,b)=>posIdx(a.to)-posIdx(b.to)||a.name.localeCompare(b.name,'en'));
  const open=th.filter(t=>!answersTo(t.id).length).length;
  const head=`<h2 class="sec">What they\u2019ll try here (${th.length})</h2>
    <p class="tiny muted" style="margin:-4px 2px 10px">Your own techniques from ${esc(posName(m.id))}, seen from the other side.${open?` <b style="color:var(--red)">${open} without an answer.</b>`:th.length?' Every one has an answer.':''}</p>`;
  if(!th.length) return head+`<p class="tiny muted" style="margin:0 2px">Add techniques from ${esc(posName(m.id))} and they\u2019ll show up here as threats.</p>`;
  return head+th.map(t=>{ const ans=answersTo(t.id);
    return `<div class="box threat${ans.length?'':' open'}">
      <div class="row"><button style="flex:1;text-align:left" data-act="opentech" data-id="${t.id}"><b>${esc(t.name)}</b><br><span class="tiny muted">${esc(threatResult(t))}</span></button>
        <span class="type${t.type==='Submission'?' sub':''}">${esc(t.type)}</span></div>
      <div class="ans">${ans.length?ans.map(a=>`<button class="ansrow" data-act="opentech" data-id="${a.id}"><span class="belt ${belt(a.status).cls}${a.status==='aspill'?' black':''}"></span><span style="flex:1"><span class="tiny muted">your answer</span><br><b>${esc(a.name)}</b></span></button>`).join('')
        :`<p class="tiny" style="margin:0;color:var(--red);font-weight:650">No answer yet</p>`}
        <button class="btn sm" style="margin-top:8px" data-act="addanswer" data-id="${t.id}" data-pos="${pid}">${ans.length?'Add another answer':'Add an answer'}</button></div></div>`; }).join('');
}
function viewFocus(pid){
  const out=DB.techniques.filter(t=>t.from===pid).sort((a,b)=>posIdx(a.to)-posIdx(b.to)||a.name.localeCompare(b.name,'en'));
  const inc=DB.techniques.filter(t=>t.to===pid&&t.from!==pid).sort((a,b)=>posIdx(a.from)-posIdx(b.from));
  const p=pos(pid);
  return `${notesBox('Notes for this position', p&&p.notes, 'posnotes', pid, 'Goals here, grips, what to avoid, what your coach keeps repeating.')}
    <div class="mapcard">${focusSvg(pid)}</div>
    <p class="tiny muted" style="margin:6px 4px 0">Arrows on the right lead out of here, arrows on the left lead in. Thick arrows flip who\u2019s on top. Tap a position on the map to move there.</p>
    <h2 class="sec">From here (${out.length})</h2>
    ${out.length?out.map(t=>techRow(t,false)).join(''):`<p class="muted tiny" style="margin:0 2px">No techniques from here yet.</p>`}
    <h2 class="sec">Leads here (${inc.length})</h2>
    ${inc.length?inc.map(t=>`<button class="tech" data-act="opentech" data-id="${t.id}"><span class="stripe ${belt(t.status).cls}"></span>
        <span class="b"><b>${esc(t.name)}</b><span>from ${esc(posName(t.from))}</span></span><span class="type${t.type==='Submission'?' sub':''}">${esc(t.type)}</span></button>`).join('')
      :`<p class="muted tiny" style="margin:0 2px">No techniques end here yet.</p>`}
    <button class="btn full" style="margin-top:14px" data-act="newfrom" data-id="${pid}">New technique from here</button>
    ${threatSection(pid)}`;
}

/* ============================================================
   Submissions: attacks and defenses, no positions needed
   ============================================================ */
const ansRow=(a,label)=>`<button class="ansrow" data-act="opentech" data-id="${a.id}"><span class="belt ${belt(a.status).cls}${a.status==='aspill'?' black':''}"></span><span style="flex:1;min-width:0"><span class="tiny muted">${esc(label)}</span><br><b>${esc(a.name)}</b></span></button>`;
function viewSubs(){
  const list=DB.subs.slice().sort((a,b)=>(!defensesOf(b.id).length-!defensesOf(a.id).length)||a.name.localeCompare(b.name,'en'));
  return `<p class="tiny muted" style="margin:2px 2px 12px">Each submission once, however many positions it comes from. A defense here doesn’t need a position — it covers the sub wherever they hit it, and counts as an answer on every position where it’s a threat.</p>
    ${list.length?list.map(s=>{ const at=attacksOf(s.id), df=defensesOf(s.id);
      return `<div class="box threat${df.length?'':' open'}">
        <button style="width:100%;text-align:left" data-act="subinfo" data-id="${s.id}"><b style="font-family:var(--cond);font-size:21px;font-weight:600">${esc(s.name)}</b><br>
          <span class="tiny muted">${at.length?`you hit it from ${at.map(t=>esc(posName(t.from))).join(', ')}`:'one you defend against'}${s.notes?' · notes':''}</span></button>
        ${at.length?`<div style="margin-top:4px">${at.map(t=>ansRow(t,`your attack · from ${posName(t.from)}`)).join('')}</div>`:''}
        <div class="ans">${df.length?df.map(d=>ansRow(d,`your defense${d.from?` · ${posName(d.from)}`:''}`)).join('')
          :`<p class="tiny" style="margin:0;color:var(--red);font-weight:650">No defense yet</p>`}
          <button class="btn sm" style="margin-top:8px" data-act="adddef" data-id="${s.id}">${df.length?'Add another defense':'Add a defense'}</button></div></div>`; }).join('')
      :`<div class="empty">No submissions yet. Add the ones you want to defend against — no position needed.</div>`}
    <button class="btn full" style="margin-top:12px" data-act="newsub">Add a submission to defend</button>`;
}
function subSheet(sid){
  const s=sid?DB.subs.find(x=>x.id===sid):null; if(sid&&!s) return;
  const at=s?attacksOf(s.id):[];
  const sh=openSheet(`<h3>${s?esc(s.name):'New submission'}</h3><p class="sub">${s?'Name and notes for this submission.':'A sub you want to defend. It doesn’t have to be one you do yourself.'}</p>
    <div class="f"><label for="sbn">Name</label><input id="sbn" value="${esc(s?s.name:'')}" placeholder="e.g. Guillotine, Heel hook, Arm triangle"></div>
    <div class="f"><label for="sbt">Notes</label><textarea id="sbt" placeholder="Early warning signs, what to never do, what your coach says">${esc(s?s.notes:'')}</textarea></div>
    <button class="btn solid full" id="sbsave">${s?'Save':'Add submission'}</button>
    ${s?`<button class="btn full" style="margin-top:10px" id="sbatk">I do this one too — add an attack</button>
      <button class="btn danger full" style="margin-top:10px" id="sbdel">Delete submission</button>`:''}`);
  const nm=sh.querySelector('#sbn'); if(!s) setTimeout(()=>nm.focus(),120);
  sh.querySelector('#sbsave').onclick=()=>{ const n=nm.value.trim(); if(!n){ nm.classList.add('bad'); nm.focus(); return; }
    const dup=subByName(n,false); if(dup&&dup!==s){ toast(`“${dup.name}” is already there`); return; }
    if(s){ s.name=n; s.notes=sh.querySelector('#sbt').value.trim(); } else DB.subs.push({id:uid(),name:n,notes:sh.querySelector('#sbt').value.trim()});
    save(); closeSheet(); render(); toast(s?'Saved':'Submission added'); };
  if(!s) return;
  sh.querySelector('#sbatk').onclick=()=>techEdit(null,{name:s.name,type:'Submission',to:SUB,sub:s.id});
  sh.querySelector('#sbdel').onclick=()=>{
    if(at.length){ toast(`Your ${at.length===1?'attack uses':at.length+' attacks use'} this sub \u2014 change ${at.length===1?'it':'them'} first`); return; }
    if(!confirm(`Delete \u201c${s.name}\u201d? Your defenses stay; they just stop being linked to it.`)) return;
    DB.subs=DB.subs.filter(x=>x.id!==s.id);
    DB.techniques.forEach(t=>{ if(t.defends) t.defends=t.defends.filter(i=>i!==s.id); });
    save(); closeSheet(); render(); toast('Submission deleted'); };
}
function defenseSheet(sid){
  const s=DB.subs.find(x=>x.id===sid); if(!s) return;
  const cur=defensesOf(sid).map(t=>t.id);
  const cands=DB.techniques.filter(x=>!cur.includes(x.id)&&!(x.to===SUB&&x.sub===sid))
    .sort((a,b)=>((b.type==='Defense')-(a.type==='Defense'))||((b.type==='Escape')-(a.type==='Escape'))||a.name.localeCompare(b.name,'en'));
  const sh=openSheet(`<h3>Defend: ${esc(s.name)}</h3><p class="sub">Make a new defense, or link one you already have.</p>
    <button class="btn solid full" id="dnew" style="margin-bottom:12px">New defense</button>
    ${cands.length?`<div class="f"><label>Or pick an existing technique</label></div><div id="dl">${cands.map(x=>`<button class="pick" data-id="${x.id}"><span class="belt ${belt(x.status).cls}"></span><span style="flex:1;min-width:0"><b>${esc(x.name)}</b><br><span class="tiny muted">${esc(x.type)} · ${esc(techWhere(x,true))}</span></span></button>`).join('')}</div>`:''}`);
  sh.querySelectorAll('#dl [data-id]').forEach(x=>x.onclick=()=>{ const t=tech(x.dataset.id); t.defends=t.defends||[]; if(!t.defends.includes(sid)) t.defends.push(sid); save(); closeSheet(); render(); toast('Defense linked'); });
  sh.querySelector('#dnew').onclick=()=>techEdit(null,{type:'Defense',defends:[sid]},()=>{ closeSheet(); render(); toast('Defense saved'); });
}

/* ============================================================
   Techniques list
   ============================================================ */
function viewTechs(){
  const s=tq.trim().toLowerCase();
  const list=DB.techniques.filter(t=>(!fBelt||t.status===fBelt)&&(!fType||t.type===fType)&&
    (!s||[t.name,t.type,posName(t.from),posName(t.to),techWhere(t,true),subName(t.sub),(t.details||''),(t.notes||'')].join(' ').toLowerCase().includes(s)))
    .sort((a,b)=>posIdx(a.from)-posIdx(b.from)||a.name.localeCompare(b.name,'en'));
  return `<div class="search"><input type="search" id="tq" value="${esc(tq)}" placeholder="Search name, position, details…" autocomplete="off"></div>
    <div class="chips">${BELTS.map(b=>`<button class="chip${fBelt===b.k?' on':''}" data-act="fbelt" data-k="${b.k}"><span class="belt ${b.cls}${b.k==='aspill'?' black':''}" style="width:16px;height:7px"></span>${esc(b.name)}</button>`).join('')}</div>
    <div class="chips">${TYPES.map(ty=>`<button class="chip${fType===ty?' on':''}" data-act="ftype" data-k="${ty}">${ty}</button>`).join('')}</div>
    <p class="tiny muted" style="margin:8px 2px">${list.length} of ${DB.techniques.length}${fBelt||fType||s?` <button class="tiny" data-act="clearf" style="color:var(--red);font-weight:600;margin-left:6px">Clear</button>`:''}</p>
    ${list.length?list.map(t=>techRow(t,true)).join(''):`<div class="empty">${DB.techniques.length?'No matches.':'No techniques yet. Tap “New technique”.'}</div>`}`;
}

/* ============================================================
   Log
   ============================================================ */
function viewLog(){
  const due=DB.techniques.filter(t=>beltIdx(t.status)<3).map(t=>({t,last:lastDone(t.id)}))
    .filter(x=>!x.last||daysSince(x.last)>=21).sort((a,b)=>(a.last||'').localeCompare(b.last||'')).slice(0,6);
  const sess=DB.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `${due.length?`<div class="box"><h4>Worth revisiting</h4>
      ${due.map(x=>`<button class="link" data-act="opentech" data-id="${x.t.id}"><span class="belt ${belt(x.t.status).cls}"></span><span style="flex:1">${esc(x.t.name)}</span><span class="w">${x.last?`${daysSince(x.last)} days ago`:'never logged'}</span></button>`).join('')}
    </div>`:''}
    ${sess.length?sess.map(s=>`<button class="sess" data-act="opensess" data-id="${s.id}">
        <b>${esc(isoToDMY(s.date))}</b>${s.notes?`<p>${esc(s.notes.length>140?s.notes.slice(0,140)+'…':s.notes)}</p>`:''}
        ${(s.techs||[]).length?`<div class="tagrow">${s.techs.map(id=>tech(id)).filter(Boolean).map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')}</div>`:''}
      </button>`).join(''):`<div class="empty">No sessions logged yet. Tap “New session” after your next class.</div>`}`;
}

/* ============================================================
   Sheets
   ============================================================ */
function openSheet(html){ closeSheet(); const sc=el('<div class="scrim"></div>'); sc.onclick=closeSheet;
  const sh=el('<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div></div>'); sh.appendChild(el(`<div>${html}</div>`));
  document.body.append(sc,sh); return sh; }
function closeSheet(){ document.querySelectorAll('.scrim,.sheet').forEach(n=>n.remove()); }
const posOptions=(cur,withSub)=>(withSub?`<option value="${SUB}" ${cur===SUB?'selected':''}>Submission</option>`:'')+
  DB.positions.map(p=>`<option value="${p.id}" ${cur===p.id?'selected':''}>${esc(p.name)}${p.side!=='neutral'?', '+esc(p.side):''}</option>`).join('');

function techSheet(id){
  const t=tech(id); if(!t) return;
  const b=belt(t.status);
  const details=(t.details||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const follows=(t.follow||[]).map(f=>({...f,t:tech(f.tech)})).filter(f=>f.t);
  const from=DB.techniques.filter(x=>(x.follow||[]).some(f=>f.tech===t.id));
  const dates=DB.sessions.filter(s=>(s.techs||[]).includes(t.id)).map(s=>s.date).sort().reverse();
  const sh=openSheet(`<h3>${esc(t.name)}</h3>
    <p class="sub">${esc(t.type)} · ${esc(b.belt)} belt</p>
    <div class="beltpick" style="margin-bottom:12px">${BELTS.map(x=>`<button class="${x.k===t.status?'on':''}" data-belt="${x.k}" aria-label="${esc(x.name)}"><span class="belt ${x.cls}${x.k==='aspill'?' black':''}"></span>${esc(x.short)}</button>`).join('')}</div>
    ${t.from||t.to?`<div class="box"><button class="link" data-goto="${t.from}" style="padding-top:0"><span class="w" style="width:34px">From</span><b style="flex:1">${esc(posName(t.from))}</b></button>
      <button class="link" data-goto="${t.to}"><span class="w" style="width:34px">To</span><b style="flex:1">${esc(posName(t.to))}</b></button>
      ${t.to===SUB&&t.sub?`<button class="link" data-goto="${SUB}"><span class="w" style="width:34px">Sub</span><b style="flex:1">${esc(subName(t.sub))}</b><span class="w">${defensesOf(t.sub).length?`${defensesOf(t.sub).length} defense${defensesOf(t.sub).length===1?'':'s'}`:'no defense yet'}</span></button>`:''}</div>`
      :`<div class="box"><p style="margin:0"><b>Any position</b> <span class="tiny muted">— works wherever the sub comes from</span></p></div>`}
    ${(t.defends||[]).length?`<div class="box"><h4>Defends against</h4>${t.defends.map((sid,i)=>`<div class="row" style="padding:5px 0;border-top:${i?'1px solid var(--rule)':'0'}"><button style="flex:1;text-align:left" data-goto="${SUB}"><b>${esc(subName(sid))}</b></button><button class="btn sm" data-undefend="${sid}">Remove</button></div>`).join('')}</div>`:''}
    ${details.length?`<div class="box"><h4>Key details</h4><ul>${details.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`:''}
    ${notesBox('Notes and counters', t.notes, 'technotes', t.id, 'What they do back, and how you answer. Anything you want to remember.')}
    ${t.video?`<a class="btn full" style="margin-bottom:10px;text-decoration:none" href="${esc(t.video)}" target="_blank" rel="noopener">Watch video</a>`:''}
    <div class="box"><h4>If they defend</h4>
      ${follows.length?follows.map((f,i)=>`<div class="row" style="padding:6px 0;border-top:${i?'1px solid var(--rule)':'0'}">
          <button style="flex:1;text-align:left" data-opentech="${f.t.id}"><span class="w muted tiny">${f.when?`when ${esc(f.when)}`:'follow-up'}</span><br><b>${esc(f.t.name)}</b></button>
          <button class="btn sm" data-unfollow="${i}" aria-label="Remove follow-up">Remove</button></div>`).join('')
        :`<p class="tiny muted" style="margin:0 0 6px">No follow-ups yet. Add what you do when they stop this one.</p>`}
      <button class="btn sm" style="margin-top:6px" data-act2="addfollow">Add follow-up</button></div>
    ${(()=>{ const defends=(t.answers||[]).map(tech).filter(Boolean), by=answersTo(t.id);
      return (defends.length?`<div class="box"><h4>Answers these threats</h4>${defends.map((x,i)=>`<div class="row" style="padding:5px 0;border-top:${i?'1px solid var(--rule)':'0'}"><button style="flex:1;text-align:left" data-opentech="${x.id}"><b>${esc(x.name)}</b><br><span class="tiny muted">from ${esc(posName(x.from))}</span></button><button class="btn sm" data-unanswer="${x.id}">Remove</button></div>`).join('')}</div>`:'')
        +(by.length?`<div class="box"><h4>How you answer this</h4>${by.map(x=>`<button class="link" data-opentech="${x.id}"><span class="belt ${belt(x.status).cls}"></span><span style="flex:1">${esc(x.name)}</span></button>`).join('')}</div>`:''); })()}
    ${from.length?`<div class="box"><h4>Comes after</h4>${from.map(x=>`<button class="link" data-opentech="${x.id}"><span class="belt ${belt(x.status).cls}"></span><span style="flex:1">${esc(x.name)}</span></button>`).join('')}</div>`:''}
    <div class="box"><h4>Covered in class</h4><p class="tiny" style="margin:0">${dates.length?dates.map(isoToDMY).join(', '):'Not logged in a session yet.'}</p></div>
    <div class="two"><button class="btn" data-act2="edit">Edit</button><button class="btn" data-goto="${t.from||SUB}">${t.from?'Show on map':'Submissions'}</button></div>`);
  sh.querySelectorAll('[data-belt]').forEach(x=>x.onclick=()=>{ t.status=x.dataset.belt; save(); render(); techSheet(t.id); toast(`${belt(t.status).belt} belt`); });
  sh.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>{ if(!x.dataset.goto) return; closeSheet(); view='kart'; focusPos=x.dataset.goto; render(); window.scrollTo(0,0); });
  sh.querySelectorAll('[data-opentech]').forEach(x=>x.onclick=()=>techSheet(x.dataset.opentech));
  sh.querySelectorAll('[data-unfollow]').forEach(x=>x.onclick=()=>{ t.follow.splice(+x.dataset.unfollow,1); save(); techSheet(t.id); });
  sh.querySelectorAll('[data-undefend]').forEach(x=>x.onclick=()=>{ t.defends=(t.defends||[]).filter(i=>i!==x.dataset.undefend); save(); render(); techSheet(t.id); });
  sh.querySelectorAll('[data-unanswer]').forEach(x=>x.onclick=()=>{ t.answers=(t.answers||[]).filter(i=>i!==x.dataset.unanswer); save(); render(); techSheet(t.id); });
  sh.querySelector('[data-act2="addfollow"]').onclick=()=>followSheet(t.id);
  sh.querySelector('[data-act="technotes"]').onclick=()=>notesSheet(t.name,'Notes and counters',t.notes,
    'What do they do back, and how do you answer?', v=>{ t.notes=v; techSheet(t.id); });
  sh.querySelector('[data-act2="edit"]').onclick=()=>techEdit(t.id);
}

/* returnTo lets the session editor hand off to "new technique" and get the
   new technique back, without losing what was already typed into the session. */
function techEdit(id, preset, returnTo){
  const t=id?tech(id):Object.assign({name:'',from:'',to:'',type:'Sweep',status:'ny',details:'',notes:'',video:'',defends:[]},preset||{});
  let defs=[...(t.defends||[])];
  const defPicks=()=>DB.subs.length?DB.subs.slice().sort((a,b)=>a.name.localeCompare(b.name,'en')).map(x=>`<button type="button" class="chip${defs.includes(x.id)?' on':''}" data-sid="${x.id}">${esc(x.name)}</button>`).join(''):'';
  const sh=openSheet(`<h3>${id?'Edit technique':'New technique'}</h3><p class="sub">Where it starts, where it ends, and what to remember.</p>
    <div class="f"><label for="tn">Name</label><input id="tn" value="${esc(t.name)}" placeholder="e.g. Scissor sweep"></div>
    <div class="f"><label for="tt">Type</label><select id="tt">${TYPES.map(x=>`<option value="${x}" ${x===t.type?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="f" id="wdef"><label>Defends against</label><div class="chips" id="tdf" style="flex-wrap:wrap;overflow:visible;padding-top:0">${defPicks()}</div>
      <div class="row" style="margin-top:6px"><input id="tdn" placeholder="Another sub, e.g. Guillotine" style="flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--rule);background:var(--card);font-size:16px"><button type="button" class="btn sm" id="tdadd">Add</button></div>
      <p class="hint">A defense doesn\u2019t need a position. Leave From and To empty and it covers the sub wherever it comes from.</p></div>
    <div class="two"><div class="f"><label for="tf">From</label><select id="tf"><option value="">Choose…</option>${posOptions(t.from,false)}</select></div>
      <div class="f"><label for="tto">To</label><select id="tto"><option value="">Choose…</option>${posOptions(t.to,true)}</select></div></div>
    <div class="f" id="wsub"><label for="tsb">Which submission?</label><input id="tsb" list="sublist" value="${esc(t.sub?subName(t.sub):'')}" placeholder="e.g. Armbar" autocomplete="off">
      <datalist id="sublist">${DB.subs.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
      <p class="hint">Groups this with the same sub from other positions. Empty = taken from the name.</p></div>
    <div class="f"><label>How well do you know it?</label><div class="beltpick" id="tb">${BELTS.map(x=>`<button type="button" class="${x.k===t.status?'on':''}" data-k="${x.k}"><span class="belt ${x.cls}${x.k==='aspill'?' black':''}"></span>${esc(x.short)}</button>`).join('')}</div></div>
    <div class="f"><label for="td">Key details</label><textarea id="td" placeholder="One detail per line">${esc(t.details)}</textarea></div>
    <div class="f"><label for="tno">Notes and counters</label><textarea id="tno" placeholder="What do they do back, and how do you answer?">${esc(t.notes)}</textarea></div>
    <div class="f"><label for="tv">Video</label><input id="tv" value="${esc(t.video)}" placeholder="https://… (ideally with a timestamp)" inputmode="url"><p class="hint">Tip: share from YouTube with a start time and the video opens right at the technique.</p></div>
    <button class="btn solid full" id="tsave">${id?'Save changes':'Save technique'}</button>
    ${id?`<button class="btn danger full" id="tdel" style="margin-top:10px">Delete technique</button>`:''}`);
  let status=t.status;
  sh.querySelectorAll('#tb [data-k]').forEach(x=>x.onclick=()=>{ status=x.dataset.k; sh.querySelectorAll('#tb [data-k]').forEach(y=>y.classList.toggle('on',y===x)); });
  const tt=sh.querySelector('#tt'), tf=sh.querySelector('#tf'), tto=sh.querySelector('#tto');
  const sync=()=>{ const isDef=tt.value==='Defense';
    sh.querySelector('#wdef').style.display=isDef?'':'none';
    sh.querySelector('#wsub').style.display=tto.value===SUB?'':'none';
    tf.options[0].textContent=tto.options[0].textContent=isDef?'No position':'Choose…'; };
  const bindDefs=()=>sh.querySelectorAll('#tdf [data-sid]').forEach(x=>x.onclick=()=>{ const i=defs.indexOf(x.dataset.sid); if(i>=0) defs.splice(i,1); else defs.push(x.dataset.sid); x.classList.toggle('on',i<0); });
  bindDefs();
  sh.querySelector('#tdadd').onclick=()=>{ const inp=sh.querySelector('#tdn'), n=inp.value.trim(); if(!n) return;
    const sb=subByName(n,true); if(!defs.includes(sb.id)) defs.push(sb.id); save(); inp.value='';
    sh.querySelector('#tdf').innerHTML=defPicks(); bindDefs(); };
  tt.onchange=()=>{ if(tt.value==='Submission') tto.value=SUB; sync(); };
  tto.onchange=sync; sync();
  sh.querySelector('#tsave').onclick=()=>{
    const name=sh.querySelector('#tn').value.trim(), from=sh.querySelector('#tf').value, to=sh.querySelector('#tto').value;
    if(!name){ sh.querySelector('#tn').classList.add('bad'); sh.querySelector('#tn').focus(); toast('Give the technique a name'); return; }
    const type=tt.value; let to2=to;
    if(type==='Defense'){ if(from&&!to) to2=from; else if(!from&&to){ toast('Choose where it starts, or leave both empty'); return; } }
    else if(!from||!to){ toast('Choose both from and to'); return; }
    const data={name,from,to:to2,type,status,details:sh.querySelector('#td').value.trim(),
      notes:sh.querySelector('#tno').value.trim(),video:sh.querySelector('#tv').value.trim(),
      defends:type==='Defense'?defs.filter(i=>DB.subs.some(x=>x.id===i)):[]};
    if(to2===SUB){ const sb=subByName(sh.querySelector('#tsb').value.trim()||famName(name),true); data.sub=sb.id; }
    let saved;
    if(id){ Object.assign(t,data); if(!data.sub) delete t.sub; saved=t; }
    else { saved={id:uid(),created:todayKey(),follow:[],...data}; DB.techniques.push(saved); }
    save(); render();
    if(returnTo) return returnTo(saved);
    techSheet(saved.id); toast(id?'Changes saved':'Technique saved');
  };
  const del=sh.querySelector('#tdel');
  if(del) del.onclick=()=>{
    if(!confirm(`Delete “${t.name}”? It\u2019s also removed from chains and sessions.`)) return;
    DB.techniques=DB.techniques.filter(x=>x.id!==t.id);
    DB.techniques.forEach(x=>{ x.follow=(x.follow||[]).filter(f=>f.tech!==t.id); x.answers=(x.answers||[]).filter(i=>i!==t.id); });
    DB.sessions.forEach(s=>s.techs=(s.techs||[]).filter(i=>i!==t.id));
    save(); closeSheet(); render(); toast('Technique deleted');
  };
  if(!id) setTimeout(()=>sh.querySelector('#tn').focus(),120);
}

/* One editor for both position notes and technique notes, so jotting something
   down after class is a single tap from wherever you are. */
function notesSheet(title, sub, value, placeholder, onSave){
  const sh=openSheet(`<h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>
    <div class="f"><textarea id="nt" style="min-height:200px" placeholder="${esc(placeholder)}">${esc(value||'')}</textarea></div>
    <button class="btn solid full" id="ntsave">Save notes</button>`);
  const ta=sh.querySelector('#nt'); setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); },120);
  sh.querySelector('#ntsave').onclick=()=>{ onSave(ta.value.trim()); save(); render(); toast('Notes saved'); };
}
function notesBox(title, text, act, id, emptyHint){
  return `<div class="box"><div class="row" style="align-items:flex-start"><h4 style="flex:1;margin:0 0 6px">${esc(title)}</h4>
      <button class="tiny" style="font-weight:650;color:var(--red)" data-act="${act}" data-id="${id}">${text?'Edit':'Add'}</button></div>
    ${text?`<p style="margin:0;white-space:pre-line">${esc(text)}</p>`:`<p class="tiny muted" style="margin:0">${esc(emptyHint)}</p>`}</div>`;
}
function answerSheet(threatId, pid){
  const th=tech(threatId); if(!th) return;
  const cands=DB.techniques.filter(x=>x.id!==th.id && !(x.answers||[]).includes(th.id))
    .sort((a,b)=>((b.from===pid)-(a.from===pid))||a.name.localeCompare(b.name,'en'));
  const sh=openSheet(`<h3>Your answer</h3><p class="sub">When they go for “${esc(th.name)}” in ${esc(posName(pid))}, what do you do?</p>
    <div id="al">${cands.length?cands.map(x=>`<button class="pick" data-id="${x.id}"><span class="belt ${belt(x.status).cls}"></span><span style="flex:1"><b>${esc(x.name)}</b><br><span class="tiny muted">${esc(x.type)} · ${esc(techWhere(x,true))}</span></span></button>`).join('')
      :`<p class="tiny muted">No other techniques yet.</p>`}</div>
    <button class="btn solid full" style="margin-top:6px" id="anew">New technique as the answer</button>`);
  const link=a=>{ a.answers=a.answers||[]; if(!a.answers.includes(th.id)) a.answers.push(th.id); save(); render(); closeSheet(); toast('Answer added'); };
  sh.querySelectorAll('#al [data-id]').forEach(x=>x.onclick=()=>link(tech(x.dataset.id)));
  sh.querySelector('#anew').onclick=()=>techEdit(null,{from:pid,to:pid,type:'Defense'},saved=>link(saved));
}
function followSheet(id){
  const t=tech(id); if(!t) return;
  /* Most natural follow-ups start where this one started or where it ends. */
  const near=x=>x.from===t.from||x.from===t.to;
  const cands=DB.techniques.filter(x=>x.id!==t.id).sort((a,b)=>(near(b)-near(a))||a.name.localeCompare(b.name,'en'));
  const sh=openSheet(`<h3>Follow-up</h3><p class="sub">What do you do when “${esc(t.name)}” gets stopped?</p>
    <div class="f"><label for="fw">When they…</label><input id="fw" placeholder="e.g. stack you, post their arm"></div>
    <div class="f"><label>Then I go to</label></div>
    <div id="fl">${cands.length?cands.map(x=>`<button class="pick" data-id="${x.id}"><span class="belt ${belt(x.status).cls}"></span><span style="flex:1"><b>${esc(x.name)}</b><br><span class="tiny muted">${esc(techWhere(x,true))}</span></span></button>`).join('')
      :`<p class="tiny muted">No other techniques yet. Save a few more first.</p>`}</div>
    <button class="btn full" style="margin-top:6px" id="fnew">New technique as follow-up</button>`);
  const add=tid=>{ t.follow=t.follow||[]; t.follow.push({tech:tid,when:sh.querySelector('#fw').value.trim()}); save(); techSheet(t.id); toast('Follow-up added'); };
  sh.querySelectorAll('#fl [data-id]').forEach(x=>x.onclick=()=>add(x.dataset.id));
  sh.querySelector('#fnew').onclick=()=>{ const when=sh.querySelector('#fw').value.trim();
    techEdit(null,{from:t.to===SUB?t.from:(t.to||'')},saved=>{ t.follow=t.follow||[]; t.follow.push({tech:saved.id,when}); save(); techSheet(t.id); toast('Follow-up added'); }); };
}

let sessDraft=null;
function sessionEdit(id, draft){
  const s=id?DB.sessions.find(x=>x.id===id):null;
  sessDraft=draft||{id:id||null,date:s?s.date:todayKey(),notes:s?s.notes:'',techs:s?[...(s.techs||[])]:[],q:''};
  const d=sessDraft;
  const picks=()=>{ const q=(d.q||'').toLowerCase();
    return DB.techniques.filter(t=>!q||t.name.toLowerCase().includes(q)||techWhere(t,true).toLowerCase().includes(q))
      .sort((a,b)=>(d.techs.includes(b.id)-d.techs.includes(a.id))||a.name.localeCompare(b.name,'en'))
      .map(t=>`<button class="pick${d.techs.includes(t.id)?' on':''}" data-id="${t.id}"><span class="ck">${d.techs.includes(t.id)?'✓':''}</span><span style="flex:1"><b>${esc(t.name)}</b><br><span class="tiny muted">${esc(techWhere(t,true))}</span></span></button>`).join('')
      ||`<p class="tiny muted">${DB.techniques.length?'No matches.':'No techniques yet.'}</p>`; };
  const sh=openSheet(`<h3>${id?'Edit session':'New session'}</h3><p class="sub">What did you cover?</p>
    <div class="f"><label for="sd">Date</label><input id="sd" value="${esc(isoToDMY(d.date))}" placeholder="DD/MM/YYYY" inputmode="numeric" maxlength="10"></div>
    <div class="f"><label for="sn">Notes</label><textarea id="sn" placeholder="Theme of the class, what clicked, what didn't">${esc(d.notes)}</textarea></div>
    <div class="f"><label for="sq">Techniques</label><input id="sq" value="${esc(d.q||'')}" placeholder="Search…" autocomplete="off"></div>
    <div id="sp">${picks()}</div>
    <button class="btn full" id="snew" style="margin:4px 0 12px">New technique from class</button>
    <button class="btn solid full" id="ssave">${id?'Save changes':'Save session'}</button>
    ${id?`<button class="btn danger full" id="sdel" style="margin-top:10px">Delete session</button>`:''}`);
  const bindPicks=()=>sh.querySelectorAll('#sp [data-id]').forEach(x=>x.onclick=()=>{
    const i=d.techs.indexOf(x.dataset.id); if(i>=0) d.techs.splice(i,1); else d.techs.push(x.dataset.id);
    sh.querySelector('#sp').innerHTML=picks(); bindPicks(); });
  bindPicks();
  sh.querySelector('#sq').oninput=e=>{ d.q=e.target.value; sh.querySelector('#sp').innerHTML=picks(); bindPicks(); };
  sh.querySelector('#sn').oninput=e=>{ d.notes=e.target.value; };
  sh.querySelector('#sd').oninput=e=>{ e.target.classList.remove('bad'); };
  sh.querySelector('#snew').onclick=()=>{
    const iso=dmyToIso(sh.querySelector('#sd').value); if(iso) d.date=iso;
    techEdit(null,{},saved=>{ d.techs.push(saved.id); sessionEdit(d.id,d); toast('Technique saved and added to the session'); });
  };
  sh.querySelector('#ssave').onclick=()=>{
    const iso=dmyToIso(sh.querySelector('#sd').value);
    if(!iso){ sh.querySelector('#sd').classList.add('bad'); toast('Date must be DD/MM/YYYY'); return; }
    const rec={id:d.id||uid(),date:iso,notes:sh.querySelector('#sn').value.trim(),techs:[...d.techs]};
    if(d.id){ Object.assign(DB.sessions.find(x=>x.id===d.id),rec); } else DB.sessions.push(rec);
    sessDraft=null; save(); closeSheet(); view='logg'; render(); toast(d.id?'Changes saved':'Session saved');
  };
  const del=sh.querySelector('#sdel');
  if(del) del.onclick=()=>{ if(!confirm('Delete this session?')) return; DB.sessions=DB.sessions.filter(x=>x.id!==d.id); save(); closeSheet(); render(); toast('Session deleted'); };
}

function positionsSheet(){
  const used=id=>DB.techniques.filter(t=>t.from===id||t.to===id).length;
  const sh=openSheet(`<h3>Positions</h3><p class="sub">The order is the ladder: best at the top. Move with the arrows.</p>
    ${DB.positions.map((p,i)=>`<div class="row box" style="padding:8px 10px;margin-bottom:6px">
      <span style="flex:1"><b>${esc(p.name)}</b> <span class="tiny muted">${esc(p.side)}</span></span>
      <button class="btn sm" data-up="${i}" ${i===0?'disabled style="opacity:.35"':''} aria-label="Move up">↑</button>
      <button class="btn sm" data-down="${i}" ${i===DB.positions.length-1?'disabled style="opacity:.35"':''} aria-label="Move down">↓</button>
      <button class="btn sm" data-ren="${i}">Rename</button>
      <button class="btn sm danger" data-del="${i}" aria-label="Delete ${esc(p.name)}">✕</button></div>`).join('')}
    <div class="box" style="margin-top:12px"><h4>New position</h4>
      <div class="two"><div class="f" style="margin:0"><input id="pn" placeholder="Name, e.g. Turtle"></div>
      <div class="f" style="margin:0"><select id="ps"><option value="top">top</option><option value="bottom">bottom</option><option value="neutral">neutral</option></select></div></div>
      <div class="f" style="margin:8px 0 0"><select id="pa">${DB.positions.map((p,i)=>`<option value="${i}">Place below ${esc(p.name)}${p.side!=='neutral'?', '+esc(p.side):''}</option>`).join('')}</select></div>
      <button class="btn full" style="margin-top:8px" id="padd">Add position</button></div>`);
  const move=(i,j)=>{ const a=DB.positions; [a[i],a[j]]=[a[j],a[i]]; save(); render(); positionsSheet(); };
  sh.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{ const i=+x.dataset.up; if(i>0) move(i,i-1); });
  sh.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>{ const i=+x.dataset.down; if(i<DB.positions.length-1) move(i,i+1); });
  sh.querySelectorAll('[data-ren]').forEach(x=>x.onclick=()=>{ const p=DB.positions[+x.dataset.ren]; const n=prompt('New name',p.name); if(n&&n.trim()){ p.name=n.trim(); save(); render(); positionsSheet(); } });
  sh.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{ const p=DB.positions[+x.dataset.del]; const n=used(p.id);
    if(n){ toast(`Used by ${n} ${n===1?'technique':'techniques'} — move them first`); return; }
    if(!confirm(`Delete ${p.name}?`)) return;
    DB.positions.splice(+x.dataset.del,1); if(focusPos===p.id) focusPos=null; save(); render(); positionsSheet(); });
  sh.querySelector('#padd').onclick=()=>{ const n=sh.querySelector('#pn').value.trim(); if(!n){ sh.querySelector('#pn').focus(); return; }
    DB.positions.splice(+sh.querySelector('#pa').value+1,0,{id:uid(),name:n,side:sh.querySelector('#ps').value}); save(); render(); positionsSheet(); toast('Position added'); };
}

function menuSheet(){
  const sh=openSheet(`<h3>Menu</h3><p class="sub">Everything is stored on this phone only. Take a backup now and then.</p>
    <button class="btn full" style="margin-bottom:8px" data-m="backup">Download backup</button>
    <label class="btn full" style="margin-bottom:8px">Restore from file<input type="file" id="imp" accept=".json,application/json" hidden></label>
    <button class="btn full" style="margin-bottom:8px" data-m="positions">Edit positions</button>
    <button class="btn full" style="margin-bottom:8px" data-m="examples">Add examples</button>
    <button class="btn danger full" data-m="wipe">Delete everything</button>`);
  sh.querySelector('[data-m="backup"]').onclick=()=>{ const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`bjj-map-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded'); };
  sh.querySelector('#imp').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
    f.text().then(txt=>{ try{ const j=JSON.parse(txt); if(!Array.isArray(j.positions)||!Array.isArray(j.techniques)) throw 0;
      if(!confirm('Replace everything on this phone with the contents of the file?')) return;
      DB=Object.assign({v:1,sessions:[],settings:{theme:'light'}},j); migrateToEnglish(); ensureSubs(); save(); applyTheme(); closeSheet(); focusPos=null; render(); toast('Restored'); }
      catch(_){ toast('That file isn\u2019t a BJJ Map backup'); } }); };
  sh.querySelector('[data-m="positions"]').onclick=positionsSheet;
  sh.querySelector('[data-m="examples"]').onclick=()=>{ addExamples(); closeSheet(); };
  sh.querySelector('[data-m="wipe"]').onclick=()=>{ if(!confirm('Delete all techniques, sessions and your own positions?')) return;
    DB={v:1,lang:'en',positions:seedPositions(),techniques:[],sessions:[],subs:[],settings:DB.settings}; focusPos=null; save(); closeSheet(); render(); toast('Everything deleted'); };
}

/* ============================================================
   Examples
   ============================================================ */
function addExamples(){
  const P=(name,side)=>{ let p=DB.positions.find(x=>x.name===name&&x.side===side);
    if(!p){ p={id:uid(),name,side}; DB.positions.push(p); } return p.id; };
  const CGb=P('Closed guard','bottom'), CGt=P('Closed guard','top'), OGt=P('Open guard','top'), SCt=P('Side control','top'),
        Mt=P('Mount','top'), Mb=P('Mount','bottom'), HGb=P('Half guard','bottom'), Bt=P('Back control','top');
  const mk=(name,from,to,type,status,details,notes)=>{ const t={id:uid(),name,from,to,type,status,details,notes:notes||'',video:'',follow:[],created:todayKey()}; DB.techniques.push(t); return t; };
  const sc=mk('Scissor sweep',CGb,Mt,'Sweep','sparring','Collar and sleeve grip\nAngle out to the side\nChop the bottom leg to the mat','They post their arm to stop it');
  const hb=mk('Hip bump sweep',CGb,Mt,'Sweep','sitter','Sit up onto your hand\nHips high and in\nRoll over their shoulder');
  const ki=mk('Kimura from guard',CGb,SUB,'Submission','drilles','Figure-four grip on the wrist\nHips out to the side\nRotate the arm behind their back');
  const ar=mk('Armbar from guard',CGb,SUB,'Submission','sitter','Pin the arm to your chest\nAngle off\nKnees together, hips up');
  const tr=mk('Triangle',CGb,SUB,'Submission','drilles','One arm in, one arm out\nAngle off\nPull the head down, squeeze the knees');
  mk('Knee cut',OGt,SCt,'Pass','sitter','Knee over their thigh\nUnderhook on the far side\nHead low');
  mk('Side control to mount',SCt,Mt,'Transition','sparring','Knee across the belly\nKeep the hips heavy\nDon\u2019t let them get their knees in');
  mk('Americana',Mt,SUB,'Submission','sitter','Wrist to the mat\nElbow up like a paintbrush');
  mk('Back take from mount',Mt,Bt,'Transition','ny','When they turn away\nFirst hook in\nSeatbelt before the second hook');
  mk('Rear naked choke',Bt,SUB,'Submission','aspill','Seatbelt grip\nElbow under the chin\nPush the head forward with the other hand');
  mk('Upa (bridge escape)',Mb,CGt,'Reversal','sparring','Trap arm and foot on the same side\nBridge high over the shoulder\nLand in their guard');
  mk('Elbow–knee escape',Mb,HGb,'Escape','drilles','Elbow to knee\nShrimp out\nTrap their foot');
  const am=DB.techniques.find(x=>x.name==='Americana'&&x.from===Mt);
  const amd=mk('Americana defense',Mb,Mb,'Defense','drilles','Elbows tight to your ribs\nGrab your own collar\nBridge as they reach for the wrist');
  if(am) amd.answers=[am.id];
  ensureSubs();
  const armSub=subByName('Armbar',true);
  const hh=mk('Hitchhiker escape','','','Defense','ny','Thumb points to the mat\nWalk your feet around toward their head\nPull the elbow out as you come up');
  hh.defends=[armSub.id];
  sc.follow.push({tech:hb.id,when:'they post their arm'});
  hb.follow.push({tech:ki.id,when:'they sit back'});
  ar.follow.push({tech:tr.id,when:'they stack you'});
  const d1=new Date(); d1.setDate(d1.getDate()-3); const d2=new Date(); d2.setDate(d2.getDate()-30);
  DB.sessions.push({id:uid(),date:todayKey(d1),notes:'Guard sweeps. Hip bump finally landed in sparring.',techs:[sc.id,hb.id,ki.id]});
  DB.sessions.push({id:uid(),date:todayKey(d2),notes:'Armbar and triangle from guard.',techs:[ar.id,tr.id]});
  save(); render(); toast('Examples added');
}

/* The app started out in Norwegian. Anything that came from its built-in
   defaults (positions, types, the example set) is translated in place; text
   the user typed themselves is left exactly as written. */
function migrateToEnglish(){
  if(DB.lang==='en') return;
  const POS={'Ryggen deres':'Back control','Halv guard':'Half guard','Åpen guard':'Open guard','Lukket guard':'Closed guard',
    'Stående':'Standing','Ryggen min er tatt':'Back taken'};
  const SIDE={'over':'top','under':'bottom','nøytral':'neutral'};
  const TYPE={'Passering':'Pass','Flukt':'Escape','Overgang':'Transition'};
  const EX={
    'Saks-sweep':['Scissor sweep','Collar and sleeve grip\nAngle out to the side\nChop the bottom leg to the mat','They post their arm to stop it'],
    'Hip bump-sweep':['Hip bump sweep','Sit up onto your hand\nHips high and in\nRoll over their shoulder'],
    'Kimura fra guard':['Kimura from guard','Figure-four grip on the wrist\nHips out to the side\nRotate the arm behind their back'],
    'Armbar fra guard':['Armbar from guard','Pin the arm to your chest\nAngle off\nKnees together, hips up'],
    'Triangel':['Triangle','One arm in, one arm out\nAngle off\nPull the head down, squeeze the knees'],
    'Over til mount':['Side control to mount','Knee across the belly\nKeep the hips heavy\nDon\u2019t let them get their knees in'],
    'Americana':['Americana','Wrist to the mat\nElbow up like a paintbrush'],
    'Ta ryggen fra mount':['Back take from mount','When they turn away\nFirst hook in\nSeatbelt before the second hook'],
    'Rear naked choke':['Rear naked choke','Seatbelt grip\nElbow under the chin\nPush the head forward with the other hand'],
    'Knee cut':['Knee cut','Knee over their thigh\nUnderhook on the far side\nHead low'],
    'Upa (bro-flukt)':['Upa (bridge escape)','Trap arm and foot on the same side\nBridge high over the shoulder\nLand in their guard'],
    'Albue–kne-flukt':['Elbow–knee escape','Elbow to knee\nShrimp out\nTrap their foot'],
  };
  const WHEN={'de poster armen':'they post their arm','de setter seg tilbake':'they sit back','de stabler deg':'they stack you'};
  const NOTES={'Guard-sweeps. Hip bump satt endelig i sparring.':'Guard sweeps. Hip bump finally landed in sparring.',
    'Armbar og triangel fra guard.':'Armbar and triangle from guard.'};
  DB.positions.forEach(p=>{ if(POS[p.name]) p.name=POS[p.name]; if(SIDE[p.side]) p.side=SIDE[p.side]; });
  DB.techniques.forEach(t=>{
    if(TYPE[t.type]) t.type=TYPE[t.type];
    const ex=EX[t.name];
    /* only rewrite an example if its details are still the untouched originals */
    if(ex && (!t.details || /[æøå]|Vinkel|Hofta|Kne |Albue|Grip på|Sett deg/.test(t.details))){ t.name=ex[0]; t.details=ex[1]; if(ex[2]&&/armen for å stoppe/.test(t.notes||'')) t.notes=ex[2]; }
    (t.follow||[]).forEach(f=>{ if(WHEN[f.when]) f.when=WHEN[f.when]; });
  });
  DB.sessions.forEach(s=>{ if(NOTES[s.notes]) s.notes=NOTES[s.notes]; });
  DB.lang='en';
}

/* ============================================================
   Wiring
   ============================================================ */
function applyTheme(){ const dark=DB.settings.theme==='dark';
  document.documentElement.classList.toggle('dark',dark);
  document.querySelector('meta[name=theme-color]').content=dark?'#11161C':'#EEF1F3'; }
document.addEventListener('click',e=>{
  if(e.target.closest('.sheet')) return;
  const tb=e.target.closest('[data-tab]'); if(tb){ view=tb.dataset.tab; if(view!=='kart') focusPos=null; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='focus'){ if(!b.dataset.id) return; focusPos=b.dataset.id; view='kart'; render(); window.scrollTo(0,0); }
  else if(a==='unfocus'){ focusPos=null; render(); }
  else if(a==='opentech') techSheet(b.dataset.id);
  else if(a==='subinfo') subSheet(b.dataset.id);
  else if(a==='newsub') subSheet(null);
  else if(a==='adddef') defenseSheet(b.dataset.id);
  else if(a==='addanswer') answerSheet(b.dataset.id, b.dataset.pos);
  else if(a==='posnotes'){ const p=pos(b.dataset.id); if(!p) return;
    notesSheet(posName(p.id),'Notes for this position',p.notes,'Goals here, grips, what to avoid…', v=>{ p.notes=v; closeSheet(); }); }
  else if(a==='newfrom') techEdit(null,{from:b.dataset.id});
  else if(a==='opensess') sessionEdit(b.dataset.id);
  else if(a==='positions') positionsSheet();
  else if(a==='examples') addExamples();
  else if(a==='menu') menuSheet();
  else if(a==='theme'){ DB.settings.theme=DB.settings.theme==='dark'?'light':'dark'; save(); applyTheme(); render(); }
  else if(a==='fbelt'){ fBelt=fBelt===b.dataset.k?null:b.dataset.k; render(); }
  else if(a==='ftype'){ fType=fType===b.dataset.k?null:b.dataset.k; render(); }
  else if(a==='clearf'){ fBelt=null; fType=null; tq=''; render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='tq'){ tq=e.target.value; const pos=e.target.selectionStart; render(); const f=$('#tq'); if(f){ f.focus(); try{ f.setSelectionRange(pos,pos); }catch(_){} } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
ensureSubs(); applyTheme(); render();
</script>
