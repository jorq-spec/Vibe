<title>The Medium</title>
<style>
:root{
  --bg:#120E1C; --surface:#1C1728; --surface2:#251E34; --surface3:#2F2742;
  --line:#332B47; --line-soft:#261F36;
  --text:#EDE8F5; --muted:#A79CC0; --faint:#7A6E96;
  --gold:#D9A441; --gold-soft:#3A2C12; --gold-text:#F0C572;
  --rev:#C2607A; --rev-soft:#3A1B26;
  --maj:#8B7BD8; --maj-soft:#2A2347;
  --ild:#D0703C; --vann:#4A9BC4; --luft:#9AA7C9; --jord:#6E9D68;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:-apple-system,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  --eye-line:#F0C572; --eye-iris:#D9A441;
  color-scheme:dark;
}
html.light{
  --bg:#F5F1E8; --surface:#FFFFFF; --surface2:#EFE9DC; --surface3:#E4DCCB;
  --line:#DCD2BF; --line-soft:#EAE3D5;
  --text:#241E33; --muted:#5C5270; --faint:#8A7F9C;
  --gold:#9C6F17; --gold-soft:#F3E6CA; --gold-text:#7A5610;
  --rev:#A33552; --rev-soft:#F7E2E7;
  --maj:#5A4AA8; --maj-soft:#E8E4F7;
  --eye-line:#7A5610; --eye-iris:#9C6F17;
  color-scheme:light;
}
html.light .topbar{background:rgba(245,241,232,.93)}
html.light .tabs{background:rgba(245,241,232,.96)}
html.light .slot.filled{background:linear-gradient(160deg,#FFFDF8,#F1EADC)}
html.light .slot.filled.maj{background:linear-gradient(160deg,#EFEBFB,#E6E0F6);border-color:#C4BAE8}
html.light .slot.filled.reversed{border-color:#D9A8B6}
html.light .toast{background:#241E33;color:#F5F1E8}
html.light .scrim{background:rgba(36,30,51,.35)}
html.light .pip.ild{background:#FBE7DC;color:#A6522A} html.light .pip.vann{background:#DDEDF5;color:#2E6C8E}
html.light .pip.luft{background:#E7EAF2;color:#5A6484} html.light .pip.jord{background:#E3EFE1;color:#456B41}
html.light .pip.major{background:var(--maj-soft);color:var(--maj)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(18,14,28,.93);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft)}
.topbar .logo{width:36px;height:26px;flex:none}
.topbar .brand{flex:1;min-width:0}
.topbar h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.topbar h1 span{display:none}
.topbar .by{display:block;font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.topbar .iconbtn[data-act="lang"]{font-size:12px;font-weight:700}
.topbar .iconbtn{font-size:15px}
html.light .topbar .iconbtn .moon,html:not(.light) .topbar .iconbtn .sun{display:none}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.wrap{padding:14px 16px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,14,28,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line-soft);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:11px;font-weight:600;color:var(--faint);border-radius:8px}
.tabs button b{font-size:15px;font-weight:700;line-height:1}
.tabs button[aria-selected="true"]{color:var(--gold-text)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.spread-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.spread-head h2{font-family:var(--serif);font-size:19px;font-weight:600}
.sub{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border-radius:11px;font-weight:600;font-size:14.5px;border:1px solid var(--line);background:var(--surface2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#20180A;font-weight:700}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:12.5px} .faint{color:var(--faint)}

/* ---- layout board ---- */
.board{position:relative;display:grid;gap:7px;margin:6px 0 4px}
.board.wide{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.slot{position:relative;aspect-ratio:0.62;border-radius:9px;border:1px dashed var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;overflow:hidden}
.slot .pos{font-size:9.5px;color:var(--faint);line-height:1.15;letter-spacing:.02em}
.slot.filled{border-style:solid;border-color:var(--line);background:linear-gradient(160deg,#241D33,#1A1528)}
.slot.filled.maj{border-color:#4E4380;background:linear-gradient(160deg,#2A2347,#1D1832)}
.slot.filled.reversed{border-color:#6B3446}
.slot .nm{font-family:var(--serif);font-size:11px;line-height:1.2;color:var(--text);padding:0 2px}
.slot .rk{font-size:9px;color:var(--muted);margin-top:2px}
.slot .rv{position:absolute;top:3px;right:4px;font-size:9px;color:var(--rev)}
.slot .ix{position:absolute;top:3px;left:5px;font-size:9px;color:var(--faint);font-weight:700}
.slot.reversed .nm{transform:rotate(180deg)}
.slot.cross{border-style:solid}
.slot.cross::after{content:'✛';position:absolute;bottom:3px;right:5px;font-size:10px;color:var(--faint)}
.slot.active{outline:2px solid var(--gold);outline-offset:1px}

/* ---- card list ---- */
.clist{display:flex;flex-direction:column}
.citem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line-soft)}
.citem:last-child{border-bottom:0}
.pip{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;background:var(--surface2);color:var(--muted)}
.pip.ild{background:#33190F;color:var(--ild)} .pip.vann{background:#102630;color:var(--vann)}
.pip.luft{background:#1E222E;color:var(--luft)} .pip.jord{background:#162415;color:var(--jord)}
.pip.major{background:var(--maj-soft);color:var(--maj)}
.citem .b{flex:1;min-width:0}
.citem .b b{display:block;font-family:var(--serif);font-size:15.5px;font-weight:600}
.citem .b span{font-size:12px;color:var(--faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .go{color:var(--faint);font-size:13px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-text)}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:2px}
.sh-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.f textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold-soft);color:var(--gold-text)}
.mean{font-size:14.5px;line-height:1.55;margin-top:6px}
.kw{font-size:12.5px;color:var(--gold-text);margin-top:2px}
.kw.rev{color:var(--rev)}
.blk{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px}
.blk h5{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.infoblk{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.infoblk h5{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.infoblk p{font-size:13px;line-height:1.4}
.yn{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.yn.yes{background:#1C3A2A;color:#7FD9A0} .yn.no{background:#3A1C26;color:var(--rev)} .yn.unclear{background:var(--surface3);color:var(--muted)}
.learn{margin-bottom:10px}
.learn summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--gold-text);text-transform:uppercase;letter-spacing:.05em;list-style:none}
.learn summary::-webkit-details-marker{display:none}
.learn summary::before{content:'▸ ';display:inline-block}
.learn[open] summary::before{content:'▾ '}
.learn .body{font-size:13.5px;line-height:1.55;color:var(--muted);margin-top:8px;white-space:pre-line}
.read .pos{cursor:pointer}
.read .pos:active{background:var(--surface2)}
html.light .yn.yes{background:#DCF3E4;color:#1E7A45} html.light .yn.no{background:#F7DCE3;color:var(--rev)}

/* ---- reading ---- */
.read .pos{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.read .pos:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.read .pos h4{font-size:12px;font-weight:700;color:var(--gold-text);text-transform:uppercase;letter-spacing:.05em}
.read .pos .cn{font-family:var(--serif);font-size:17px;font-weight:600;margin:2px 0 4px}
.read .pos .cn em{font-style:normal;font-size:12px;color:var(--rev);font-weight:600;letter-spacing:.03em}
.read .pos p{font-size:14.5px;color:var(--muted);line-height:1.5}
.pat{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pat span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pat span.hi{background:var(--maj-soft);color:var(--maj)}
.empty{text-align:center;color:var(--faint);padding:36px 20px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:40;white-space:nowrap}
.hist{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.hist .b{flex:1}.hist .b b{display:block;font-weight:600}.hist .b span{font-size:12.5px;color:var(--faint)}
</style>
</head>

<script>
const CARDS = [{"id": "m0", "en": "The Fool", "no": "Narren", "arcana": "major", "suit": "", "element": "", "num": 0, "ku": "nybegynnelse, tillit, sprang", "kr": "naivitet, nøling, uoverlagt", "up": "En begynnelse uten fasit. Du har lite å vise til ennå, og nettopp derfor står alt åpent. Tør å ta steget.", "rev": "Enten holder du igjen der du burde hoppet, eller du hopper uten å se. Sjekk hva du faktisk risikerer.", "kuEn": "new beginnings, trust, a leap", "krEn": "naivety, hesitation, recklessness", "upEn": "A start with nothing to show for it yet, and that is exactly why everything is still open. Dare to take the step.", "revEn": "You either hold back where you should have jumped, or you jump without looking. Check what you actually stand to lose.", "astroNo": "Uranus", "astroEn": "Uranus", "elementNo": "Luft", "elementEn": "Air", "numNo": "0 → 0: Åpent potensial, et ubeskrevet blad", "numEn": "0 → 0: Open potential, a blank page", "adviceNo": "Ta steget mens du fortsatt er lett til beins.", "adviceEn": "Take the step while you're still light on your feet.", "polarity": "neu", "longNo": "En ung skikkelse i fargerike klær går mot kanten av et stup, en liten hund hopper etter ham, en pose på en stav over skulderen, sola skinner bak ham, en hvit rose i hånden.\n\nLær det som: kortet før historien begynner. Alle de andre 77 kortene er en versjon av det som skjer etter at Narren tar steget.", "longEn": "A young figure in colourful clothes walks toward the edge of a cliff, a small dog leaping at his heels, a bundle on a stick over his shoulder, the sun shining behind him, a white rose in one hand.\n\nLearn it as: the card before the story begins. All the other 77 cards are some version of what happens after the Fool takes the step."}, {"id": "m1", "en": "The Magician", "no": "Magikeren", "arcana": "major", "suit": "", "element": "", "num": 1, "ku": "vilje, evne, manifestasjon", "kr": "manipulasjon, spredt fokus, tomme ord", "up": "Du har alt du trenger for hånden. Det handler ikke om flere ressurser, men om å bruke dem bevisst.", "rev": "Evnene brukes til å overbevise heller enn å skape, eller kreftene spres på for mye samtidig.", "kuEn": "will, skill, manifestation", "krEn": "manipulation, scattered focus, empty words", "upEn": "You already have everything you need close at hand. The question isn't more resources, it's using them deliberately.", "revEn": "Skill gets used to persuade rather than create, or your power is spread across too much at once.", "astroNo": "Merkur", "astroEn": "Mercury", "elementNo": "Luft", "elementEn": "Air", "numNo": "1 → 1: Ny begynnelse, initiativ", "numEn": "1 → 1: A new beginning, initiative", "adviceNo": "Bruk det du alt har i hendene.", "adviceEn": "Use what's already in your hands.", "polarity": "pos", "longNo": "En skikkelse står bak et bord med én arm løftet mot himmelen, den andre pekende ned mot jorden, et evighetstegn svever over hodet, bordet bærer et beger, et sverd, en mynt og en stav.\n\nLær det som: alle fire elementene ligger klare på bordet. Magikeren er ikke kraften selv, men den som vet hvordan den skal brukes.", "longEn": "A figure stands behind a table with one arm raised to the sky, the other pointing down to the earth, an infinity symbol hovering above his head, the table holding a cup, a sword, a coin and a wand.\n\nLearn it as: all four elements already sit on the table. The Magician isn't the power itself, but the one who knows how to use it."}, {"id": "m2", "en": "The High Priestess", "no": "Yppersteprestinnen", "arcana": "major", "suit": "", "element": "", "num": 2, "ku": "intuisjon, indre viten, taushet", "kr": "fortrengning, hemmelighold, mistillit til seg selv", "up": "Svaret finnes, men ikke i noe du kan argumentere deg fram til. Lytt innover og la det være uferdig en stund til.", "rev": "Du overkjører magefølelsen med fornuft, eller noe holdes skjult – av deg eller for deg.", "kuEn": "intuition, inner knowing, silence", "krEn": "repression, secrecy, distrust of yourself", "upEn": "The answer is already there, but not one you can argue your way to. Listen inward and let it stay unfinished a while longer.", "revEn": "You override your gut feeling with logic, or something is being kept hidden — by you or from you.", "astroNo": "Månen", "astroEn": "the Moon", "elementNo": "Vann", "elementEn": "Water", "numNo": "2 → 2: Møte, valg, balanse", "numEn": "2 → 2: A meeting, a choice, balance", "adviceNo": "Ikke forklar det ennå – la det modnes i stillhet.", "adviceEn": "Don't explain it yet — let it mature in silence.", "polarity": "neu", "longNo": "En sittende kvinne mellom to søyler, én svart én hvit, en halvmåne ved føttene, en bokrull merket TORA i fanget, et slør bak henne mønstret med granatepler.\n\nLær det som: motstykket til Magikeren. Der han handler utad, sitter hun stille og vet noe hun ikke sier.", "longEn": "A seated woman between two pillars, one black, one white, a crescent moon at her feet, a scroll marked TORA in her lap, a veil behind her patterned with pomegranates.\n\nLearn it as: the counterpart to the Magician. Where he acts outward, she sits still and knows something she isn't saying."}, {"id": "m3", "en": "The Empress", "no": "Keiserinnen", "arcana": "major", "suit": "", "element": "", "num": 3, "ku": "vekst, omsorg, overflod", "kr": "overinvolvering, stagnasjon, forsømmelse", "up": "Noe gror. Gi det næring og tid framfor å styre det. Sanselighet, kropp og skapende arbeid står sterkt.", "rev": "Enten kveler du noe med omsorg, eller du forsømmer det som trenger deg – inkludert deg selv.", "kuEn": "growth, nurture, abundance", "krEn": "overinvolvement, stagnation, neglect", "upEn": "Something is growing. Feed it and give it time rather than trying to steer it. Sensuality, body and creative work are strong here.", "revEn": "Either you're smothering something with care, or you're neglecting what needs you — including yourself.", "astroNo": "Venus", "astroEn": "Venus", "elementNo": "Jord", "elementEn": "Earth", "numNo": "3 → 3: Vekst gjennom samspill", "numEn": "3 → 3: Growth through interaction", "adviceNo": "Gi det tid og næring, ikke retning.", "adviceEn": "Give it time and nourishment, not direction.", "polarity": "pos", "longNo": "En sittende kvinne i en flytende kjole på en pute-tronen i et hvetefelt, et hjerteformet skjold med Venus-symbolet ved siden av henne, en skog og en foss i bakgrunnen.\n\nLær det som: jorden selv, gravid med mulighet. Alt vokser rundt henne uten at hun anstrenger seg.", "longEn": "A seated woman in a flowing gown on a cushioned throne in a wheat field, a heart-shaped shield with the Venus symbol beside her, a forest and waterfall behind.\n\nLearn it as: the earth itself, pregnant with possibility. Everything grows around her without her having to strain."}, {"id": "m4", "en": "The Emperor", "no": "Keiseren", "arcana": "major", "suit": "", "element": "", "num": 4, "ku": "struktur, autoritet, grenser", "kr": "stivhet, kontrollbehov, maktmisbruk", "up": "Orden gir frihet her. Sett rammer, ta ansvaret som er ditt, og bygg noe som tåler vekt.", "rev": "Kontrollen har blitt et bur. Spør om reglene tjener saken eller bare bekrefter hvem som bestemmer.", "kuEn": "structure, authority, boundaries", "krEn": "rigidity, control issues, abuse of power", "upEn": "Order buys freedom here. Set the frame, take the responsibility that's yours, and build something that can bear weight.", "revEn": "Control has become a cage. Ask whether the rules serve the cause or just confirm who's in charge.", "astroNo": "Væren", "astroEn": "Aries", "elementNo": "Ild", "elementEn": "Fire", "numNo": "4 → 4: Grunnmur, struktur", "numEn": "4 → 4: A foundation, structure", "adviceNo": "Sett rammen før du bygger videre.", "adviceEn": "Set the frame before you build further.", "polarity": "neu", "longNo": "En skjegget skikkelse sitter på en steintrone utskåret med værhoder, holder et septer og en kule, fjell i bakgrunnen, rustning synlig under kappen.\n\nLær det som: Keiserinnens motstykke. Hun skaper, han bygger rammen rundt det som er skapt.", "longEn": "A bearded figure sits on a stone throne carved with ram's heads, holding a sceptre and an orb, mountains behind him, armour visible beneath his robe.\n\nLearn it as: the Empress's counterpart. She creates; he builds the frame around what's created."}, {"id": "m5", "en": "The Hierophant", "no": "Hierofanten", "arcana": "major", "suit": "", "element": "", "num": 5, "ku": "tradisjon, læring, tilhørighet", "kr": "dogmatisme, opprør, tom form", "up": "Noen har gått veien før deg. Søk en lærer, en metode eller et fellesskap i stedet for å finne opp alt selv.", "rev": "Formen har mistet innholdet. Enten følger du en tradisjon som ikke lenger passer, eller du avviser den for avvisningens skyld.", "kuEn": "tradition, learning, belonging", "krEn": "dogmatism, rebellion, empty form", "upEn": "Someone has walked this road before. Look for a teacher, a method or a community instead of inventing everything yourself.", "revEn": "The form has lost its content. Either you're following a tradition that no longer fits, or rejecting it just to rebel.", "astroNo": "Tyren", "astroEn": "Taurus", "elementNo": "Jord", "elementEn": "Earth", "numNo": "5 → 5: Uro, endring, prøving", "numEn": "5 → 5: Unrest, change, testing", "adviceNo": "Spør noen som har gått veien før deg.", "adviceEn": "Ask someone who has walked this road before.", "polarity": "neu", "longNo": "En kledd skikkelse sitter mellom to søyler i en kapellaktig setting, to disipler kneler foran ham, hånden løftet i velsignelse, en trippel korsstav i den andre, to krysslagte nøkler ved føttene.\n\nLær det som: den formelle motsatsen til Yppersteprestinnen. Hennes visdom er privat; hans læres bort.", "longEn": "A robed figure sits between two pillars in a chapel-like setting, two acolytes kneeling before him, one hand raised in blessing, a triple-crossed staff in the other, two crossed keys at his feet.\n\nLearn it as: the formal counterpart to the High Priestess. Her wisdom is private; his is taught."}, {"id": "m6", "en": "The Lovers", "no": "De Elskende", "arcana": "major", "suit": "", "element": "", "num": 6, "ku": "valg, forening, verdier", "kr": "ubesluttsomhet, ubalanse, verdikonflikt", "up": "Et valg som krever at du vet hva du står for. Handler like mye om verdier som om kjærlighet.", "rev": "Du utsetter valget, eller har valgt mot noe du egentlig mener. Ubalanse mellom to parter.", "kuEn": "choice, union, values", "krEn": "indecision, imbalance, conflicting values", "upEn": "A choice that requires knowing what you stand for. As much about values as about love.", "revEn": "You're stalling the decision, or you already chose against something you actually believe in. An imbalance between two parties.", "astroNo": "Tvillingene", "astroEn": "Gemini", "elementNo": "Luft", "elementEn": "Air", "numNo": "6 → 6: Justering, harmoni", "numEn": "6 → 6: Adjustment, harmony", "adviceNo": "Velg ut fra det du står for, ikke det som er enklest.", "adviceEn": "Choose from what you stand for, not what's easiest.", "polarity": "neu", "longNo": "En mann og en kvinne står nakne under en engel med utstrakte vinger, et tre med en slange bak kvinnen, et tre i flammer bak mannen, et fjell mellom dem, solen over.\n\nLær det som: et valg forkledd som romantikk. Legg merke til at engelen ser ned på dem, ikke motsatt – noen andre vurderer.", "longEn": "A man and a woman stand naked beneath an angel with outstretched wings, a tree with a serpent behind the woman, a tree in flames behind the man, a mountain between them, the sun overhead.\n\nLearn it as: a choice disguised as romance. Notice the angel looks down at them, not the other way — someone else is weighing this too."}, {"id": "m7", "en": "The Chariot", "no": "Vognen", "arcana": "major", "suit": "", "element": "", "num": 7, "ku": "framdrift, viljestyrke, retning", "kr": "spredning, aggresjon, tap av kontroll", "up": "Motstridende krefter kan trekke samme vei hvis du holder tømmene. Sett kursen og hold den.", "rev": "Farten er der, men retningen mangler – eller viljen har blitt kjørt på tvers av alt annet.", "kuEn": "momentum, willpower, direction", "krEn": "scattering, aggression, loss of control", "upEn": "Opposing forces can pull the same way if you hold the reins. Set the course and hold it.", "revEn": "The speed is there, but the direction is missing — or the will has been driven straight through everything else.", "astroNo": "Krepsen", "astroEn": "Cancer", "elementNo": "Vann", "elementEn": "Water", "numNo": "7 → 7: Fordypning, innsikt", "numEn": "7 → 7: Reflection, insight", "adviceNo": "Hold retningen, selv når kreftene drar ulikt.", "adviceEn": "Hold the course, even when the forces pull differently.", "polarity": "pos", "longNo": "En rustningskledd skikkelse står i en steinvogn trukket av to sfinkser, én svart én hvit, et stjernehimmel-telt over, en by bak ham.\n\nLær det som: viljestyrke i bevegelse. Sfinksene trekker i hver sin retning – kusken vinner ikke med tømmer, men med blikk.", "longEn": "An armoured figure stands in a stone chariot pulled by two sphinxes, one black, one white, a starry canopy above, a city behind him.\n\nLearn it as: willpower in motion. The sphinxes pull in opposite directions — the driver wins not with reins, but with focus."}, {"id": "m8", "en": "Strength", "no": "Styrke", "arcana": "major", "suit": "", "element": "", "num": 8, "ku": "tålmodig mot, mildhet, mestring", "kr": "selvtvil, utålmodighet, undertrykt sinne", "up": "Styrken ligger i å tåle, ikke i å overmanne. Møt det ville i deg og andre med fasthet og varme.", "rev": "Du tror du er svakere enn du er, eller du presser ned noe som må få komme til uttrykk.", "kuEn": "patient courage, gentleness, mastery", "krEn": "self-doubt, impatience, suppressed anger", "upEn": "Strength lies in enduring, not overpowering. Meet what's wild in you and others with firmness and warmth.", "revEn": "You believe you're weaker than you are, or you're pushing down something that needs to be expressed.", "astroNo": "Løven", "astroEn": "Leo", "elementNo": "Ild", "elementEn": "Fire", "numNo": "8 → 8: Kraft satt i bevegelse", "numEn": "8 → 8: Power set in motion", "adviceNo": "Møt det vanskelige med fasthet, ikke makt.", "adviceEn": "Meet the hard thing with firmness, not force.", "polarity": "pos", "longNo": "En kvinne lukker forsiktig kjeften på en løve, et evighetstegn over hodet hennes, en blomsterkrans rundt livet, et fjellandskap bak.\n\nLær det som: makt uten vold. Hun bruker ikke kraft mot løven, bare ro.", "longEn": "A woman gently closes the jaws of a lion, an infinity symbol above her head, a garland of flowers around her waist, a mountain landscape behind.\n\nLearn it as: power without violence. She doesn't use force against the lion, only calm."}, {"id": "m9", "en": "The Hermit", "no": "Eremitten", "arcana": "major", "suit": "", "element": "", "num": 9, "ku": "tilbaketrekning, ettertanke, søken", "kr": "isolasjon, avvisning av hjelp, tomhet", "up": "Trekk deg tilbake med vilje. Svaret kommer i stillhet, ikke i flere samtaler.", "rev": "Ensomheten har sluttet å være nyttig. Eller du nekter å ta imot veiledning du trenger.", "kuEn": "withdrawal, reflection, seeking", "krEn": "isolation, refusing help, emptiness", "upEn": "Pull back deliberately. The answer comes in stillness, not in more conversations.", "revEn": "The solitude has stopped being useful. Or you're refusing guidance you actually need.", "astroNo": "Jomfruen", "astroEn": "Virgo", "elementNo": "Jord", "elementEn": "Earth", "numNo": "9 → 9: Modning, nær fullføring", "numEn": "9 → 9: Maturing, nearing completion", "adviceNo": "Trekk deg tilbake før du trenger svar fra andre.", "adviceEn": "Withdraw before you need answers from others.", "polarity": "neu", "longNo": "En gammel mann i grå kappe står på en snødekt topp og holder en lykt med en sekstakket stjerne inni, samt en stav.\n\nLær det som: lyset han bærer lyser bare noen skritt foran ham. Det er nok.", "longEn": "An old man in a grey cloak stands on a snowy peak, holding a lantern with a six-pointed star inside, and a staff.\n\nLearn it as: the light he carries only shows a few steps ahead. That's enough."}, {"id": "m10", "en": "Wheel of Fortune", "no": "Lykkehjulet", "arcana": "major", "suit": "", "element": "", "num": 10, "ku": "vendepunkt, skjebne, sykluser", "kr": "motgang, motstand mot endring, uflaks", "up": "Noe snur uten at du styrer det. Merk deg mønsteret – dette har vært her før.", "rev": "Du kjemper mot en bevegelse du ikke kan stoppe, eller hjulet snur nedover en periode.", "kuEn": "turning point, fate, cycles", "krEn": "setback, resistance to change, bad luck", "upEn": "Something turns without you steering it. Notice the pattern — this has been here before.", "revEn": "You're fighting a movement you can't stop, or the wheel is turning downward for a while.", "astroNo": "Jupiter", "astroEn": "Jupiter", "elementNo": "Ild", "elementEn": "Fire", "numNo": "10 → 1: Ny begynnelse, initiativ", "numEn": "10 → 1: A new beginning, initiative", "adviceNo": "Legg merke til mønsteret i stedet for å kjempe mot det.", "adviceEn": "Notice the pattern instead of fighting it.", "polarity": "neu", "longNo": "Et stort hjul svever på himmelen, merket med alkymiske symboler, en sfinks med sverd på toppen, en slange og en sjakalhodet skikkelse på sidene, fire vingede skapninger leser bøker i hjørnene.\n\nLær det som: det eneste kortet der ingen av figurene styrer noe. Alle bare holder fast eller ser på.", "longEn": "A great wheel floats in the sky, marked with alchemical symbols, a sphinx with a sword atop it, a serpent and a jackal-headed figure on its sides, four winged creatures reading books in the corners.\n\nLearn it as: the one card where none of the figures are actually steering anything. Everyone is either holding on or watching."}, {"id": "m11", "en": "Justice", "no": "Rettferdighet", "arcana": "major", "suit": "", "element": "", "num": 11, "ku": "sannhet, konsekvens, balanse", "kr": "urett, ansvarsfraskrivelse, skjevhet", "up": "Handlinger får følger. Se saken kaldt og ærlig, uten å pynte på din egen del.", "rev": "Noe er skjevt og blir ikke rettet opp. Eller du løper fra din del av regningen.", "kuEn": "truth, consequence, balance", "krEn": "injustice, shirking responsibility, imbalance", "upEn": "Actions have consequences. Look at the matter coldly and honestly, without dressing up your own part in it.", "revEn": "Something is off balance and stays that way. Or you're running from the part of the bill that's yours.", "astroNo": "Vekten", "astroEn": "Libra", "elementNo": "Luft", "elementEn": "Air", "numNo": "11 → 2: Møte, valg, balanse", "numEn": "11 → 2: A meeting, a choice, balance", "adviceNo": "Se din egen del av saken først.", "adviceEn": "Look at your own part in this first.", "polarity": "neu", "longNo": "En kronet skikkelse sitter mellom to søyler, holder et oppreist sverd i den ene hånden og en balansert vekt i den andre.\n\nLær det som: sverdet og vekten er to steg i samme prosess – først vurdere, så handle.", "longEn": "A crowned figure sits between two pillars, holding an upright sword in one hand and a balanced scale in the other.\n\nLearn it as: the sword and the scale are two steps in the same process — weigh first, then act."}, {"id": "m12", "en": "The Hanged Man", "no": "Den Hengte", "arcana": "major", "suit": "", "element": "", "num": 12, "ku": "perspektivskifte, venting, ofring", "kr": "fastlåsthet, martyrium, unngåelse", "up": "Situasjonen løses ikke med handling nå. Snu den på hodet og se hva du får øye på.", "rev": "Ventingen har blitt en unnskyldning, eller du ofrer noe ingen har bedt om.", "kuEn": "shift in perspective, waiting, sacrifice", "krEn": "being stuck, martyrdom, avoidance", "upEn": "The situation isn't solved by acting right now. Turn it upside down and see what comes into view.", "revEn": "The waiting has become an excuse, or you're sacrificing something nobody asked for.", "astroNo": "Neptun", "astroEn": "Neptune", "elementNo": "Vann", "elementEn": "Water", "numNo": "12 → 3: Vekst gjennom samspill", "numEn": "12 → 3: Growth through interaction", "adviceNo": "Snu det på hodet før du gjør noe mer.", "adviceEn": "Turn it upside down before you do anything else.", "polarity": "neu", "longNo": "En ung mann henger opp ned etter én fot fra en T-formet trebjelke, det andre benet krysset bak, hendene bundet bak ryggen, en gyllen glorie rundt hodet, et rolig ansiktsuttrykk.\n\nLær det som: han ser ikke ut til å lide. Glorien forteller deg at dette er et valg, ikke et offer i vanlig forstand.", "longEn": "A young man hangs upside down by one foot from a T-shaped wooden gallows, his other leg crossed behind, hands bound behind his back, a golden halo around his head, a calm expression.\n\nLearn it as: he doesn't look like he's suffering. The halo tells you this is a choice, not a punishment."}, {"id": "m13", "en": "Death", "no": "Døden", "arcana": "major", "suit": "", "element": "", "num": 13, "ku": "avslutning, forvandling, slipp", "kr": "motstand, forlenget avslutning, frykt for endring", "up": "Noe er over. Det som kommer, får ikke plass før du lar det gamle gå.", "rev": "Du holder fast i noe som allerede er ferdig. Det trekker ut og koster mer enn det smaker.", "kuEn": "ending, transformation, letting go", "krEn": "resistance, a drawn-out ending, fear of change", "upEn": "Something is over. What's coming can't find room until you let the old thing go.", "revEn": "You're holding on to something that's already finished. It drags out and costs more than it's worth.", "astroNo": "Skorpionen", "astroEn": "Scorpio", "elementNo": "Vann", "elementEn": "Water", "numNo": "13 → 4: Grunnmur, struktur", "numEn": "13 → 4: A foundation, structure", "adviceNo": "La det som er ferdig, faktisk få lov å være ferdig.", "adviceEn": "Let what's finished actually be allowed to be finished.", "polarity": "neg", "longNo": "En skjelettaktig ridder i svart rustning rir en hvit hest og bærer et svart flagg med en hvit rose, en falt konge ligger foran ham, en biskop, et barn og en jomfru står i nærheten, solen står opp mellom to tårn i det fjerne.\n\nLær det som: alle møter Døden ulikt – kongen faller, barnet ser nysgjerrig på. Solen bak forteller deg at dette ikke er slutten.", "longEn": "A skeletal knight in black armour rides a white horse, carrying a black flag bearing a white rose, a fallen king lies before him, a bishop, a child and a maiden stand nearby, the sun rises between two towers in the distance.\n\nLearn it as: everyone meets Death differently — the king falls, the child looks on with curiosity. The sun behind tells you this isn't the end."}, {"id": "m14", "en": "Temperance", "no": "Måtehold", "arcana": "major", "suit": "", "element": "", "num": 14, "ku": "balanse, tålmodighet, syntese", "kr": "ubalanse, ytterligheter, utålmodighet", "up": "Bland, juster, finn doseringen. Det riktige ligger mellom ytterpunktene, og det tar tid.", "rev": "For mye eller for lite av noe. Du vil ha resultatet før prosessen har fått gå ferdig.", "kuEn": "balance, patience, synthesis", "krEn": "imbalance, extremes, impatience", "upEn": "Blend, adjust, find the right measure. What's right sits between the extremes, and it takes time.", "revEn": "Too much or too little of something. You want the result before the process has been allowed to finish.", "astroNo": "Skytten", "astroEn": "Sagittarius", "elementNo": "Ild", "elementEn": "Fire", "numNo": "14 → 5: Uro, endring, prøving", "numEn": "14 → 5: Unrest, change, testing", "adviceNo": "Bland heller enn å velge ytterpunkt.", "adviceEn": "Blend rather than pick an extreme.", "polarity": "pos", "longNo": "En vinget engel står med én fot på land og én i vann, heller væske mellom to beger, en iris blomstrer i nærheten, en sti leder mot fjerne fjell og en stigende sol.\n\nLær det som: engelen står med én fot i hver verden. Balanse handler om å stå i to ting samtidig, ikke å velge én.", "longEn": "A winged angel stands with one foot on land and one in water, pouring liquid between two cups, an iris blooming nearby, a path leading to distant mountains and a rising sun.\n\nLearn it as: the angel stands with one foot in each world. Balance is about standing in two things at once, not choosing one."}, {"id": "m15", "en": "The Devil", "no": "Djevelen", "arcana": "major", "suit": "", "element": "", "num": 15, "ku": "binding, begjær, skygge", "kr": "frigjøring, erkjennelse, brutt mønster", "up": "Noe holder deg – vane, avhengighet, en person, en historie om deg selv. Lenkene er løsere enn de ser ut.", "rev": "Du ser bindingen for det den er og begynner å komme løs. Frigjøring, men ikke uten ubehag.", "kuEn": "bondage, craving, shadow", "krEn": "liberation, recognition, a broken pattern", "upEn": "Something is holding you — habit, dependency, a person, a story you tell about yourself. The chains are looser than they look.", "revEn": "You see the bondage for what it is and start to come loose. Liberation, but not without discomfort.", "astroNo": "Steinbukken", "astroEn": "Capricorn", "elementNo": "Jord", "elementEn": "Earth", "numNo": "15 → 6: Justering, harmoni", "numEn": "15 → 6: Adjustment, harmony", "adviceNo": "Se hva som egentlig holder deg fast.", "adviceEn": "Look at what's actually holding you.", "polarity": "neg", "longNo": "En hornet, vinget djevelskikkelse sitter på en pidestall over en naken mann og kvinne, begge løst lenket ved halsen, små horn og haler synlig på paret, et omvendt pentagram over djevelens hode.\n\nLær det som: kjedene er løse. Legg merke til at paret kunne tatt dem av selv.", "longEn": "A horned, winged devil figure sits on a pedestal above a naked man and woman, both loosely chained at the neck, small horns and tails visible on the pair, an inverted pentagram above the devil's head.\n\nLearn it as: the chains are loose. Notice the couple could take them off themselves."}, {"id": "m16", "en": "The Tower", "no": "Tårnet", "arcana": "major", "suit": "", "element": "", "num": 16, "ku": "sammenbrudd, avsløring, sjokk", "kr": "utsatt krise, indre ras, overlevd storm", "up": "Noe raser og det gjør vondt. Det som falt, sto på et grunnlag som ikke holdt.", "rev": "Krisen ulmer og utsettes, eller den er nettopp overstått og du står i støvet etterpå.", "kuEn": "collapse, revelation, shock", "krEn": "a delayed crisis, an inner collapse, a survived storm", "upEn": "Something is crashing down and it hurts. What fell was standing on a foundation that couldn't hold.", "revEn": "The crisis is smouldering and being postponed, or it has just passed and you're standing in the dust afterward.", "astroNo": "Mars", "astroEn": "Mars", "elementNo": "Ild", "elementEn": "Fire", "numNo": "16 → 7: Fordypning, innsikt", "numEn": "16 → 7: Reflection, insight", "adviceNo": "La det falle – det sto uansett ikke støtt.", "adviceEn": "Let it fall — it wasn't standing steady anyway.", "polarity": "neg", "longNo": "Et høyt tårn treffes av lyn, kronen blåses av i flammer, to skikkelser faller hodestups ut av vinduene, stråler og flammer fyller den mørke himmelen.\n\nLær det som: kronen – ikke grunnmuren – er det som blåser av. Det er stoltheten som ryker, ikke nødvendigvis alt.", "longEn": "A tall tower is struck by lightning, its crown blown off in flames, two figures fall headlong from the windows, rays and flames filling the dark sky.\n\nLearn it as: it's the crown — not the foundation — that blows off. It's the pride that goes, not necessarily everything."}, {"id": "m17", "en": "The Star", "no": "Stjernen", "arcana": "major", "suit": "", "element": "", "num": 17, "ku": "håp, ro, fornyet tro", "kr": "motløshet, tvil, avskåret fra kilden", "up": "Etter et brudd kommer en stillhet som leger. Håpet er nøkternt, men ekte.", "rev": "Troen på at det ordner seg har tynnet ut. Du trenger hvile mer enn du trenger svar.", "kuEn": "hope, calm, renewed faith", "krEn": "discouragement, doubt, cut off from the source", "upEn": "After a break comes a stillness that heals. The hope is sober, but real.", "revEn": "The belief that things will work out has worn thin. You need rest more than you need answers.", "astroNo": "Vannmannen", "astroEn": "Aquarius", "elementNo": "Luft", "elementEn": "Air", "numNo": "17 → 8: Kraft satt i bevegelse", "numEn": "17 → 8: Power set in motion", "adviceNo": "Hvil i det nøkterne håpet, ikke i garantier.", "adviceEn": "Rest in the sober hope, not in guarantees.", "polarity": "pos", "longNo": "En naken kvinne kneler ved et vann og heller vann fra to krukker, én på land og én i vannet, sju små stjerner og én stor stjerne skinner over henne, en fugl sitter i et tre bak.\n\nLær det som: hun heller ut i begge retninger samtidig – gir til både det som allerede flyter og det tørre landet.", "longEn": "A naked woman kneels by a pool, pouring water from two jugs, one onto the land, one into the water, seven small stars and one large star shining above her, a bird sitting in a tree behind.\n\nLearn it as: she pours in both directions at once — giving to what already flows and to the dry land."}, {"id": "m18", "en": "The Moon", "no": "Månen", "arcana": "major", "suit": "", "element": "", "num": 18, "ku": "usikkerhet, drømmer, det underbevisste", "kr": "klarhet, avdekket illusjon, forvirring", "up": "Ikke alt er som det ser ut. Frykt og fantasi blander seg med fakta. Gå sakte.", "rev": "Tåken letter, eller forvirringen tetter seg til. Sjekk hva som er reelt før du handler.", "kuEn": "uncertainty, dreams, the subconscious", "krEn": "clarity, illusion revealed, confusion", "upEn": "Not everything is as it looks. Fear and imagination mix with fact. Move slowly.", "revEn": "The fog lifts, or the confusion thickens. Check what's real before you act.", "astroNo": "Fiskene", "astroEn": "Pisces", "elementNo": "Vann", "elementEn": "Water", "numNo": "18 → 9: Modning, nær fullføring", "numEn": "18 → 9: Maturing, nearing completion", "adviceNo": "Vent til tåken letter før du bestemmer deg.", "adviceEn": "Wait for the fog to lift before you decide.", "polarity": "neg", "longNo": "En stor måne med ansikt skinner over to tårn, en hund og en ulv uler nedenfor, en krepsdyr kommer opp av en dam, en sti snor seg inn i det fjerne.\n\nLær det som: både det tamme (hunden) og det ville (ulven) uler til samme måne. Frykten skiller ikke mellom dem.", "longEn": "A large moon with a face shines over two towers, a dog and a wolf howling below, a crayfish emerging from a pool, a path winding into the distance.\n\nLearn it as: both the tame (the dog) and the wild (the wolf) howl at the same moon. Fear doesn't distinguish between them."}, {"id": "m19", "en": "The Sun", "no": "Solen", "arcana": "major", "suit": "", "element": "", "num": 19, "ku": "klarhet, glede, suksess", "kr": "dempet glede, forsinkelse, overdreven optimisme", "up": "Det enkle og lyse. Ting går fram i dagen og viser seg som de er. Tillat deg å glede deg.", "rev": "Gleden er der, men dempet. Eller optimismen har løpt fra virkeligheten.", "kuEn": "clarity, joy, success", "krEn": "muted joy, delay, excessive optimism", "upEn": "The simple and bright. Things come out into the open and show themselves as they are. Let yourself be glad.", "revEn": "The joy is there, but muted. Or the optimism has outrun reality.", "astroNo": "Solen", "astroEn": "the Sun", "elementNo": "Ild", "elementEn": "Fire", "numNo": "19 → 1: Ny begynnelse, initiativ", "numEn": "19 → 1: A new beginning, initiative", "adviceNo": "La deg glede uten forbehold.", "adviceEn": "Let yourself be glad without qualification.", "polarity": "pos", "longNo": "En strålende sol skinner over et nakent barn som rir en hvit hest og holder et rødt banner, solsikker langs en mur bak dem.\n\nLær det som: et barn, ikke en helt, holder banneret. Etter Månens forvirring er det enkelheten som vinner.", "longEn": "A radiant sun shines over a naked child riding a white horse and holding a red banner, sunflowers lining a wall behind them.\n\nLearn it as: it's a child, not a hero, holding the banner. After the Moon's confusion, it's simplicity that wins."}, {"id": "m20", "en": "Judgement", "no": "Dommen", "arcana": "major", "suit": "", "element": "", "num": 20, "ku": "oppvåkning, kall, oppgjør", "kr": "selvkritikk, nøling, overhørt kall", "up": "Et vendepunkt der du ser fortiden klart og kalles videre. Gjør opp, og gå.", "rev": "Du dømmer deg selv hardt, eller hører kallet og lar være å svare.", "kuEn": "awakening, calling, reckoning", "krEn": "self-criticism, hesitation, an unanswered call", "upEn": "A turning point where you see the past clearly and are called forward. Settle it, and go.", "revEn": "You're judging yourself harshly, or you hear the call and choose not to answer it.", "astroNo": "Pluto", "astroEn": "Pluto", "elementNo": "Ild", "elementEn": "Fire", "numNo": "20 → 2: Møte, valg, balanse", "numEn": "20 → 2: A meeting, a choice, balance", "adviceNo": "Gjør opp, og gå videre.", "adviceEn": "Settle it, and move on.", "polarity": "pos", "longNo": "En engel blåser i en trompet fra skyene, skikkelser reiser seg nakne fra åpne graver nedenfor med utstrakte armer, fjell i det fjerne.\n\nLær det som: alle reiser seg samtidig, ingen blir liggende igjen. Kallet er kollektivt, svaret er personlig.", "longEn": "An angel blows a trumpet from the clouds, figures rising nude from open graves below with arms outstretched, mountains in the distance.\n\nLearn it as: everyone rises at once, nobody stays behind. The call is collective; the answer is personal."}, {"id": "m21", "en": "The World", "no": "Verden", "arcana": "major", "suit": "", "element": "", "num": 21, "ku": "fullendelse, helhet, hjemkomst", "kr": "uavsluttet, nær mål, manglende lukning", "up": "En syklus lukkes. Ta inn at du faktisk kom i mål før du starter på neste.", "rev": "Noe mangler på slutten. Du er nær, men noe må avsluttes ordentlig først.", "kuEn": "completion, wholeness, homecoming", "krEn": "unfinished business, so close, missing closure", "upEn": "A cycle closes. Take in that you actually made it before you start the next one.", "revEn": "Something is missing at the end. You're close, but something needs a proper finish first.", "astroNo": "Saturn", "astroEn": "Saturn", "elementNo": "Jord", "elementEn": "Earth", "numNo": "21 → 3: Vekst gjennom samspill", "numEn": "21 → 3: Growth through interaction", "adviceNo": "Ta inn at dette faktisk er fullført.", "adviceEn": "Take in that this is actually complete.", "polarity": "pos", "longNo": "En dansende skikkelse draperet i et skjerf svever inne i en krans, holder to staver, omgitt av de fire faste stjernetegn-skapningene (engel, ørn, okse, løve) i hjørnene.\n\nLær det som: det siste kortet i rekken viser noen som beveger seg, ikke står stille. Fullendelse er en dans, ikke en hvilepute.", "longEn": "A dancing figure draped in a scarf floats within a wreath, holding two wands, surrounded by the four fixed-sign creatures (angel, eagle, bull, lion) in the corners.\n\nLearn it as: the last card in the sequence shows someone moving, not standing still. Completion is a dance, not a resting place."}, {"id": "w1", "en": "Ace of Wands", "no": "Ess staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 1, "ku": "ny gnist, inspirasjon, kraft", "kr": "forsinket start, tomgang, tvil på ideen", "up": "En impuls som vil noe. Ideen er rå, men energien er ekte – start før du har planlagt alt.", "rev": "Gnisten tennes ikke, eller den slukner fort. Sjekk om ideen er din egen.", "kuEn": "new spark, inspiration, drive", "krEn": "a delayed start, idling, doubting the idea", "upEn": "An impulse that wants something. The idea is raw, but the energy is real — start before you've planned everything.", "revEn": "The spark won't catch, or it fades fast. Check whether the idea is even yours.", "astroNo": "Ildens rot", "astroEn": "Root of Fire", "numNo": "Tallet 1: Ny begynnelse, initiativ", "numEn": "The number 1: A new beginning, initiative", "adviceNo": "Ta det første skrittet mens impulsen er fersk. Det gjelder viljen og initiativet ditt.", "adviceEn": "Take the first step while the impulse is fresh. This is about your will and your initiative.", "polarity": "pos", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "En hånd kommer ut av en sky og holder en spirende stav, et slott i det fjerne under.\n\nInitiativ og lidenskap farger dette: kjærlighet – en ny start; jobb – en ny mulighet; generelt – ren, uprøvd energi.", "longEn": "A hand emerges from a cloud holding a sprouting wand, a castle in the distance below.\n\nInitiative and passion colour this: love — a fresh start; work — a new opportunity; general — raw, untested energy."}, {"id": "w2", "en": "Two of Wands", "no": "To staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 2, "ku": "planlegging, vurdering, valg av vei", "kr": "nøling, trange rammer, redd for å forlate trygghet", "up": "Du står med kartet og ser utover. Beslutningen er tatt i prinsippet, men ikke i praksis.", "rev": "Du blir stående. Enten er planen for trang, eller frykten for det ukjente er større enn lysten.", "kuEn": "planning, weighing options, choosing a path", "krEn": "hesitation, cramped options, afraid to leave safety", "upEn": "You're standing with the map, looking out. The decision is made in principle, just not in practice.", "revEn": "You stay put. Either the plan is too narrow, or the fear of the unknown outweighs the pull of it.", "astroNo": "Mars i Væren", "astroEn": "Mars in Aries", "numNo": "Tallet 2: Møte, valg, balanse", "numEn": "The number 2: A meeting, a choice, balance", "adviceNo": "Vei alternativene, men ikke bli stående for lenge. Det gjelder viljen og initiativet ditt.", "adviceEn": "Weigh the options, but don't linger too long. This is about your will and your initiative.", "polarity": "neu", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "En mann står på en festningsmur og holder en globus, blikket ute på havet, én stav i hånden, én festet på muren.\n\nInitiativ og lidenskap farger dette: kjærlighet – et valg om å binde seg; jobb – en avveining; generelt – balanse mellom to ting.", "longEn": "A man stands on a battlement holding a globe, gazing out to sea, one wand in hand, another mounted on the wall.\n\nInitiative and passion colour this: love — a choice about committing; work — a trade-off to weigh; general — balance between two things."}, {"id": "w3", "en": "Three of Wands", "no": "Tre staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 3, "ku": "utvidelse, framsyn, første resultater", "kr": "forsinkelse, for kort horisont, skuffede forventninger", "up": "Noe du satte i gang begynner å bevege seg. Se lenger enn du gjorde sist.", "rev": "Skipene kommer ikke inn som ventet. Planen manglet rekkevidde, eller tidshorisonten var for optimistisk.", "kuEn": "expansion, foresight, first results", "krEn": "delay, too short a horizon, disappointed expectations", "upEn": "Something you set in motion starts to move. Look further ahead than you did last time.", "revEn": "The ships don't come in as expected. The plan lacked reach, or the timeline was too optimistic.", "astroNo": "Solen i Væren", "astroEn": "the Sun in Aries", "numNo": "Tallet 3: Vekst gjennom samspill", "numEn": "The number 3: Growth through interaction", "adviceNo": "Se lenger fram enn du gjør nå. Det gjelder viljen og initiativet ditt.", "adviceEn": "Look further ahead than you are right now. This is about your will and your initiative.", "polarity": "pos", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "En mann står på en klippe med ryggen til, ser skip seile ut på havet, tre staver plantet ved siden av ham.\n\nInitiativ og lidenskap farger dette: kjærlighet – en gruppe rundt forholdet; jobb – samarbeid gir resultater; generelt – vekst gjennom andre.", "longEn": "A man stands on a cliff, back to us, watching ships sail out to sea, three wands planted beside him.\n\nInitiative and passion colour this: love — a circle of people around the relationship; work — collaboration paying off; general — growth through others."}, {"id": "w4", "en": "Four of Wands", "no": "Fire staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 4, "ku": "feiring, hjem, milepæl", "kr": "ustabilt fundament, utsatt feiring, hjemløshet", "up": "Noe er godt nok på plass til å markeres. Fellesskap, hjem og trygghet.", "rev": "Grunnmuren er ikke ferdig. Feiringen blir hul, eller hjemmet føles ikke som ditt.", "kuEn": "celebration, home, milestone", "krEn": "an unstable foundation, a postponed celebration, homelessness", "upEn": "Something is solid enough to mark. Community, home and security.", "revEn": "The foundation isn't finished. The celebration rings hollow, or home doesn't feel like yours.", "astroNo": "Venus i Væren", "astroEn": "Venus in Aries", "numNo": "Tallet 4: Grunnmur, struktur", "numEn": "The number 4: A foundation, structure", "adviceNo": "Marker det som faktisk er oppnådd. Det gjelder viljen og initiativet ditt.", "adviceEn": "Mark what has actually been achieved. This is about your will and your initiative.", "polarity": "pos", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "En blomsterkrans henger mellom fire staver, et par feirer i bakgrunnen foran et slott.\n\nInitiativ og lidenskap farger dette: kjærlighet – en stille periode sammen; jobb – noe som er kommet på plass; generelt – stabilitet, kanskje for trygg.", "longEn": "A garland of flowers hangs between four wands, a couple celebrating in the distance before a castle.\n\nInitiative and passion colour this: love — a quiet stretch together; work — something that's settled into place; general — stability, maybe too safe."}, {"id": "w5", "en": "Five of Wands", "no": "Fem staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 5, "ku": "konkurranse, friksjon, brytning", "kr": "unngått konflikt, utmattelse, indre strid", "up": "Mange vil noe samtidig. Bråket er ikke farlig – det er slik ting bryner seg.", "rev": "Konflikten går under overflaten eller inn i deg selv. Kranglingen har mistet sin hensikt.", "kuEn": "competition, friction, clashing", "krEn": "avoided conflict, exhaustion, inner strife", "upEn": "Many people want something at once. The noise isn't dangerous — it's how things get sharpened.", "revEn": "The conflict goes underground, or inward. The arguing has lost its point.", "astroNo": "Saturn i Løven", "astroEn": "Saturn in Leo", "numNo": "Tallet 5: Uro, endring, prøving", "numEn": "The number 5: Unrest, change, testing", "adviceNo": "La friksjonen gjøre jobben sin – ikke unngå den. Det gjelder viljen og initiativet ditt.", "adviceEn": "Let the friction do its job — don't avoid it. This is about your will and your initiative.", "polarity": "neg", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "Fem unge menn krysser staver i det som ser ut som en kaotisk lek eller basketak.\n\nInitiativ og lidenskap farger dette: kjærlighet – friksjon som må snakkes ut; jobb – konkurranse om ressurser; generelt – en test av det som holder.", "longEn": "Five young men clash quarterstaffs in what looks like a chaotic scuffle or game.\n\nInitiative and passion colour this: love — friction that needs talking through; work — competition for resources; general — a test of what holds."}, {"id": "w6", "en": "Six of Wands", "no": "Seks staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 6, "ku": "seier, anerkjennelse, framgang", "kr": "uteblitt anerkjennelse, hovmod, tvil på egen seier", "up": "Du får det du har jobbet for, og noen ser det. La det telle.", "rev": "Innsatsen blir ikke sett, eller seieren bæres litt for høyt.", "kuEn": "victory, recognition, progress", "krEn": "unacknowledged effort, arrogance, doubting your own win", "upEn": "You get what you worked for, and someone notices. Let it count.", "revEn": "The effort goes unseen, or the win is carried a little too high.", "astroNo": "Jupiter i Løven", "astroEn": "Jupiter in Leo", "numNo": "Tallet 6: Justering, harmoni", "numEn": "The number 6: Adjustment, harmony", "adviceNo": "Ta imot anerkjennelsen uten å avfeie den. Det gjelder viljen og initiativet ditt.", "adviceEn": "Accept the recognition instead of waving it off. This is about your will and your initiative.", "polarity": "pos", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "En rytter på en hvit hest vender tilbake kronet med laurbær, en stav hevet, en flokk staver bak ham.\n\nInitiativ og lidenskap farger dette: kjærlighet – et tilbakeblikk, kanskje for mye; jobb – et gjennombrudd blir sett; generelt – noe gammelt vender tilbake.", "longEn": "A rider on a white horse returns crowned with laurel, a wand raised, a crowd of wands behind him.\n\nInitiative and passion colour this: love — looking back, maybe too much; work — a breakthrough being seen; general — something old returning."}, {"id": "w7", "en": "Seven of Wands", "no": "Sju staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 7, "ku": "forsvar, standhaftighet, overtak", "kr": "overveldet, gitt opp posisjonen, utmattet forsvar", "up": "Du har noe å forsvare og står høyere enn dem som utfordrer. Hold stand.", "rev": "Presset blir for stort, eller du kjemper for noe du ikke lenger tror på.", "kuEn": "defence, standing firm, the upper hand", "krEn": "overwhelmed, position abandoned, an exhausted defence", "upEn": "You have something worth defending and stand higher than those challenging you. Hold your ground.", "revEn": "The pressure gets too heavy, or you're fighting for something you no longer believe in.", "astroNo": "Mars i Løven", "astroEn": "Mars in Leo", "numNo": "Tallet 7: Fordypning, innsikt", "numEn": "The number 7: Reflection, insight", "adviceNo": "Hold posisjonen din litt til. Det gjelder viljen og initiativet ditt.", "adviceEn": "Hold your position a little longer. This is about your will and your initiative.", "polarity": "neu", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "En mann står på høyden og forsvarer seg med en stav mot seks staver som reiser seg nedenfra.\n\nInitiativ og lidenskap farger dette: kjærlighet – å holde på det dere har bygget; jobb – en strategi som må velges; generelt – en beslutning utsatt for lenge.", "longEn": "A man stands on high ground, defending himself with a wand against six wands rising from below.\n\nInitiative and passion colour this: love — holding on to what you've built; work — a strategy that needs choosing; general — a decision put off too long."}, {"id": "w8", "en": "Eight of Wands", "no": "Åtte staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 8, "ku": "fart, budskap, ting løsner", "kr": "forsinkelse, kaos, spredte tråder", "up": "Alt går fort nå. Beskjeder kommer, ting faller på plass i rask rekkefølge.", "rev": "Det som skulle gå fort, står stille. Eller det går for fort til at du rekker å styre det.", "kuEn": "speed, messages, things loosening", "krEn": "delay, chaos, scattered threads", "upEn": "Everything moves fast now. Messages arrive, things fall into place in quick succession.", "revEn": "What should move fast stands still. Or it moves too fast for you to keep steering it.", "astroNo": "Merkur i Skytten", "astroEn": "Mercury in Sagittarius", "numNo": "Tallet 8: Kraft satt i bevegelse", "numEn": "The number 8: Power set in motion", "adviceNo": "La farten bære deg videre. Det gjelder viljen og initiativet ditt.", "adviceEn": "Let the momentum carry you on. This is about your will and your initiative.", "polarity": "pos", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "Åtte staver flyr gjennom luften over et åpent landskap, nær slutten av sin flukt.\n\nInitiativ og lidenskap farger dette: kjærlighet – fart i noe som har stått stille; jobb – raske endringer i planene; generelt – ting går fortere enn ventet.", "longEn": "Eight wands fly through the air over an open landscape, nearing the end of their flight.\n\nInitiative and passion colour this: love — momentum in something that's been still; work — rapid changes of plan; general — things moving faster than expected."}, {"id": "w9", "en": "Nine of Wands", "no": "Ni staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 9, "ku": "utholdenhet, årvåkenhet, siste push", "kr": "utbrenthet, paranoia, gi opp på målstreken", "up": "Du er sliten og fortsatt stående. Det siste stykket krever mer enn du har lyst til å gi.", "rev": "Vaktholdet har blitt mistenksomhet, eller kreftene tar slutt rett før mål.", "kuEn": "endurance, vigilance, one last push", "krEn": "burnout, paranoia, giving up at the finish line", "upEn": "You're tired and still standing. This last stretch asks for more than you feel like giving.", "revEn": "The watchfulness has turned into suspicion, or the strength runs out right before the end.", "astroNo": "Månen i Skytten", "astroEn": "the Moon in Sagittarius", "numNo": "Tallet 9: Modning, nær fullføring", "numEn": "The number 9: Maturing, nearing completion", "adviceNo": "Ta en pust – du er nesten i mål. Det gjelder viljen og initiativet ditt.", "adviceEn": "Take a breath — you're almost there. This is about your will and your initiative.", "polarity": "neu", "suitEn": "Wands", "elementEnName": "Fire", "longNo": "En såret mann lener seg på en stav og ser vaktsomt, åtte staver mer står vakt bak ham.\n\nInitiativ og lidenskap farger dette: kjærlighet – nesten i mål, men sliten; jobb – utholdenhet nær målet; generelt – litt lenger, ikke gi opp.", "longEn": "A wounded man leans on a wand, watching warily, eight more wands standing guard behind him.\n\nInitiative and passion colour this: love — almost there, but tired; work — endurance near the finish line; general — a little further, don't quit."}, {"id": "w10", "en": "Ten of Wands", "no": "Ti staver", "arcana": "minor", "suit": "Wands", "suitNo": "Staver", "element": "ild", "num": 10, "ku": "overbelastning, ansvar, tun function viewDeck(){
  const s=norm(q);
  const list=CARDS.filter(c=>{
    if(filter==='major'&&c.arcana!=='major') return false;
    if(['Wands','Cups','Swords','Pentacles'].includes(filter)&&c.suit!==filter) return false;
    if(!s) return true;
    return norm(c.no+' '+c.en+' '+c.ku+' '+c.kr+' '+c.up+' '+c.rev+' '+c.kuEn+' '+c.krEn+' '+c.upEn+' '+c.revEn).includes(s);
  });
  const f=[['alle',L('Alle','All')],['major',L('Stor arkana','Major arcana')],['Wands',L('Staver','Wands')],['Cups',L('Begre','Cups')],['Swords',L('Sverd','Swords')],['Pentacles',L('Mynter','Pentacles')]];

}

  if(!filled()) return `<div class="empty">${L('Legg noen kort først, så kommer tolkningen her.','Lay out some cards first, and the reading will appear here.')}</div>`;

function catPlaceholder(){
  const NO={generelt:'Hva handler leggingen om?',kjaerlighet:'Hva vil du vite om forholdet?',
   jobb:'Hva gjelder det på jobb?',okonomi:'Hva gjelder det økonomisk?',
   familie:'Hvem eller hva handler det om?',helse:'Hva kjenner du på?',
   utvikling:'Hva vil du forstå bedre om deg selv?',valg:'Hvilke muligheter står mot hverandre?'};
  const EN={generelt:'What is the reading about?',kjaerlighet:'What do you want to know about the relationship?',
   jobb:'What does this concern at work?',okonomi:'What does this concern financially?',
   familie:'Who or what is this about?',helse:'What are you noticing?',
   utvikling:'What do you want to understand better about yourself?',valg:'Which options are in play?'};
  return L(NO[DB.current.cat]||NO.generelt, EN[DB.current.cat]||EN.generelt);
}
/* ============================================================
   Interpretation — built from card, position and the pattern of the whole
   ============================================================ */
function yesNo(c){
  const pol=c.polarity, rev=c.rev;
  if(!rev) return pol==='pos'?L('Ja','Yes'):pol==='neg'?L('Nei','No'):L('Uklart','Unclear');
  return pol==='pos'?L('Uklart','Unclear'):pol==='neg'?L('Nei','No'):L('Uklart','Unclear');
}
function buildReading(){
  const sp=spread(); const slots=DB.current.slots;
  const cs=slots.map(s=>s?{...card(s.id),rev:s.rev}:null);
  const got=cs.filter(Boolean);
  const majors=got.filter(c=>c.arcana==='major').length;
  const revs=got.filter(c=>c.rev).length;
  const suits={};
  got.forEach(c=>{ if(c.suit) suits[c.suit]=(suits[c.suit]||0)+1; });
  const nums={};
  got.forEach(c=>{ if(c.arcana==='minor'&&c.num<=10) nums[c.num]=(nums[c.num]||0)+1; });
  const courts=got.filter(c=>c.arcana==='minor'&&c.num>10).length;
  const SUITNO=L({Wands:'staver',Cups:'begre',Swords:'sverd',Pentacles:'mynter'},{Wands:'wands',Cups:'cups',Swords:'swords',Pentacles:'pentacles'});
  const THEME=L({Wands:'vilje, drivkraft og handling',Cups:'følelser og forbindelser',
               Swords:'tanker, ord og avklaring',Pentacles:'det konkrete – arbeid, kropp og økonomi'},
              {Wands:'will, drive and action',Cups:'feelings and connections',
               Swords:'thoughts, words and clarity',Pentacles:'the concrete — work, body and money'});
  const patterns=[];
  if(majors) patterns.push({t:L(`${majors} stor arkana`,`${majors} major arcana`),hi:majors>=Math.max(2,Math.round(got.length/2))});
  if(revs) patterns.push({t:L(`${revs} omvendt`,`${revs} reversed`)});
  const domSuit=Object.entries(suits).sort((a,b)=>b[1]-a[1])[0];
  if(domSuit&&domSuit[1]>=2) patterns.push({t:`${domSuit[1]} ${SUITNO[domSuit[0]]}`});
  const rep=Object.entries(nums).filter(([n,k])=>k>=2);
  rep.forEach(([n,k])=>patterns.push({t:L(`${k}× ${n}-ere`,`${k}× ${n}s`)}));
  if(courts>=2) patterns.push({t:L(`${courts} hoffkort`,`${courts} court cards`)});

  const cat=catOf(DB.current.cat);
  let overview=L(`Du har lagt ${got.length} kort i «${sp.name}» om ${cat[2]}.`,`You've laid ${got.length} cards in "${sp.nameEn}" about ${cat[4]}.`);
  if(majors>=Math.max(2,Math.round(got.length/2))) overview+=L(` Med ${majors} kort fra stor arkana handler dette om noe større enn dagsformen – krefter du ikke styrer alene.`,
    ` With ${majors} cards from the major arcana, this is about something bigger than the day-to-day — forces you don't control alone.`);
  else if(!majors) overview+=L(` Ingen kort fra stor arkana: dette ligger i hverdagen og innenfor din egen rekkevidde.`,
    ` No cards from the major arcana: this sits in the everyday, within your own reach.`);
  if(domSuit&&domSuit[1]>=Math.max(2,Math.round(got.length/2.5))) overview+=L(` Tyngdepunktet ligger i ${SUITNO[domSuit[0]]} – ${THEME[domSuit[0]]}.`,
    ` The weight falls on ${SUITNO[domSuit[0]]} — ${THEME[domSuit[0]]}.`);
  if(revs>got.length/2) overview+=L(` Over halvparten ligger omvendt. Mye er i indre bevegelse, forsinket eller ikke ferdig avklart.`,
    ` More than half are reversed. Much of this is moving inward, delayed, or not yet resolved.`);
  else if(!revs&&got.length>2) overview+=L(` Ingen omvendte kort: kreftene får gå sin gang uhindret.`,
    ` No reversed cards: the forces here get to run their course unhindered.`);
  if(rep.length) overview+=L(` Gjentatte tall peker på at samme tema melder seg fra flere kanter.`,
    ` Repeated numbers suggest the same theme is showing up from more than one direction.`);
  /* A dominant suit reads differently depending on what the question is about. */
  const NUDGE_NO={
    kjaerlighet:{Cups:'At begrene dominerer i et spørsmål om kjærlighet er ventet – men merk deg hvor de andre fargene bryter inn.',Swords:'Sverd i et kjærlighetsspørsmål peker mot ord, avklaringer og det som må sies.',Pentacles:'Mynter her handler om hverdagen og det praktiske i forholdet, ikke om følelsene.',Wands:'Staver her handler om lidenskap og initiativ – hvem som drar lasset.'},
    jobb:{Pentacles:'Mynter i et jobbspørsmål peker mot det konkrete: oppgaver, lønn og trygghet.',Wands:'Staver her handler om ambisjon og driv, mer enn om rammene.',Swords:'Sverd i et jobbspørsmål peker mot kommunikasjon, konflikt eller beslutninger.',Cups:'Begre i et jobbspørsmål handler om trivsel og relasjonene på arbeidsplassen.'},
    okonomi:{Pentacles:'Mynter er hjemmebane for økonomiske spørsmål – les dem bokstavelig.',Swords:'Sverd her peker mot at avklaring og oversikt er viktigere enn selve tallene.'},
    helse:{Pentacles:'Mynter i et helsespørsmål peker mot kroppen og det fysiske.',Cups:'Begre her peker mot det følelsesmessige som også setter seg i kroppen.',Wands:'Staver her handler om energinivå og overskudd.'},
    valg:{Swords:'Sverd i et valgspørsmål ber deg tenke klart framfor å kjenne etter.',Cups:'Begre her ber deg kjenne etter framfor å resonnere.'}
  };
  const NUDGE_EN={
    kjaerlighet:{Cups:"Cups dominating a love question is expected — but notice where the other suits break in.",Swords:'Swords in a love question point to words, clarity, and what needs to be said.',Pentacles:'Pentacles here are about the everyday and the practical side of the relationship, not the feelings.',Wands:"Wands here are about passion and initiative — who's carrying the momentum."},
    jobb:{Pentacles:'Pentacles in a work question point to the concrete: tasks, pay and security.',Wands:'Wands here are about ambition and drive, more than the framework around it.',Swords:'Swords in a work question point to communication, conflict, or decisions.',Cups:'Cups in a work question are about wellbeing and the relationships at work.'},
    okonomi:{Pentacles:'Pentacles are home turf for money questions — read them literally.',Swords:'Swords here suggest that clarity and an overview matter more than the numbers themselves.'},
    helse:{Pentacles:'Pentacles in a health question point to the body and the physical.',Cups:'Cups here point to the emotional side that also settles in the body.',Wands:'Wands here are about energy levels and stamina.'},
    valg:{Swords:'Swords in a choice ask you to think clearly rather than go by feeling.',Cups:'Cups here ask you to go by feeling rather than reasoning it out.'}
  };
  const NUDGE=L(NUDGE_NO,NUDGE_EN);
  if(domSuit&&NUDGE[cat[0]]&&NUDGE[cat[0]][domSuit[0]]&&domSuit[1]>=2) overview+=' '+NUDGE[cat[0]][domSuit[0]];

  const lines=[];
  cs.forEach((c,i)=>{ if(!c) return; const p=sp.pos[i];
    lines.push({pos:`${i+1}. ${L(p.t,p.tEn)}`,name:L(c.no,c.en),rev:c.rev,id:c.id,slot:i,
      text:`${L(p.d,p.dEn)} ${c.rev?L(c.rev,c.revEn):L(c.up,c.upEn)}`});
  });
  let close='';
  const last=cs[cs.length-1];
  if(sp.id!=='week'&&last){ const lp=sp.pos[sp.pos.length-1];
    close=L(`Siste plass, «${lp.t}», holdes av ${last.no}${last.rev?' omvendt':''}. Les den som en retning, ikke en dom – kortene beskriver hvordan det ligger an nå, ikke hva som må skje.`,
      `The last position, "${lp.tEn}", is held by ${last.en}${last.rev?' reversed':''}. Read it as a direction, not a verdict — the cards describe how things stand now, not what has to happen.`);
  }
  return {overview,patterns,lines,close};
}

    <p class="small faint" style="margin-top:12px">${L('Ja/Nei er en enkel tommelfingerregel ut fra kortets grunntone, ikke et fasitsvar.','Yes/No is a rough rule of thumb based on the card\'s basic tone, not a definitive answer.')}</p>
  </div>`));
  if(slotIndex!=null){
    sh.querySelectorAll('#dir button').forEach(b=>b.onclick=()=>{
      DB.current.slots[slotIndex]={id,rev:b.dataset.dir==='rev'}; save(); closeSheet(); render(); });
    sh.querySelector('[data-act="removeslot"]').onclick=()=>{ DB.current.slots[slotIndex]=null; save(); closeSheet(); render(); };
  } else {
    let rev=false;
    sh.querySelectorAll('#dir2 button').forEach(b=>b.onclick=()=>{ rev=b.dataset.dir2==='rev';
      sh.querySelectorAll('#dir2 button').forEach(x=>x.classList.toggle('on',x===b)); });
    ensureSlots(); const sp=spread();
    const box=sh.querySelector('#slotBtns');
    box.innerHTML=sp.pos.map((p,i)=>`<button class="btn sm" data-put="${i}">${i+1}. ${esc(L(p.t,p.tEn))}${DB.current.slots[i]?' ●':''}</button>`).join('');
    box.querySelectorAll('[data-put]').forEach(b=>b.onclick=()=>{
      DB.current.slots[+b.dataset.put]={id,rev}; save(); closeSheet(); view='legg'; render(); toast(L(c.no,c.en)+(rev?L(' omvendt',' reversed'):'')+L(' lagt inn',' added')); });
  }
}

    <div class="f"><label>${L('Tjeneste','Service')}</label><div class="seg" id="prov">
      <button data-p="gemini" class="${DB.settings.provider==='gemini'?'on':''}">Google Gemini · ${L('gratis','free')}</button>
      <button data-p="anthropic" class="${DB.settings.provider==='anthropic'?'on':''}">Claude · ${L('betalt','paid')}</button></div></div>
    <div class="f"><label>${L('API-nøkkel','API key')}</label><input id="s-key" type="password" value="${esc(DB.settings.key)}" autocomplete="off" placeholder="…"></div>
    <div class="f"><label>${L('Modell','Model')}</label><div id="s-modelwrap"></div>
      <small class="faint" style="font-size:11.5px">${L('Hver modell har sin egen dagskvote. Går én tom, prøver appen en annen selv.','Each model has its own daily quota. If one runs out, the app tries another automatically.')}</small></div>
    <button class="btn gold full" data-act="savesettings">${L('Lagre','Save')}</button></div>`));

      const sel=mw.querySelector('select'); sel.onchange=()=>{ mw.querySelector('#s-model2').style.display = sel.value==='__x'?'block':'none'; };
    } else {
      mw.innerHTML=`<input id="s-model" value="${esc(cur)}" placeholder="claude-sonnet-5">`;

  };
  paintModel();
  sh.querySelectorAll('#prov button').forEach(b=>b.onclick=()=>{ DB.settings.provider=b.dataset.p; sh.querySelectorAll('#prov button').forEach(x=>x.classList.toggle('on',x===b)); DB.settings.model=''; paintModel(); });
  sh.querySelector('[data-act="savesettings"]').onclick=()=>{ DB.settings.key=sh.querySelector('#s-key').value.trim();

}
function historySheet(id){
  const h=DB.history.find(x=>x.id===id); if(!h) return;
  const sp=SPREADS.find(s=>s.id===h.spread)||SPREADS[0];
  const sh=openSheet(el(`<div><h3>${esc(L(h.spreadName,h.spreadNameEn||h.spreadName))}</h3><p class="sh-sub">${esc(catLabel(h.cat||'generelt'))} · ${esc(h.date)}${h.q?' · «'+esc(h.q)+'»':''}</p>
    <div class="clist">${h.slots.map((s,i)=>s?citem(card(s.id),s.rev,sp.pos[i]?L(sp.pos[i].t,sp.pos[i].tEn):''):'').join('')}</div>

      <button class="btn" data-act="delhist" data-id="${h.id}">${L('Slett','Delete')}</button></div></div>`));
