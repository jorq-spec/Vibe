/* ============================================================
   AI summary (optional)
   ============================================================ */
async function aiSummary(){
  if(!DB.settings.key){ closeSheet(); settingsSheet(); return; }
  const out=$('#aiOut'); out.innerHTML=`<div class="card"><p class="muted">${L('Skriver sammenfatning…','Writing the summary…')}</p></div>`;
  const sp=spread(); const en=lang()==='en';
  const body=DB.current.slots.map((s,i)=>{ if(!s) return null; const c=card(s.id);
    return `${i+1}. ${L(sp.pos[i].t,sp.pos[i].tEn)} (${L(sp.pos[i].d,sp.pos[i].dEn)}): ${c.no} / ${c.en}${s.rev?' – '+L('omvendt','reversed'):''}. ${L('Stikkord','Keywords')}: ${s.rev?L(c.kr,c.krEn):L(c.ku,c.kuEn)}.`; }).filter(Boolean).join('\n');
  const prompt=`${en?'You are an experienced tarot reader. Write a flowing interpretation in English of this spread.':'Du er en erfaren tarotleser. Skriv en sammenhengende tolkning på norsk av denne leggingen.'} ${en?'Weave the cards into one story instead of listing them one by one, and point out patterns (major arcana, reversed cards, repeated suits or numbers). Three to five paragraphs. Be concrete and level-headed, not flowery, and avoid promising specific outcomes. End with one question the reader can take with them.':'Bind kortene sammen til én historie i stedet for å liste dem opp ett for ett, og pek på mønstre (stor arkana, omvendte kort, gjentatte farger eller tall). Tre til fem avsnitt. Vær konkret og nøktern, ikke svulstig, og unngå å love bestemte utfall. Avslutt med ett spørsmål leseren kan ta med seg.'}

${en?'Spread':'Legging'}: ${en?sp.nameEn:sp.name} – ${en?sp.descEn:sp.desc}
${en?'Category':'Kategori'}: ${catLabel(DB.current.cat)} (${catDesc(DB.current.cat)}). ${en?'Read the cards in light of this.':'Les kortene i lys av dette.'}
${DB.current.q?`${en?'Question':'Spørsmål'}: ${DB.current.q}`:L('Ingen spørsmål oppgitt.','No question given.')}

${body}`;
  try{
    const text = DB.settings.provider==='anthropic' ? await askAnthropic(prompt) : await askGemini(prompt);
    out.innerHTML=`<div class="card"><h5 style="font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">${L('Sammenfatning','Summary')}</h5>
      <div class="mean">${text.split(/\n{2,}/).map(p=>`<p style="margin-bottom:10px">${esc(p.trim())}</p>`).join('')}</div></div>`;
    DB.current.ai=text; save();
  }catch(e){ out.innerHTML=`<div class="card"><p class="muted">${L('Feil','Error')}: ${esc(e.message||e)}</p></div>`; }
}
async function askAnthropic(prompt){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':DB.settings.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:DB.settings.model||'claude-sonnet-5',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
  const j=await r.json(); if(!r.ok) throw new Error(j?.error?.message||('HTTP '+r.status));
  return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
const GEMINI_FALLBACKS=['gemini-3.6-flash','gemini-3.5-flash-lite','gemini-3.5-flash','gemini-2.5-flash-lite','gemini-flash-latest'];
const GEMINI_CHOICES=[['gemini-3.6-flash','Gemini 3.6 Flash'],['gemini-3.5-flash-lite','Gemini 3.5 Flash-Lite'],['gemini-3.5-flash','Gemini 3.5 Flash'],['gemini-2.5-flash-lite','Gemini 2.5 Flash-Lite']];
async function askGemini(prompt,opt={}){
  const model=opt.model||DB.settings.model||'gemini-3.6-flash';
  let r,j;
  try{
    r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
      {method:'POST',headers:{'content-type':'application/json','x-goog-api-key':DB.settings.key},
       body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.8,maxOutputTokens:1400}})});
    j=await r.json();
  }catch(e){ throw new Error(L('Fikk ikke kontakt med Google. Sjekk nettforbindelsen.','Could not reach Google. Check your connection.')); }
  if(!r.ok){
    const msg=j?.error?.message||('HTTP '+r.status);
    const raw=JSON.stringify(j?.error||{});
    const perMinute=/PerMinute|per minute/i.test(raw);
    if(/quota|RESOURCE_EXHAUSTED/i.test(msg)||r.status===429){
      if(perMinute) throw new Error(L('For mange forespørsler på kort tid. Vent et minutt og prøv igjen.','Too many requests in a short time. Wait a minute and try again.'));
      if((opt.tried||[]).length<3){
        const next=GEMINI_FALLBACKS.find(m=>m!==model&&!(opt.tried||[]).includes(m));
        if(next) return askGemini(prompt,{model:next,tried:[...(opt.tried||[]),model]});
      }
      throw new Error(L('Dagskvoten er brukt opp for gratismodellene. Den nullstilles ca. kl. 09 norsk tid.','The free daily quota is used up. It resets around 9am Central European time.'));
    }
    if(/API key|API_KEY_INVALID|PERMISSION_DENIED/i.test(msg)) throw new Error(L('Nøkkelen ble avvist. Sjekk den under Meny → AI-sammenfatning.','The key was rejected. Check it under Menu → AI summary.'));
    if(/no longer available|not found|does not exist/i.test(msg)){
      const sug=(msg.match(/models\/([A-Za-z0-9.\-]+)/g)||[]).map(x=>x.split('/')[1]).filter(m=>m!==model);
      const next=(opt.tried||[]).length<3 ? (sug[0]||GEMINI_FALLBACKS.find(m=>m!==model&&!(opt.tried||[]).includes(m))) : null;
      if(next) return askGemini(prompt,{model:next,tried:[...(opt.tried||[]),model]});
    }
    throw new Error(msg);
  }
  if((opt.tried||[]).length && model!==DB.settings.model){ DB.settings.model=model; save(); }
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
}

/* ============================================================
   Actions
   ============================================================ */
function drawRandom(){
  ensureSlots();
  const used=new Set(DB.current.slots.filter(Boolean).map(s=>s.id));
  const pool=CARDS.filter(c=>!used.has(c.id));
  let n=0;
  DB.current.slots=DB.current.slots.map(s=>{ if(s) return s;
    const i=Math.floor(Math.random()*pool.length); const c=pool.splice(i,1)[0];
    if(!c) return null; n++; return {id:c.id, rev:Math.random()<0.3}; });
  save(); render(); toast(n+L(' kort trukket',' cards drawn'));
}
function readingText(){
  const sp=spread(); const r=buildReading();
  let t=`${L(sp.name,sp.nameEn)} · ${catLabel(DB.current.cat)}${DB.current.q?` – «${DB.current.q}»`:''}\n\n${r.overview}\n\n`;
  r.lines.forEach(l=>{ t+=`${l.pos}: ${l.name}${l.rev?L(' (omvendt)',' (reversed)'):''}\n${l.text}\n\n`; });
  if(DB.current.ai) t+=`\n${DB.current.ai}\n`;
  return t;
}
document.body.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ view=tab.dataset.tab; render(); return; }
  const sl=e.target.closest('[data-slot]');
  if(sl){ const i=+sl.dataset.slot; const s=DB.current.slots[i];
    if(s) cardSheet(s.id,i); else { pick=i; view='kort'; render(); toast(L('Velg et kort til plass ','Choose a card for spot ')+(i+1)); } return; }
  const op=e.target.closest('[data-open]');
  if(op){ const at=op.dataset.at!=null?+op.dataset.at:null;
    if(at!=null) cardSheet(op.dataset.open,at);
    else if(pick!=null){ const id=op.dataset.open; DB.current.slots[pick]={id,rev:false}; const n=pick; pick=null; save(); view='legg'; render(); const cc=card(id); toast(L(cc.no,cc.en)+L(' lagt på plass ',' placed at spot ')+(n+1)); }
    else cardSheet(op.dataset.open,null);
    return; }
  const ct=e.target.closest('[data-cat]'); if(ct){ DB.current.cat=ct.dataset.cat; save(); render(); return; }
  const fl=e.target.closest('[data-filter]'); if(fl){ filter=fl.dataset.filter; render(); return; }
  const hs=e.target.closest('[data-hist]'); if(hs){ historySheet(hs.dataset.hist); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='pickspread') spreadSheet();
  if(a==='draw') drawRandom();
  if(a==='clear'){ if(confirm(L('Tømme leggingen?','Clear the spread?'))){ DB.current.slots=[]; DB.current.ai=''; ensureSlots(); save(); render(); } }
  if(a==='toreading'){ if(!filled()) return toast(L('Legg minst ett kort først','Lay out at least one card first')); view='tolk'; render(); }
  if(a==='ai') aiSummary();
  if(a==='copy'){ await navigator.clipboard.writeText(readingText()); toast(L('Kopiert','Copied')); }
  if(a==='savereading'){ const sp=spread();
    DB.history.push({id:uid(),date:new Date().toLocaleString(lang()==='en'?'en-GB':'nb-NO',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
      spread:sp.id,spreadName:sp.name,spreadNameEn:sp.nameEn,q:DB.current.q,cat:DB.current.cat,slots:JSON.parse(JSON.stringify(DB.current.slots)),ai:DB.current.ai||''});
    save(); toast(L('Lagret i historikken','Saved to history')); render(); }
  if(a==='theme'){ DB.ui.theme = DB.ui.theme==='light'?'dark':'light'; save(); applyTheme(); }
  if(a==='lang'){ DB.ui.lang = lang()==='en'?'no':'en'; save(); render(); }
  if(a==='menu') menuSheet();
  if(a==='settings'){ closeSheet(); settingsSheet(); }
  if(a==='backup'){ closeSheet(); const bl=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
    const aEl=document.createElement('a'); aEl.href=URL.createObjectURL(bl); aEl.download='tarot-backup.json'; aEl.click(); toast(L('Lastet ned','Downloaded')); }
  if(a==='reopen'){ const h=DB.history.find(x=>x.id===b.dataset.id); if(!h) return;
    DB.current={spread:h.spread,q:h.q,cat:h.cat||'generelt',slots:JSON.parse(JSON.stringify(h.slots)),ai:h.ai}; save(); closeSheet(); view='legg'; render(); }
  if(a==='delhist'){ if(!confirm(L('Slette denne leggingen?','Delete this reading?'))) return; DB.history=DB.history.filter(x=>x.id!==b.dataset.id); save(); closeSheet(); render(); }
});
/* long press on a slot flips the card */
let pressT=null;
document.body.addEventListener('pointerdown',e=>{ const sl=e.target.closest('[data-slot]'); if(!sl) return;
  pressT=setTimeout(()=>{ const i=+sl.dataset.slot; const s=DB.current.slots[i];
    if(s){ s.rev=!s.rev; save(); render(); const cc=card(s.id); toast(L(cc.no,cc.en)+(s.rev?L(' snudd omvendt',' flipped reversed'):L(' snudd oppreist',' flipped upright'))); pressT='done'; } },550); });
['pointerup','pointercancel','pointerleave','scroll'].forEach(ev=>document.body.addEventListener(ev,()=>{ if(pressT&&pressT!=='done') clearTimeout(pressT); if(pressT==='done') setTimeout(()=>pressT=null,50); else pressT=null; },true));
document.body.addEventListener('input',e=>{
  if(e.target.id==='dq'){ q=e.target.value; const box=$('#app'); const sc=window.scrollY; render(); window.scrollTo(0,sc); const f=$('#dq'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } }
  if(e.target.id==='q'){ DB.current.q=e.target.value; save(); }
});
document.body.addEventListener('change',e=>{ if(e.target.id==='imp'){ const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ try{ const j=JSON.parse(t); if(!j.current) throw new Error(L('Ikke en gyldig fil','Not a valid file'));
    if(!confirm(L('Erstatte alt med innholdet i fila?','Replace everything with the contents of this file?'))) return; DB=j; if(!DB.ui) DB.ui={theme:'dark',lang:'no'}; save(); closeSheet(); render(); toast(L('Hentet inn','Loaded')); }
    catch(err){ toast(err.message); } }); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

function applyTheme(){ document.documentElement.classList.toggle('light', DB.ui.theme==='light');
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=DB.ui.theme==='light'?'#F5F1E8':'#120E1C'; }
/* card meanings used by the reading builder */
CARDS.forEach(c=>{ c.upText=c.up; c.revText=c.rev; });
applyTheme(); ensureSlots(); render();
</script>
