/* ---------- Importing the Excel template (WEEK 1..8 / Deload) ----------
   How the template is laid out: column B holds the day number and anchors each
   day block. Six exercises per day — three main (D, J, P) and three extra
   (V, AB, AH). From the anchor: +2 name, +3 target, +5 notes, +7..+15 sets,
   +17 session time and session RPE. K2 is the week's date, D3 the block type. */
const TPL_COLS=[[4,'main'],[10,'main'],[16,'main'],[22,'supp'],[28,'supp'],[34,'supp']];

function looksLikeTemplate(wb){
  return wb.SheetNames.some(n=>/^\s*(week|uke)\s*\d+\s*$/i.test(n) || /deload/i.test(n));
}
function tplCell(ws, r, c){
  const cell=ws[XLSX.utils.encode_cell({r:r-1, c:c-1})];
  return cell ? cell.v : undefined;
}
function tplClean(v){
  return String(v==null?'':v).replace(/•/g,' ').replace(/\s+/g,' ').trim();
}
function importTemplate(wb){
  const sheets=wb.SheetNames.filter(n=>/^\s*(week|uke)\s*\d+\s*$/i.test(n) || /deload/i.test(n));
  let addedWorkouts=0, addedSessions=0, addedSets=0;
  const seenDay=new Set();

  sheets.forEach(sn=>{
    const ws=wb.Sheets[sn]; if(!ws || !ws['!ref']) return;
    const range=XLSX.utils.decode_range(ws['!ref']);
    const weekDate=normDate(tplCell(ws,2,11));         // K2
    const anchors=[];
    for(let r=2;r<=range.e.r+1;r++){
      if(typeof tplCell(ws,r,2)==='number') anchors.push(r);
    }

    anchors.forEach(a=>{
      const dayNo=tplCell(ws,a,2);
      const exercises=[];
      TPL_COLS.forEach(([c,kind])=>{
        const raw=tplCell(ws,a+2,c);
        if(raw==null||String(raw).trim()==='') return;
        const parts=String(raw).split('\n').map(s=>s.trim()).filter(Boolean);
        let target=tplClean(tplCell(ws, a+3, kind==='main'?c+1:c));
        if(/^REPS & INTENSITY/i.test(target)) target='';
        const sets=[];
        for(let i=0;i<9;i++){
          const w=tplCell(ws,a+7+i,c+1), rp=tplCell(ws,a+7+i,c+2);
          if(typeof w==='number' && w>0 && typeof rp==='number' && rp>0)
            sets.push({w, r:rp});
        }
        exercises.push({name:toEn(parts[0]),
                        note:parts.slice(1).map(toEn).join(' / '),
                        target:toEn(target), kind,
                        exNotes:tplClean(tplCell(ws,a+5,c+1)), sets});
      });
      if(!exercises.length) return;

      /* The layout becomes a workout — once per day number only, since
         every week repeats the same four days. */
      const woName=`Dag ${dayNo}`;
      if(!seenDay.has(dayNo)){
        seenDay.add(dayNo);
        const existing=DB.workouts.find(w=>w.name===woName);
        const built={id:existing?existing.id:uid(), name:woName,
          exercises:exercises.map(e=>({id:uid(), name:e.name, note:e.note,
            target:e.target, kind:e.kind, sets:Math.max(1, e.sets.length||DB.settings.defaultSets||3)}))};
        if(existing) Object.assign(existing, {exercises:built.exercises});
        else { DB.workouts.push(built); addedWorkouts++; }
      }

      /* Logged sets become a session. The template dates the week only, so day N
         lands N-1 days after the week's start — move it in the calendar. */
      const logged=exercises.filter(e=>e.sets.length);
      if(logged.length && weekDate){
        const d=parseYmd(weekDate); d.setDate(d.getDate()+(Number(dayNo)-1));
        const dateKey=ymd(d);
        const mins=tplCell(ws,a+17,17);
        const ses={id:uid(), date:dateKey, workoutId:null, workoutName:woName,
          minutes:typeof mins==='number'?mins:'', notes:'',
          exercises:logged.map(e=>({name:e.name, note:e.note, target:e.target,
                                    kind:e.kind, exNotes:e.exNotes, sets:e.sets}))};
        const dupe=DB.sessions.findIndex(s=>s.date===ses.date && s.workoutName===ses.workoutName);
        if(dupe>=0) DB.sessions[dupe]=ses; else DB.sessions.push(ses);
        addedSessions++; addedSets += logged.reduce((n,e)=>n+e.sets.length,0);
      }
    });
  });
  DB.sessions.sort((a,b)=>a.date.localeCompare(b.date));
  return {addedWorkouts, addedSessions, addedSets};
}

/* ---------- IMPORT ---------- */
function importSheet(){
  const c=el(`<div>
    <h3>Import</h3>
    <p class="sh-sub">Upload your Excel template, a file exported from here, or a JSON backup. The format is detected automatically.</p>
    <input type="file" id="fpick" accept=".xlsx,.xls,.csv,.json" style="display:none">
    <button class="btn primary full" data-act="pickfile">Choose a file</button>
    <div class="tiny muted" style="margin-top:16px;line-height:1.6">
      <b style="color:var(--text)">Your Excel template</b> — the WEEK 1–8 and Deload sheets are read directly.
      The day layouts become workouts, and any sets already filled in become logged sessions.<br><br>
      <b style="color:var(--text)">JSON</b> — restores everything exactly as it was.
    </div>
  </div>`);
  const sh=openSheet(c);
  const fp=sh.querySelector('#fpick');
  sh.querySelector('[data-act=pickfile]').onclick=()=>fp.click();
  fp.onchange=()=>{ if(fp.files[0]) readImport(fp.files[0]); };
}
function readImport(file){
  const fr=new FileReader();
  const isJson=/\.json$/i.test(file.name);
  fr.onload=()=>{
    try{
      if(isJson){
        const obj=JSON.parse(fr.result);
        if(!obj || !Array.isArray(obj.workouts)) throw new Error('bad');
        DB=Object.assign(seed(), obj); save();
        closeSheet(); view='today'; render(); toast('Backup restored'); return;
      }
      if(typeof XLSX==='undefined'){ toast('Excel reading needs a connection — use JSON offline'); return; }
      const wb=XLSX.read(fr.result,{type:'array'});

      if(looksLikeTemplate(wb)){
        const res=importTemplate(wb);
        save(); closeSheet();
        view = res.addedSessions ? 'progress' : 'workouts';
        editingWorkout=null; render();
        const bits=[];
        if(res.addedWorkouts) bits.push(`${res.addedWorkouts} workouts`);
        if(res.addedSets) bits.push(`${res.addedSets} sets`);
        toast(bits.length ? `Imported ${bits.join(' and ')}` : 'Nothing found to import');
        return;
      }

      const name = wb.SheetNames.find(n=>/^log$/i.test(n)) || wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''});
      const n=mergeRows(rows);
      if(!n){ toast('No usable rows found'); return; }
      save(); closeSheet(); view='progress'; render(); toast(`Imported ${n} sets`);
    }catch(e){ console.error(e); toast('Could not read that file'); }
  };
  fr.onerror=()=>toast('Could not read that file');
  if(isJson) fr.readAsText(file); else fr.readAsArrayBuffer(file);
}
/* Norwegian column names must survive æ, ø and å, and an exact match has to
   beat a prefix match — otherwise "Økttid" hijacks the column called "Økt". */
function normKey(k){
  return String(k).toLowerCase()
    .replace(/ø/g,'o').replace(/æ/g,'ae').replace(/å/g,'a')
    .replace(/[^a-z0-9]/g,'');
}
function pick(row, ...keys){
  const cols=Object.keys(row).map(k=>[k, normKey(k)]);
  for(const [k,kk] of cols) if(keys.some(t=>kk===t)) return row[k];
  for(const [k,kk] of cols) if(keys.some(t=>kk.startsWith(t))) return row[k];
  return '';
}
function normDate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ // Excel serial
    const d=new Date(Math.round((v-25569)*86400000));
    return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/); if(m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  const d=new Date(s); return isNaN(d)?null:ymd(d);
}
function mergeRows(rows){
  const buckets=new Map();
  let count=0;
  rows.forEach(r=>{
    const date=normDate(pick(r,'date','dato'));
    const exName=String(pick(r,'exercise','exercisename','ovelse')||'').trim();
    const w=parseFloat(pick(r,'weight','weightkg','kg','vekt'));
    const reps=parseFloat(pick(r,'reps','rep','repetitions'));
    if(!date||!exName||!(w>0)||!(reps>0)) return;
    const wo=String(pick(r,'workout','workoutname','okt')||'Imported').trim()||'Imported';
    const note=String(pick(r,'reprange','repomrade','note','notes')||'').trim();
    const target=String(pick(r,'target','mal')||'').trim();
    const kind=/extra|tillegg|supp/i.test(String(pick(r,'type','kind')||'')) ? 'supp' : 'main';
    const mins=parseFloat(pick(r,'okttid','sessionminutes','minutes','sessiontime'));
    const key=date+'||'+wo;
    if(!buckets.has(key)) buckets.set(key,{id:uid(),date,workoutId:null,workoutName:wo,
      minutes:isNaN(mins)?'':mins, notes:'', exercises:[]});
    const b=buckets.get(key);
    let ex=b.exercises.find(e=>e.name.toLowerCase()===exName.toLowerCase());
    if(!ex){ ex={name:exName, note, target, kind, exNotes:'', sets:[]}; b.exercises.push(ex); }
    ex.sets.push({w, r:reps});
    count++;
  });
  buckets.forEach((b,key)=>{
    const dupe=DB.sessions.findIndex(s=>s.date===b.date && s.workoutName===b.workoutName);
    if(dupe>=0) DB.sessions[dupe]=b; else DB.sessions.push(b);
  });
  DB.sessions.sort((a,b)=>a.date.localeCompare(b.date));
  return count;
}

/* ============================================================
   Event wiring
   ============================================================ */
function bind(){
  if(bind._done) return;
  bind._done=true;
  const app=$('#app');

  app.addEventListener('click', e=>{
    const t=e.target.closest('[data-act]'); if(!t) return;
    const a=t.dataset.act;

    if(a==='theme'){ DB.settings.theme = isLight() ? 'dark' : 'light'; save(); applyTheme(); render(); return; }
    if(a==='menu') return menuSheet();
    if(a==='switchwo') return switchWorkoutSheet();

    if(a==='back'){ if(openRecipe){ openRecipe=null; render(); return; } editingWorkout=null; render(); return; }
    if(a==='gotoday'){ view='today'; render(); return; }
    if(a==='lang'){ DB.settings.lang = lang()==='no' ? 'en' : 'no'; applyLang(); save(); render(); return; }
    if(a==='gotrening'){ mode='trening'; DB.settings.appMode='trening'; save(); view='today'; render(); return; }
    if(a==='gofood'){ mode='food'; DB.settings.appMode='food'; save(); view='foodlog'; render(); return; }

    /* ---- food: navigation ---- */
    if(a==='gosearch'){ view='foodsearch'; render(); window.scrollTo(0,0); return; }
    if(a==='fday'){ foodDate=shiftDay(foodDate||todayKey(), +t.dataset.d); render(); return; }
    if(a==='gotoday2'){ if(foodDate!==todayKey()){ foodDate=todayKey(); render(); } return; }
    if(a==='back' && openRecipe){ openRecipe=null; render(); return; }

    /* ---- food: weight ---- */
    if(a==='logweight') return weightSheet();
    if(a==='dosearch'){ doSearch(); return; }
    if(a==='manualbarcode') return barcodeSheet();
    if(a==='scanbar') return scanSheet(t.dataset.ctx||null);
    if(a==='addmanual') return manualFoodSheet();
    if(a==='addnewfood') return newFoodSheet(fq, null);
    if(a==='pickresult') return logResultSheet(t.dataset.id);
    if(a==='pickfreq'){
      const r=frequentFoods(50).find(x=>x.key===t.dataset.key); if(!r) return;
      fResults=[{id:'freq:'+r.key, name:r.name, brand:r.brand, source:r.source, per100:r.per100}];
      logResultSheet('freq:'+r.key, r.lastQty); return;
    }
    if(a==='delentry'){
      const day=foodDate||todayKey();
      DB.food.entries[day]=(DB.food.entries[day]||[]).filter(e=>e.id!==t.dataset.id);
      save(); render(); toast('Removed'); return;
    }
    if(a==='mealmenu') return mealMenuSheet(t.dataset.meal);
    if(a==='meals') return mealsSheet();

    /* ---- food: recipes ---- */
    if(a==='newrecipe'){
      const r={id:uid(), name:'New recipe', servings:1, ingredients:[]};
      DB.food.recipes.push(r); save(); openRecipe=r.id; view='foodrecipes'; render(); return;
    }
    if(a==='openrecipe'){ openRecipe=t.dataset.id; render(); return; }
    if(a==='logrecipe'){
      const r=DB.food.recipes.find(x=>x.id===t.dataset.id); if(!r||!r.ingredients.length) return;
      /* Reuse the normal log sheet so servings, the live preview and the
         meal-of-day labelling all behave exactly as they do elsewhere. */
      fResults=[{id:'recipe:'+r.id, name:r.name, brand:'Your recipe', source:'Recipe', isRecipe:true, perServing:recipeServingNut(r)}];
      return logResultSheet('recipe:'+r.id, 1);
    }
    if(a==='delrecipe'){
      return confirmSheet('Delete this recipe?','It will be removed for good.','Delete',()=>{
        DB.food.recipes=DB.food.recipes.filter(x=>x.id!==t.dataset.id);
        openRecipe=null; save(); view='foodrecipes'; render(); toast('Deleted');
      }, true);
    }
    if(a==='addingredient') return addIngredientSheet();
    if(a==='delingredient'){
      const rec=DB.food.recipes.find(x=>x.id===openRecipe); if(!rec) return;
      rec.ingredients.splice(+t.dataset.i,1); save(); render(); return;
    }

    /* ---- food: goals & API key ---- */
    if(a==='savegoals'){
      const protein=Math.round(parseFloat(document.querySelector('#gprotein').value)||0);
      const carbs=Math.round(parseFloat(document.querySelector('#gcarbs').value)||0);
      const fat=Math.round(parseFloat(document.querySelector('#gfat').value)||0);
      const fiber=Math.round(parseFloat(document.querySelector('#gfiber').value)||0);
      DB.food.goals={kcal:Math.round(protein*4 + carbs*4 + fat*9), protein, carbs, fat, fiber};
      save(); render(); toast('Goals saved'); return;
    }
    if(a==='mvtupdate'){
      const st=document.querySelector('#mvtStat');
      if(st){ st.style.color='var(--muted)'; st.textContent='Downloading the food table…'; }
      mvtEnsure(true).then(items=>{
        if(st){ st.style.color='var(--good)'; st.textContent=`${fmtK(items.length)} ingredients stored · downloaded ${prettyDate(todayKey()).toLowerCase()}`; }
        toast('Food table ready');
      }).catch(e=>{
        if(st){ st.style.color='var(--warn)'; st.textContent='Download failed: '+(e.message||'unknown error'); }
      });
      return;
    }
    if(a==='savekey'){
      DB.food.settings.kassalKey=(document.querySelector('#kkey').value||'').trim();
      save(); render(); toast('Key saved'); return;
    }

    /* today */
    if(a==='start') return startWorkout(t.dataset.id);
    if(a==='pickstart') return pickWorkoutSheet();
    if(a==='viewses') return sessionSheet(t.dataset.id);
    if(a==='addset'){ const ex=DB.draft.exercises[+t.dataset.ex]; ex.sets.push(...makeSets(ex,1)); save(); render(); return; }
    /* switches on a live exercise: every set follows, filled ones included */
    if(a==='exunit'){ const ex=DB.draft.exercises[+t.dataset.ex]; ex.unit=t.dataset.v; (ex.sets||[]).forEach(x=>x.u=ex.unit); save(); render(); return; }
    if(a==='exlimbs'){ const ex=DB.draft.exercises[+t.dataset.ex]; setLimbs(ex,+t.dataset.v); save(); render(); return; }
    /* the same switches as defaults in the workout */
    if(a==='defunit'||a==='deflimbs'){ const w=DB.workouts.find(x=>x.id===editingWorkout); const e2=w&&w.exercises[+t.dataset.i]; if(!e2) return;
      if(a==='defunit') e2.unit=t.dataset.v; else e2.limbs=+t.dataset.v; save(); render(); return; }
    if(a==='delset'){ DB.draft.exercises[+t.dataset.ex].sets.splice(+t.dataset.set,1); save(); render(); return; }
    if(a==='exmenu') return exMenuSheet(+t.dataset.ex);
    if(a==='addex') return addExSheet();
    if(a==='discard') return confirmSheet('Discard this workout?','Nothing will be saved.','Discard',()=>{
      DB.draft=null; save(); render(); toast('Discarded'); }, true);
    if(a==='finish') return finishSession();

    /* calendar */
    if(a==='prevm'){ cal.m--; if(cal.m<0){cal.m=11;cal.y--;} render(); return; }
    if(a==='nextm'){ cal.m++; if(cal.m>11){cal.m=0;cal.y++;} render(); return; }
    if(a==='thismonth'){ const n=new Date(); cal={y:n.getFullYear(),m:n.getMonth()}; render(); return; }
    if(a==='day') return daySheet(t.dataset.k);

    /* workouts */
    if(a==='newwo'){
      const w={id:uid(),name:'New workout',exercises:[]};
      DB.workouts.push(w); save(); editingWorkout=w.id; view='workouts'; render(); window.scrollTo(0,0); return;
    }
    if(a==='editwo'){ editingWorkout=t.dataset.id; render(); window.scrollTo(0,0); return; }
    if(a==='addexdef'){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      w.exercises.push({id:uid(),name:'',note:'',target:'',kind:'main',unit:'reps',limbs:2,sets:DB.settings.defaultSets||3});
      save(); render();
      const ins=app.querySelectorAll('[data-ef=name]'); if(ins.length) ins[ins.length-1].focus();
      return;
    }
    if(a==='delex'){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      w.exercises.splice(+t.dataset.i,1); save(); render(); return;
    }
    if(a==='kind'){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      const e2=w.exercises[+t.dataset.i];
      e2.kind = (e2.kind==='supp') ? 'main' : 'supp';
      save(); render(); return;
    }
    if(a==='up'||a==='down'){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      const i=+t.dataset.i, j=a==='up'?i-1:i+1;
      if(j<0||j>=w.exercises.length) return;
      [w.exercises[i],w.exercises[j]]=[w.exercises[j],w.exercises[i]];
      save(); render(); return;
    }
    if(a==='dupwo'){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      const copy=JSON.parse(JSON.stringify(w)); copy.id=uid(); copy.name=w.name+' (copy)';
      copy.exercises.forEach(e=>e.id=uid());
      DB.workouts.push(copy); save(); editingWorkout=copy.id; render(); toast('Duplicated'); return;
    }
    if(a==='startthis'){
      if(DB.draft) return toast('Finish or discard the workout in progress first');
      return startWorkout(editingWorkout);
    }
    if(a==='delwo'){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      return confirmSheet('Delete this workout?',`"${w.name}" will be removed. Sessions you already logged stay in your history.`,'Delete',()=>{
        DB.workouts=DB.workouts.filter(x=>x.id!==editingWorkout);
        Object.keys(DB.schedule).forEach(k=>{
          DB.schedule[k]=DB.schedule[k].filter(id=>id!==editingWorkout);
          if(!DB.schedule[k].length) delete DB.schedule[k];
        });
        editingWorkout=null; save(); render(); toast('Deleted');
      }, true);
    }

    /* progress */
    if(a==='pmode'){
      prog.mode=t.dataset.v;
      prog.metric = prog.mode==='exercise' ? 'e1rm' : 'ton';
      render(); return;
    }
    if(a==='pmetric'){ prog.metric=t.dataset.v; render(); return; }
    if(a==='pex'){ prog.exercise=t.dataset.v; render(); return; }
  });

  app.addEventListener('input', e=>{
    const t=e.target;
    /* live session fields */
    if(DB.draft && t.dataset.f && t.dataset.ex!=null && t.dataset.set!=null){
      const s=DB.draft.exercises[+t.dataset.ex].sets[+t.dataset.set];
      s[t.dataset.f]=t.value;
      t.classList.toggle('filled', !!t.value);
      save(); refreshLiveTotals(); return;
    }
    if(DB.draft && t.dataset.exnote!=null){
      DB.draft.exercises[+t.dataset.exnote].exNotes = t.value; save(); return;
    }
    if(DB.draft && t.dataset.f && ['minutes','notes'].includes(t.dataset.f)){
      DB.draft[t.dataset.f]=t.value; save(); refreshLiveTotals(); return;
    }
    /* workout editor */
    if(t.dataset.wf){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      w.name=t.value; save();
      const h=$('.topbar .sub'); if(h) h.textContent=t.value; return;
    }
    if(t.dataset.ef){
      const w=DB.workouts.find(x=>x.id===editingWorkout);
      const e2=w.exercises[+t.dataset.i]; if(!e2) return;
      e2[t.dataset.ef] = t.dataset.ef==='sets' ? Math.max(1,Math.min(16,parseInt(t.value)||1)) : t.value;
      save(); return;
    }
  });

  /* sheet-level events (delegated on body) */
  {
    document.body.addEventListener('click', e=>{
      const t=e.target.closest('.sheet [data-act]'); if(!t) return;
      const a=t.dataset.act;

      /* ---- food: sheet-only actions ---- */
      if(a==='savewt'){
        const v=parseFloat(document.querySelector('#wkg').value);
        if(!v || v<=0){ toast('Enter a weight first'); return; }
        setWeight(foodDate||todayKey(), round1(v)); save(); closeSheet(); render(); toast('Saved'); return;
      }
      if(a==='scanbar'){ closeSheet(); return scanSheet(t.dataset.ctx||null); }
      if(a==='canceLscan'){ scanCtx=null; stopScan(); closeSheet(); return; }
      if(a==='livescan') return liveScanSheet();
      if(a==='manualbarcode'){ stopScan(); return barcodeSheet(); }
      if(a==='doean'){
        const ean=(document.querySelector('#eanIn').value||'').trim();
        if(!ean){ toast('Type the barcode number'); return; }
        closeSheet(); handleEan(ean); return;
      }
      if(a==='domanual'){
        const name=(document.querySelector('#mfname').value||'').trim();
        if(!name){ toast('Give it a name first'); return; }
        const amt=(document.querySelector('#mfamt').value||'').trim();
        const now=nowTime();
        const entry={id:uid(), time:now, meal:defaultMealFor(now), name, brand:amt, source:'manual',
          kcal:Math.round(parseFloat(document.querySelector('#mfkcal').value)||0),
          protein:round1(parseFloat(document.querySelector('#mfp').value)||0),
          carbs:round1(parseFloat(document.querySelector('#mfc').value)||0),
          fat:round1(parseFloat(document.querySelector('#mff').value)||0),
          fiber:round1(parseFloat(document.querySelector('#mffiber').value)||0), qty:1, unit:'serving'};
        const day=foodDate||todayKey();
        (DB.food.entries[day]=DB.food.entries[day]||[]).push(entry);
        save(); closeSheet(); view='foodlog'; render(); toast('Added'); return;
      }
      if(a==='dolog'){
        const r=(fResults||[]).find(x=>x.id===t.dataset.id); if(!r) return;
        const qv=parseFloat(document.querySelector('#lgqty').value)||0;
        if(qv<=0){ toast('Enter an amount first'); return; }
        const now2=nowTime();
        let entry;
        if(r.isRecipe){
          entry={id:uid(), time:now2, meal:defaultMealFor(now2), name:r.name, brand:'Recipe', source:'recipe',
            kcal:Math.round(r.perServing.kcal*qv), protein:round1(r.perServing.protein*qv),
            carbs:round1(r.perServing.carbs*qv), fat:round1(r.perServing.fat*qv), fiber:round1(r.perServing.fiber*qv), qty:qv, unit:'serving'};
        } else {
          const n=scaleNut(r.per100, qv);
          entry={id:uid(), time:now2, meal:defaultMealFor(now2), name:r.name, brand:r.brand, source:r.source,
            kcal:n.kcal, protein:n.protein, carbs:n.carbs, fat:n.fat, fiber:n.fiber, qty:qv, unit:'g', per100:r.per100};
        }
        const day=foodDate||todayKey();
        (DB.food.entries[day]=DB.food.entries[day]||[]).push(entry);
        save(); closeSheet(); view='foodlog'; render();
        toast('Added to '+(day===todayKey()?'today':prettyDate(day).toLowerCase())); return;
      }
      if(a==='pickingredient') return ingredientGramsSheet(+t.dataset.i);
      if(a==='confirmingredient'){
        const r=ingSearchResults[+t.dataset.i]; if(!r) return;
        const qv=parseFloat(document.querySelector('#igqty').value)||100;
        const rec=DB.food.recipes.find(x=>x.id===openRecipe); if(!rec) return;
        rec.ingredients.push({name:r.name, qty:qv, per100:r.per100});
        save(); closeSheet(); render(); toast('Added to recipe'); return;
      }
      if(a==='addnewfood'){
        const ctx=t.dataset.ctx;
        const prefill = ctx==='manual' ? (document.querySelector('#mfname')?.value||'')
                       : ctx==='ingredient' ? ingQ
                       : ctx==='meal' ? (document.querySelector('#mealq')?.value||'') : '';
        closeSheet();
        return newFoodSheet(prefill, ctx==='ingredient'?'recipe':ctx==='meal'?'meal':null);
      }
      if(a==='savenewfood'){
        const name=(document.querySelector('#nfname').value||'').trim();
        if(!name){ toast('Give it a name first'); return; }
        const per100={
          kcal:Math.round(parseFloat(document.querySelector('#nfkcal').value)||0),
          protein:round1(parseFloat(document.querySelector('#nfp').value)||0),
          carbs:round1(parseFloat(document.querySelector('#nfc').value)||0),
          fat:round1(parseFloat(document.querySelector('#nff').value)||0),
          fiber:round1(parseFloat(document.querySelector('#nffiber').value)||0)};
        const brand=(document.querySelector('#nfbrand').value||'').trim();
        const food={id:uid(), name, brand, per100};
        DB.food.customFoods.push(food); save(); closeSheet();
        const asResult={id:'custom:'+food.id, name:food.name, brand:food.brand||'Your food', source:'Your food', per100:food.per100};
        toast('Saved — it\u2019ll show up in search from now on');
        if(t.dataset.ctx==='recipe'){
          ingSearchResults=[asResult]; ingredientGramsSheet(0);
        } else if(t.dataset.ctx==='meal'){
          mealSearchResults=[asResult]; mealItemQtySheet(0);
        } else {
          fResults=[asResult]; logResultSheet(asResult.id);
        }
        return;
      }
      if(a==='copymealto'){ closeSheet(); return copyMealDaySheet(t.dataset.meal); }
      if(a==='renamemealask'){ closeSheet(); return renameMealSheet(t.dataset.meal); }
      if(a==='delmeal'){
        const meal=t.dataset.meal, day=foodDate||todayKey();
        return confirmSheet(`Delete "${meal}"?`,'Every item logged under this meal today will be removed.','Delete',()=>{
          DB.food.entries[day]=(DB.food.entries[day]||[]).filter(e=>(e.meal||'Other')!==meal);
          save(); closeSheet(); render(); toast('Deleted');
        }, true);
      }
      if(a==='dorenamemeal'){
        const oldName=t.dataset.meal, day=foodDate||todayKey();
        const newName=(document.querySelector('#rnmeal').value||'').trim()||oldName;
        (DB.food.entries[day]||[]).forEach(e=>{ if((e.meal||'Other')===oldName) e.meal=newName; });
        save(); closeSheet(); render(); toast('Renamed'); return;
      }
      if(a==='docopymeal'){
        const meal=t.dataset.meal, day=foodDate||todayKey();
        const target=document.querySelector('#cpdate').value;
        if(!target){ toast('Pick a date first'); return; }
        const items=(DB.food.entries[day]||[]).filter(e=>(e.meal||'Other')===meal);
        if(!items.length){ toast('Nothing to copy'); return; }
        const clones=items.map(e=>({...e, id:uid()}));
        (DB.food.entries[target]=DB.food.entries[target]||[]).push(...clones);
        save(); closeSheet();
        toast(`Copied ${clones.length} item${clones.length===1?'':'s'} to ${prettyDate(target).toLowerCase()}`);
        if(target===foodDate) render();
        return;
      }

      /* ---- saved meal templates ---- */
      if(a==='openmeal') return mealDetailSheet(t.dataset.id);
      if(a==='newmeal') return newMealSheet();
      if(a==='createmeal'){
        const name=(document.querySelector('#nmname').value||'').trim();
        if(!name){ toast('Give it a name first'); return; }
        const m={id:uid(), name, items:[]};
        DB.food.meals.push(m); save();
        mealDetailSheet(m.id); return;
      }
      if(a==='addmealitem') return addMealItemSheet();
      if(a==='pickmealitem') return mealItemQtySheet(+t.dataset.i);
      if(a==='confirmmealitem'){
        const r=mealSearchResults[+t.dataset.i]; if(!r) return;
        const qv=parseFloat(document.querySelector('#miqty').value)||100;
        const m=DB.food.meals.find(x=>x.id===openMeal); if(!m) return;
        const n=scaleNut(r.per100, qv);
        m.items.push({name:r.name, brand:r.brand, source:r.source, per100:r.per100, qty:qv, unit:'g',
          kcal:n.kcal, protein:n.protein, carbs:n.carbs, fat:n.fat, fiber:n.fiber});
        save(); closeSheet(); mealDetailSheet(m.id); toast('Added to meal'); return;
      }
      if(a==='delmealitem'){
        const m=DB.food.meals.find(x=>x.id===openMeal); if(!m) return;
        m.items.splice(+t.dataset.i,1); save(); mealDetailSheet(m.id); return;
      }
      if(a==='delsavedmeal'){
        const id=t.dataset.id;
        return confirmSheet('Delete this meal?','The saved combo will be removed. Anything already logged stays as it is.','Delete',()=>{
          DB.food.meals=DB.food.meals.filter(x=>x.id!==id); openMeal=null; save(); mealsSheet(); toast('Deleted');
        }, true);
      }
      if(a==='logmeal'){
        const m=DB.food.meals.find(x=>x.id===t.dataset.id); if(!m||!m.items.length) return;
        const now3=nowTime(), meal=defaultMealFor(now3), day=foodDate||todayKey();
        const clones=m.items.map(it=>({id:uid(), time:now3, meal, name:it.name, brand:it.brand, source:it.source,
          per100:it.per100, qty:it.qty, unit:it.unit, kcal:it.kcal, protein:it.protein, carbs:it.carbs, fat:it.fat, fiber:it.fiber}));
        (DB.food.entries[day]=DB.food.entries[day]||[]).push(...clones);
        save(); closeSheet(); view='foodlog'; render();
        toast(`Added ${clones.length} item${clones.length===1?'':'s'} from ${m.name}`); return;
      }
      if(a==='export') return doExport();
      if(a==='exportjson') return doExportJson();
      if(a==='import'){ closeSheet(); return importSheet(); }
      if(a==='reset') return confirmSheet('Erase everything?','All workouts, sessions and plans on this device will be deleted. Export a backup first if you want to keep them.','Erase',()=>{
        DB=seed(); save(); closeSheet(); view='today'; render(); toast('Deleted'); }, true);

      if(a==='plan'){
        const sel=document.querySelector('#planpick'); if(!sel) return;
        const k=t.dataset.k;
        (DB.schedule[k]=DB.schedule[k]||[]).push(sel.value);
        save(); render(); daySheet(k); toast('Planned'); return;
      }
      if(a==='unplan'){
        const k=t.dataset.k;
        DB.schedule[k].splice(+t.dataset.i,1);
        if(!DB.schedule[k].length) delete DB.schedule[k];
        save(); render(); daySheet(k); return;
      }
      if(a==='startday'){
        if(DB.draft) return toast('Finish or discard the workout in progress first');
        closeSheet(); return startWorkout(t.dataset.id, t.dataset.k);
      }
      if(a==='pickone'){ closeSheet(); return startWorkout(t.dataset.id); }
      if(a==='savemeta'){
        const nm=(document.querySelector('#swname').value||'').trim();
        const dt=(document.querySelector('#swdate').value||'').trim();
        if(!nm){ document.querySelector('#swname').focus(); toast('The session needs a name'); return; }
        if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){ toast('Invalid date'); return; }
        DB.draft.workoutName=nm; DB.draft.date=dt;
        save(); closeSheet(); render(); toast('Saved'); return;
      }
      if(a==='switchto'){
        const id=t.dataset.id;
        if(id===DB.draft.workoutId){ closeSheet(); return; }
        const logged=DB.draft.exercises.reduce((n,e)=>n+(e.sets||[]).filter(setValid).length,0);
        if(!logged) return switchDraftTo(id);
        const w=DB.workouts.find(x=>x.id===id);
        return confirmSheet('Switch to '+w.name+'?',
          `${logged} logged sets are kept, and the exercises from ${w.name} are added below.`,
          'Switch', ()=>switchDraftTo(id));
      }
      if(a==='newquick'){ closeSheet(); return newQuickSheet(); }
      if(a==='createquick'){
        const nameEl=document.querySelector('#qwname');
        const name=(nameEl.value||'').trim();
        if(!name){ nameEl.focus(); toast('Give it a name first'); return; }
        const lines=(document.querySelector('#qwex').value||'').split('\n')
          .map(l=>l.trim()).filter(Boolean);
        const w={id:uid(), name, exercises:lines.map(l=>{
          const [nm,...rest]=l.split('|');
          return {id:uid(), name:nm.trim(), note:rest.join('|').trim(),
                  sets:DB.settings.defaultSets||3};
        })};
        DB.workouts.push(w); save(); closeSheet();
        startWorkout(w.id);
        toast(w.exercises.length ? 'Saved to your workouts' : 'Created — add exercises as you go');
        return;
      }
      if(a==='viewses'){ return sessionSheet(t.dataset.id); }
      if(a==='delses'){
        const id=t.dataset.id;
        return confirmSheet('Delete this session?','It disappears from your history and progress charts.','Delete',()=>{
          DB.sessions=DB.sessions.filter(s=>s.id!==id); save(); render(); toast('Deleted'); }, true);
      }
      if(a==='reopen'){
        if(DB.draft) return toast('Finish the workout in progress first');
        const s=DB.sessions.find(x=>x.id===t.dataset.id); if(!s) return;
        DB.draft=JSON.parse(JSON.stringify(s));
        const back=restoreSkipped(DB.draft);
        DB.sessions=DB.sessions.filter(x=>x.id!==s.id);
        if(back) setTimeout(()=>toast(`${back} skipped ${back===1?'exercise':'exercises'} added back`),50);
        save(); closeSheet(); view='today'; render(); window.scrollTo(0,0); return;
      }
      if(a==='confirmaddex'){
        const inp=document.querySelector('#newexname');
        const note=document.querySelector('#newexnote');
        const nm=(inp.value||'').trim(); if(!nm){ inp.focus(); return; }
        DB.draft.exercises.push({name:nm, note:(note.value||'').trim(), unit:'reps', limbs:2,
          sets:Array.from({length:DB.settings.defaultSets||3},()=>newSet(null))});
        save(); closeSheet(); render(); return;
      }
      if(a==='renameex'){
        const i=+t.dataset.ex;
        const nm=document.querySelector('#exrename').value.trim();
        const nt=document.querySelector('#exrenote').value.trim();
        if(nm) DB.draft.exercises[i].name=nm;
        DB.draft.exercises[i].note=nt;
        save(); closeSheet(); render(); return;
      }
      if(a==='removeex'){
        const i=+t.dataset.ex;
        DB.draft.exercises.splice(i,1); save(); closeSheet(); render(); return;
      }
    });
    document.body.addEventListener('input', e=>{
      const t=e.target;
      if(t.dataset.sf){ DB.settings[t.dataset.sf]=Math.max(1,Math.min(16,parseInt(t.value)||3)); save(); return; }
    });
  }
}

function refreshLiveTotals(){
  if(!DB.draft) return;
  const st=sessionStats(DB.draft);
  const vals=document.querySelectorAll('.wrap > .card .stat .v');
  if(vals.length>=2){
    vals[0].textContent=fmtK(st.ton);
    vals[1].textContent=st.reps;
  }
  DB.draft.exercises.forEach((ex,i)=>{
    const blk=document.querySelectorAll('.exblock')[i];
    if(!blk) return;
    const s=exStats(ex);
    const box=blk.querySelector('.exstats');
    if(box) box.innerHTML = exStatsHtml(s);
  });
}


/* Tap the title during a session to rename it, move it to another day, or
   switch to a different workout entirely. Logged sets survive a switch — they
   stay put, and the new workout's exercises are added below. */
function switchWorkoutSheet(){
  const d=DB.draft; if(!d) return;
  const logged=d.exercises.reduce((n,e)=>n+(e.sets||[]).filter(setValid).length,0);
  const list=DB.workouts.map(w=>{
    const cur = w.id===d.workoutId;
    return `<button class="item" data-act="switchto" data-id="${w.id}">
      <div class="body"><b>${esc(w.name)}</b><span>${esc(w.exercises.map(e=>e.name).join(' · ')||'No exercises')}</span></div>
      ${cur?'<span class="pill on">Current</span>':`<span class="chev">${ICON.chev}</span>`}</button>`;
  }).join('');
  const c=el(`<div>
    <h3>This session</h3>
    <p class="sh-sub">Change the name or date, or switch to a different workout.</p>
    <div class="field"><label>Name</label>
      <input type="text" id="swname" value="${esc(d.workoutName)}" placeholder="Workout name"></div>
    <div class="field"><label>Date</label>
      <input type="date" id="swdate" value="${d.date}"></div>
    <button class="btn primary full" data-act="savemeta">Save changes</button>
    <div class="sectitle">Switch to a different workout</div>
    ${logged?`<p class="tiny muted" style="margin:-2px 2px 10px">${logged} sets are already logged. They stay, and the new workout's exercises are added below.</p>`:''}
    ${list}
  </div>`);
  openSheet(c);
}
function switchDraftTo(id){
  const w=DB.workouts.find(x=>x.id===id), d=DB.draft;
  if(!w||!d) return;
  const kept=d.exercises.filter(e=>(e.sets||[]).filter(setValid).length || (e.exNotes||'').trim());
  const have=new Set(kept.map(e=>e.name.toLowerCase()));
  const added=w.exercises.filter(e=>!have.has(e.name.toLowerCase())).map(e=>({
    name:e.name, note:e.note||'', target:e.target||'', kind:e.kind||'main', exNotes:'', unit:exUnit(e), limbs:Number(e.limbs)===1?1:2,
    sets:makeSets(e,e.sets||DB.settings.defaultSets||3)}));
  d.exercises=[...kept, ...added];
  d.workoutId=w.id; d.workoutName=w.name;
  save(); closeSheet(); render(); window.scrollTo(0,0);
  toast(kept.length ? `Switched to ${w.name} — kept ${kept.length} exercises` : `Switched to ${w.name}`);
}

/* Saving drops exercises with no sets, so a reopened session would only show what
   was done. Put the workout's skipped exercises back, empty, in their usual place. */
function restoreSkipped(d){
  const w=DB.workouts.find(x=>x.id===d.workoutId); if(!w) return 0;
  const key=n=>String(n||'').trim().toLowerCase();
  const has=new Set(d.exercises.map(e=>key(e.name)));
  let added=0;
  w.exercises.forEach((e,i)=>{
    if(!e.name||has.has(key(e.name))) return;
    let at=0;
    for(let j=i-1;j>=0;j--){ const k=d.exercises.findIndex(x=>key(x.name)===key(w.exercises[j].name)); if(k>=0){ at=k+1; break; } }
    d.exercises.splice(at,0,{name:e.name, note:e.note||'', target:e.target||'', kind:e.kind||'main', exNotes:'', unit:exUnit(e), limbs:Number(e.limbs)===1?1:2,
      sets:makeSets(e,e.sets||DB.settings.defaultSets||3)});
    has.add(key(e.name)); added++;
  });
  return added;
}

function finishSession(){
  const d=DB.draft;
  const st=sessionStats(d);
  if(!st.sets){ toast('Fill in at least one set first'); return; }
  confirmSheet('Save this workout?',
    `${st.sets} sets · ${fmtK(st.ton)} kg · ${st.reps} reps. It goes into your history and charts.`,
    'Save', ()=>{
      d.exercises.forEach(e=>{ e.sets=(e.sets||[]).filter(setValid); });
      d.exercises=d.exercises.filter(e=>e.sets.length || (e.exNotes||'').trim());
      DB.sessions.push(d);
      DB.sessions.sort((a,b)=>a.date.localeCompare(b.date));
      DB.draft=null; save(); view='progress'; render(); window.scrollTo(0,0); toast('Workout saved');
    });
}


/* Anything saved by an earlier Norwegian build still holds Norwegian names in
   local storage, so a reload would keep showing them. Rename in place, once. */
const WORKOUT_EN = {
  'dag 1 – overkropp':'Day 1 – Upper body',
  'dag 2 – bein og skuldre':'Day 2 – Legs and shoulders',
  'dag 3 – bryst og armer':'Day 3 – Chest and arms',
  'dag 4 – knebøy og bak':'Day 4 – Squats and posterior'
};
function englishify(db){
  const woName=n=>{
    const t=String(n||'').trim();
    return WORKOUT_EN[t.toLowerCase()] || t.replace(/^Dag(\s+\d+)/i,'Day$1');
  };
  const fixEx=e=>{
    e.name=toEn(e.name); e.note=toEn(e.note); e.target=toEn(e.target);
    return e;
  };
  (db.workouts||[]).forEach(w=>{ w.name=woName(w.name); (w.exercises||[]).forEach(fixEx); });
  (db.sessions||[]).forEach(s=>{ s.workoutName=woName(s.workoutName); (s.exercises||[]).forEach(fixEx); });
  if(db.draft){ db.draft.workoutName=woName(db.draft.workoutName); (db.draft.exercises||[]).forEach(fixEx); }
  db.v=3;
  return db;
}

/* ============================================================
   Boot
   ============================================================ */
/* A debounced save can still be pending when the app is swiped away,
   so force it out whenever the page is hidden or unloaded. */
['pagehide','beforeunload','blur'].forEach(ev=>
  window.addEventListener(ev, ()=>{ if(DB){ clearTimeout(Store._t); Store.flush(DB); } }));
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && DB){ clearTimeout(Store._t); Store.flush(DB); }
});

(async function(){
  DB = await Store.load();
  if(!DB || !Array.isArray(DB.workouts)) { DB = seed(); Store.flush(DB); }
  DB.settings = Object.assign({unit:'kg',defaultSets:3}, DB.settings||{});
  DB.schedule = DB.schedule||{}; DB.sessions = DB.sessions||[];
  if((DB.v||1) < 3){ englishify(DB); Store.flush(DB); }
  ensureFood();
  foodDate=todayKey();
  mode = DB.settings.appMode==='food' ? 'food' : 'trening';
  if(mode==='food') view='foodlog';
  applyLang(); applyTheme(); render();
})();
</script>
