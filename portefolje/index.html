function viewFollow(C){
  const supported='Notification' in window, perm=supported?Notification.permission:'off';
  const banner = perm==='granted' ? '' : `<div class="card" style="border-color:var(--acc)"><b>Varsler på telefonen</b>
      <p class="tiny muted" style="margin:4px 0 8px">${perm==='denied'?'Varsler er blokkert for denne siden. Slå dem på igjen under nettleserens innstillinger for siden.':supported?'Få et varsel når en grense nås – også når appen ligger i bakgrunnen. Når appen er helt lukket, kan den ikke varsle, men grensene sjekkes neste gang du åpner den.':'Denne nettleseren støtter ikke varsler. Grensene vises i appen uansett.'}</p>
      ${perm==='default'?'<button class="btn sm" data-act="wnotify">Slå på varsler</button>':''}</div>`;
  if(!DB.secs.length) return banner+`<div class="empty"><h3>Ingen aksjer lagt til ennå</h3>
      <p>Legg til aksjer du vil følge med på, også slike du ikke eier, og sett grenser for varsling.</p>
      <button class="btn solid" data-act="watchadd">Følg en aksje</button></div>`;
  const held=C.pos;
  const sortK=DB.settings.followSort||'alerts';
  const SORTS=[['alerts','Grenser først'],['name','Navn'],['change','Endring'],['price','Kurs']];
  const chips=`<div class="nchips" style="margin:0 0 12px">${SORTS.map(([k,l])=>`<button data-act="followsort" data-k="${k}" aria-pressed="${k===sortK}">${l}</button>`).join('')}</div>`;
  const byName=(a,b)=>a.name.localeCompare(b.name,'nb');
  const cmp={ name:byName,
    change:(a,b)=>{ const da=watchDayPct(a), db=watchDayPct(b); if(da==null&&db==null) return byName(a,b); if(da==null) return 1; if(db==null) return -1; return db-da; },
    price:(a,b)=>{ const pa=num(a.price), pb=num(b.price); if(!(pa>0)&&!(pb>0)) return byName(a,b); if(!(pa>0)) return 1; if(!(pb>0)) return -1; return pb-pa; } };
  const rowFor=s=>{ const d=watchDayPct(s), hit=(s.alerts||[]).filter(r=>r.hit&&!r.off), px=num(s.price);
    return `<button class="item watchrow${hit.length?' hitrow':''}" data-act="watchedit" data-id="${esc(s.id)}">
      <div class="b"><b>${esc(s.name)}${hit.length?' <span class="tag new">⚠ utløst</span>':''}${held[s.id]?' <span class="tag" style="background:var(--acc-soft,#e6f4ef);color:var(--acc)">eier</span>':''}</b>
        <span>${px>0?`${nf(px,px<10?2:2)} ${esc(s.cur||'')}`:(s.ticker?'henter kurs…':'mangler ticker')}${d!=null?` · <span class="${d>=0?'up':'down'}">${pct(d)}</span> i dag`:''}${s.ticker?` · ${esc(s.ticker)}`:''}</span>
        ${alertSummary(s)}</div>
      <span class="chev">›</span></button>`; };
  let body;
  if(sortK==='alerts'){
    const withA=DB.secs.filter(s=>s.alerts&&s.alerts.length).slice().sort(byName), rest=DB.secs.filter(s=>!(s.alerts&&s.alerts.length)).slice().sort(byName);
    const sec1=withA.length?`<div class="sub" style="margin:2px 0 6px">Med grenser</div>${withA.map(rowFor).join('')}`:'';
    const sec2=rest.length?`<div class="sub" style="margin:${withA.length?'14px':'2px'} 0 6px">${withA.length?'Uten grenser':'Dine aksjer og fond'}</div>${rest.map(rowFor).join('')}`:'';
    body=sec1+sec2;
  } else { body=DB.secs.slice().sort(cmp[sortK]).map(rowFor).join(''); }
  return banner+chips+body+`<button class="btn ghost full" style="margin-top:12px" data-act="watchadd">+ Følg en ny aksje</button>`;
}
function addFollowSec(o){ const s={id:uid(),name:o.name,ticker:o.ticker||'',cur:o.cur||'NOK',kind:o.kind||'aksje',sector:'',price:'',alerts:[]}; DB.secs.push(s); save(); render();
  if(typeof canFetch==='function'&&canFetch()&&s.ticker){ refreshSec(s).then(()=>{ save(); render(); }); } return s.id; }
function addFollowSheet(){
  const sh=openSheet(`<h3>Følg en ny aksje</h3><p class="sub">Aksjer du allerede har lagt inn ligger i listen. Her legger du til en ny – også en du ikke eier.</p>
    <div class="two"><div class="f"><label for="wname">Navn</label><input id="wname" placeholder="f.eks. Equinor"></div>
      <div class="f"><label for="wtick">Ticker</label><input id="wtick" placeholder="EQNR" autocapitalize="characters"></div></div>
    <div class="f"><label for="wcur">Valuta</label><select id="wcur"><option>NOK</option><option>USD</option><option>SEK</option><option>DKK</option><option>EUR</option><option>GBP</option></select></div>
    <p class="hint">Ticker som på Oslo Børs (EQNR), eller med børskode for utenlandske (AAPL, VOLV-B.ST). Brukes til å hente kursen fra Yahoo.</p>
    <button class="btn solid full" id="wadd">Legg til og sett grenser</button>`);
  sh.querySelector('#wadd').onclick=()=>{ const name=(sh.querySelector('#wname').value||'').trim(); const ticker=(sh.querySelector('#wtick').value||'').trim().toUpperCase(); const cur=sh.querySelector('#wcur').value;
    if(!name){ toast('Skriv inn et navn'); return; }
    const dupe=DB.secs.find(x=>x.ticker&&ticker&&x.ticker.toUpperCase()===ticker); if(dupe){ closeSheet(); alertSheet(dupe.id); toast('Du følger den allerede'); return; }
    const id=addFollowSec({name,ticker,cur}); closeSheet(); alertSheet(id); };
}
function alertSheet(id){
  const s=sec(id); if(!s) return; if(!s.alerts) s.alerts=[];
  const owned=compute().pos[id], hasTx=DB.tx.some(t=>t.secId===id);
  const rulesHtml=()=> (s.alerts.length) ? s.alerts.map((r,i)=>`<div class="wrule" data-i="${i}">
      <select class="wrtype">${RTYPES.map(([k,l])=>`<option value="${k}"${k===r.type?' selected':''}>${l}</option>`).join('')}</select>
      <input class="wrval" type="number" inputmode="decimal" value="${esc(r.value)}" step="${r.type==='pctup'||r.type==='pctdn'?1:(r.value<10?0.5:1)}">
      <button type="button" class="wrdel" aria-label="Fjern grense">✕</button></div>`).join('') : '<p class="tiny muted" style="margin:0 0 8px">Ingen grenser ennå. Legg til en under – du kan ha flere.</p>';
  const d=watchDayPct(s), px=num(s.price);
  const sh=openSheet(`<h3>${esc(s.name)}</h3>
    <p class="sub">${px>0?`${nf(px,2)} ${esc(s.cur||'')}${d!=null?` · ${pct(d)} i dag`:''}`:(s.ticker?'Henter kurs…':'Legg inn ticker under Meny → Aksjer og fond for å hente kurs')}${s.ticker?` · ${esc(s.ticker)}`:''}</p>
    <div class="sub" style="margin:6px 0 6px">Grenser for varsling</div>
    <div id="wrules">${rulesHtml()}</div>
    <button type="button" class="btn ghost full" id="wraddr">+ Legg til grense</button>
    <button class="btn solid full" id="wssave" style="margin-top:12px">Lagre</button>
    ${hasTx||owned?`<button type="button" class="btn full" id="wsclear" style="margin-top:8px">Fjern alle grenser</button>`:`<button type="button" class="btn danger full" id="wsdel" style="margin-top:8px">Fjern aksjen fra listen</button>`}`);
  const readRules=()=>{ const out=[]; sh.querySelectorAll('.wrule').forEach(row=>{ const type=row.querySelector('.wrtype').value; const v=num(row.querySelector('.wrval').value); if(isFinite(v)) out.push({type,value:Math.abs(v)}); }); return out; };
  function paint(cur){ s.alerts=cur.map(r=>({type:r.type,value:r.value})); sh.querySelector('#wrules').innerHTML=rulesHtml(); wire(); }
  function wire(){ sh.querySelectorAll('.wrdel').forEach(b=>b.onclick=()=>{ const i=+b.closest('.wrule').dataset.i; const cur=readRules(); cur.splice(i,1); paint(cur); }); }
  wire();
  sh.querySelector('#wraddr').onclick=()=>{ const cur=readRules(); cur.push({type:'above',value:px>0?Math.round(px):0}); paint(cur); };
  sh.querySelector('#wssave').onclick=()=>{ s.alerts=readRules().map(r=>({id:uid(),type:r.type,value:r.value})); save(); closeSheet(); render(); toast('Lagret');
    if(typeof canFetch==='function'&&canFetch()&&s.ticker&&!(num(s.price)>0)){ refreshSec(s).then(()=>{ save(); checkWatchAlerts(); render(); }); } else checkWatchAlerts(); };
  const clr=sh.querySelector('#wsclear'); if(clr) clr.onclick=()=>{ s.alerts=[]; save(); closeSheet(); render(); toast('Grenser fjernet'); };
  const del=sh.querySelector('#wsdel'); if(del) del.onclick=()=>{ if(!confirmBox('Fjerne '+s.name+' fra listen?')) return; DB.secs=DB.secs.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('Fjernet'); };
}

document.addEventListener('click',e=>{
  if(e.target.closest('.sheet')&&!e.target.closest('.sheet [data-act=opentx],.sheet [data-act=opensec]')) return;
  const tb=e.target.closest('[data-tab]'); if(tb&&!e.target.closest('.sheet')){ view=tb.dataset.tab; render(); scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='theme'){ DB.settings.theme=DB.settings.theme==='dark'?'light':'dark'; save(); applyTheme(); render(); }
  else if(a==='menu') menuSheet();
  else if(a==='newtx') txSheet(null,{type:'buy'});
  else if(a==='examples') addExamples();
  else if(a==='import') importSheet();
  else if(a==='accounts') accountsSheet();
  else if(a==='mark'){ const m=DB.settings.marks=Object.assign({buy:true,sell:true,div:false},DB.settings.marks||{}); m[b.dataset.k]=!m[b.dataset.k]; save(); render(); }
  else if(a==='filltick') fillTickers();
  else if(a==='opentx') txSheet(b.dataset.id);
  else if(a==='opensec') secSheet(b.dataset.id);
  else if(a==='txf'){ txFilter=b.dataset.k; render(); }
  else if(a==='refresh') refreshAll();
  else if(a==='scope'){ DB.settings.scope=b.dataset.k; save(); render(); }
  else if(a==='dcmode'){ dcMode=b.dataset.k; render(); }
  else if(a==='dcest'){ DB.settings.dcEst=!DB.settings.dcEst; save(); render(); }
  else if(a==='range'){ chartRange=b.dataset.k; render(); }
  else if(a==='calunit'){ DB.settings.calPct=b.dataset.k==='pct'; save(); render(); }
  else if(a==='calm'){ calM.m+=+b.dataset.d; if(calM.m<0){calM.m=11;calM.y--;} if(calM.m>11){calM.m=0;calM.y++;} render(); }
  else if(a==='calday') calDaySheet(b.dataset.k);
  else if(a==='ai') runAi();
  else if(a==='adddiv'){ const p=pendingDivs(compute())[+b.dataset.i]; if(p) addPending([p]); }
  else if(a==='addalldiv') addPending(pendingDivs(compute()));
  else if(a==='gohome'){ view='home'; render(); scrollTo(0,0); }
  else if(a==='watchadd') addFollowSheet();
  else if(a==='watchedit') alertSheet(b.dataset.id);
  else if(a==='wnotify') ensureNotify();
  else if(a==='gowatch'){ view='watch'; watchTab='list'; render(); scrollTo(0,0); }
  else if(a==='followtab'){ watchTab=b.dataset.k; render(); scrollTo(0,0); }
  else if(a==='followsort'){ DB.settings.followSort=b.dataset.k; save(); render(); }
  else if(a==='dismissall'){ pendingDivs(compute()).forEach(p=>{ (DB.dismissed[p.secId]=DB.dismissed[p.secId]||[]).push(p.exDate+'|'+p.accId); }); save(); render(); toast('Ignorert'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
applyTheme(); render();
try{ if('serviceWorker' in navigator && location.protocol==='https:' && 'Notification' in window && Notification.permission==='granted') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
setTimeout(()=>autoRefresh(),400);
</script>
