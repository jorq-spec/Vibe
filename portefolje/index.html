<title>Portefølje</title>
<style>
/* Money app: calm paper, one green for gains, one rust for losses. Numbers are
   tabular so columns of kroner line up. */
:root{
  --bg:#F3F5F2; --card:#FFFFFF; --card2:#EBEFEA; --ink:#14201C; --muted:#56635D; --faint:#86918B;
  --line:#D6DDD7; --soft:#E6EBE6; --acc:#14705A; --acc-soft:#D3EBE2; --on-acc:#FFFFFF;
  --up:#16774F; --down:#B4472F; --warn:#9A6B05;
  --c1:#14705A; --c2:#3F7FBF; --c3:#C98A12; --c4:#8B5CB8; --c5:#C0563E; --c6:#4E9A6B; --c7:#5E6C7A; --c8:#B8628C;
  color-scheme:light;
}
html.dark{
  --bg:#0F1614; --card:#18211E; --card2:#1F2A26; --ink:#E7EEEA; --muted:#9AA8A1; --faint:#6E7C75;
  --line:#2A3631; --soft:#222D29; --acc:#57C9A0; --acc-soft:#173A30; --on-acc:#082019;
  --up:#5BD49A; --down:#EE8466; --warn:#F2BE55;
  --c1:#57C9A0; --c2:#78AEE6; --c3:#F2BE55; --c4:#B794E6; --c5:#EE8466; --c6:#8CD3A4; --c7:#9AA8B5; --c8:#E59BC0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + max(env(safe-area-inset-bottom),4px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.muted{color:var(--muted)} .tiny{font-size:13px}

.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.top h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.ib{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:14px 16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);
  border-top:1px solid var(--line);padding:6px 6px calc(8px + max(env(safe-area-inset-bottom),4px));transform:translateZ(0)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;font-weight:600;color:var(--faint);position:relative}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(84px + max(env(safe-area-inset-bottom),4px));z-index:35;display:flex;align-items:center;gap:7px;
  padding:13px 18px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:15px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.fab[hidden]{display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero{padding:18px 16px}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:600}
.hero .big{font-size:34px;font-weight:750;letter-spacing:-.03em;margin:2px 0 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv div{background:var(--card2);border-radius:11px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{display:block;font-size:17px;font-weight:700;margin-top:2px}
h2.sec{font-size:13.5px;font-weight:700;color:var(--muted);margin:22px 2px 8px;letter-spacing:.01em}
.row{display:flex;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.btn.solid{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--down)}
.btn.ghost{border-style:dashed;background:none}
.btn[disabled]{opacity:.5}

<script>
/* ============================================================
   Data
   ============================================================ */
/* Demo mode keeps its own made-up portfolio under a separate key, so your real data is never touched */
let DEMO=false; try{ DEMO=localStorage.getItem('portefolje_mode')==='demo'; }catch(e){}
const KEY=DEMO?'portefolje_demo':'portefolje_v1';
function demoDB(){
  let seed=20261108; const rnd=()=>{ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; };
  const p2=n=>String(n).padStart(2,'0'), Y=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  const now=new Date(); now.setHours(12,0,0,0);
  const start=new Date(now); start.setFullYear(start.getFullYear()-3);
  /* a seeded random walk on weekdays: same "history" every time demo mode is opened */
  const walk=(p0,drift,vol)=>{ const h={}; let p=p0; for(let d=new Date(start); d<=now; d.setDate(d.getDate()+1)){
      if(d.getDay()===0||d.getDay()===6) continue; p*=1+drift+vol*(rnd()+rnd()+rnd()-1.5); h[Y(d)]=Math.round(p*100)/100; } return h; };
  const id=x=>'demo_'+x, ago=(m,dd=0)=>{ const d=new Date(now); d.setMonth(d.getMonth()-m); d.setDate(d.getDate()-dd); while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1); return Y(d); };
  const S=[
    {id:id('nve'),name:'Nordvik Energi ASA',ticker:'',cur:'NOK',sector:'Energi',hist:walk(180,.00035,.017)},
    {id:id('hav'),name:'Havbruk Norge ASA',ticker:'',cur:'NOK',sector:'Sjømat',hist:walk(64,.0002,.021)},
    {id:id('glb'),name:'Global Indeks (demo)',ticker:'',cur:'NOK',kind:'fond',sector:'Globalt',hist:walk(240,.00038,.009)}];
  S.forEach(x=>{ const k=Object.keys(x.hist).sort(), l=k[k.length-1]; x.price=x.hist[l]; x.priceAt=new Date().toISOString(); x.priceSrc='demo'; });
  const px=(s,d)=>{ const k=Object.keys(s.hist).filter(x=>x<=d).sort(); return s.hist[k[k.length-1]]; };
  const ask={id:id('ask'),name:'Aksjesparekonto',type:'ask',cash:'keep'}, fk={id:id('fk'),name:'Fondskonto',type:'ord',cash:'keep'};
  const tx=[]; let n=0; const T=o=>tx.push({id:id('t'+(++n)),created:1e12+n,fee:'',fx:'',cur:'NOK',...o});
  const buy=(s,a,m,q,dd)=>{ const d=ago(m,dd); T({type:'buy',date:d,secId:s.id,accId:a.id,qty:String(q),price:String(px(s,d)),fee:s.kind?'':'39'}); };
  T({type:'dep',date:ago(35,3),accId:ask.id,amount:'60000'}); T({type:'dep',date:ago(35,3),accId:fk.id,amount:'30000'});
  buy(S[0],ask,35,150); buy(S[1],ask,33,400); buy(S[2],fk,35,60);
  for(let m=34;m>=1;m--){ T({type:'dep',date:ago(m,-2),accId:fk.id,amount:'2000'}); buy(S[2],fk,m,+(2000/px(S[2],ago(m,-2))).toFixed(4),-2); }
  T({type:'dep',date:ago(18),accId:ask.id,amount:'15000'}); buy(S[0],ask,18,60,-1);
  { const d=ago(9); T({type:'sell',date:d,secId:S[1].id,accId:ask.id,qty:'150',price:String(px(S[1],d)),fee:'39'}); }
  buy(S[1],ask,4,120);
  /* dividends: energy twice a year, seafood once — the calendar gets announced ones too */
  const divs={}; const D=(s,m,ps,held)=>{ const ex=ago(m), pay=ago(m,-14); (divs[s.id]=divs[s.id]||[]).push({exDate:ex,payDate:pay,amount:ps,cur:'NOK'}); if(held&&pay<=Y(now)) T({type:'div',date:pay,exDate:ex,secId:s.id,accId:ask.id,qty:String(held),perShare:String(ps),tax:''}); };
  [30,24,18,12,6].forEach((m,i)=>D(S[0],m,4.5+i*.5,m>=18?150:210)); D(S[0],-1,7,0);
  [26,14,2].forEach((m,i)=>D(S[1],m,2.2+i*.4,m>9?400:m>4?250:370)); D(S[1],-6,3.4,0);
  const divCache={}; Object.entries(divs).forEach(([k,v])=>divCache[k]={at:new Date().toISOString(),src:'demo',items:v});
  return {v:1,demo:true,accounts:[ask,fk],secs:S,tx,fx:{},divCache,dismissed:{},yDateFix:1,lastRefresh:new Date().toISOString(),
    settings:{theme:'light',provider:'',apiKey:'',gemKey:'',model:''}};
}
function setDemo(on){ try{ if(on) localStorage.setItem('portefolje_mode','demo'); else localStorage.removeItem('portefolje_mode'); if(on) localStorage.removeItem('portefolje_demo'); }catch(e){} location.reload(); }
const TYPES={buy:'Kjøp',sell:'Salg',div:'Utbytte',split:'Splitt',dep:'Innskudd',wd:'Uttak'};
const isCashTx=t=>t.type==='dep'||t.type==='wd';
const CURS=['NOK','USD','EUR','SEK','DKK','GBP'];
const uid=()=>Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7);
let DB;
try{ DB=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ DB=null; }
function blank(){ return {v:1,accounts:[{id:uid(),name:'Aksjekonto',type:'ord'}],secs:[],tx:[],fx:{},divCache:{},dismissed:{},
  settings:{theme:'light',provider:'',apiKey:'',gemKey:'',model:''}}; }
if(DEMO&&(!DB||!DB.demo)){ DB=demoDB(); try{ const real=JSON.parse(localStorage.getItem('portefolje_v1')||'{}'); if(real.settings){ DB.settings.theme=real.settings.theme||'light'; DB.settings.gemKey=real.settings.gemKey||''; } }catch(e){} }
if(!DB||!Array.isArray(DB.tx)) DB=blank();
function normalize(){ const b=blank();
  for(const k of Object.keys(b)) if(DB[k]==null) DB[k]=b[k];
  DB.settings=Object.assign(b.settings,DB.settings||{});
  if(!DB.accounts.length) DB.accounts=b.accounts;
  /* older versions kept a separate watchlist – fold its limits onto the securities */
  if(Array.isArray(DB.watch)&&DB.watch.length){
    for(const w of DB.watch){ let s2=w.secId&&sec(w.secId);
      if(!s2&&w.ticker) s2=DB.secs.find(x=>x.ticker&&x.ticker.toUpperCase()===String(w.ticker).toUpperCase());
      if(!s2&&w.name) s2=DB.secs.find(x=>x.name===w.name);
      const rules=(w.rules||[]).map(r=>({id:uid(),type:r.type,value:r.value,off:!!r.off}));
      if(s2) s2.alerts=(s2.alerts||[]).concat(rules);
      else DB.secs.push({id:uid(),name:w.name,ticker:w.ticker||'',cur:w.cur||'NOK',kind:w.kind||'aksje',sector:'',price:w.price||'',priceAt:w.priceAt||'',hist:w.hist||{},ySym:w.ySym||'',alerts:rules}); }
  }
  delete DB.watch; }
normalize();
let saveT; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('Fikk ikke lagret: lagringen er full'); } },150); }
addEventListener('pagehide',()=>{ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} });

/* ============================================================
   Helpers
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
function toast(m){ const o=$('.toast'); if(o) o.remove(); const t=el(`<div class="toast">${esc(m)}</div>`); document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseYmd=s=>{ const [a,b,c]=String(s).split('-').map(Number); return new Date(a,b-1,c); };
const addDays=(k,n)=>{ const d=parseYmd(k); d.setDate(d.getDate()+n); return ymd(d); };
const isoToDMY=v=>{ const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?`${m[3]}.${m[2]}.${m[1]}`:''; };
function dmyToIso(str){
  const s=String(str||'').trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})[./ -](\d{1,2})[./ -](\d{2,4})$/)||s.match(/^(\d{2})(\d{2})(\d{4})$/); if(!m) return null;
  let d=+m[1],mo=+m[2],y=+m[3]; if(y<100) y+=2000;
  const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCDate()!==d||dt.getUTCMonth()!==mo-1) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
const num=v=>{ if(v==null||v==='') return NaN; return Number(String(v).replace(/\s/g,'').replace(',','.')); };
const nf=(n,d=0)=>(n==null||isNaN(n))?'–':Number(n).toLocaleString('nb-NO',{minimumFractionDigits:d,maximumFractionDigits:d});
const kr=(n,d=0)=>(n==null||isNaN(n))?'–':`${nf(n,d)} kr`;
const sgn=(n,d=0)=>(n==null||isNaN(n))?'–':`${n>0?'+':n<0?'−':''}${nf(Math.abs(n),d)}`;
const pct=(n,d=1)=>(n==null||!isFinite(n))?'–':`${n>0?'+':n<0?'−':''}${nf(Math.abs(n),d)} %`;
const cls=n=>n>0.005?'up':n<-0.005?'down':'';
const qf=n=>nf(n, Math.abs(n%1)>1e-9?4:0).replace(/,?0+$/,m=>m.startsWith(',')?'':m);
const MON=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const prettyDate=k=>{ if(!k) return ''; const d=parseYmd(k); return `${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const sec=id=>DB.secs.find(s=>s.id===id);
const isFund=s=>!!s&&s.kind==='fond';

const acc=id=>DB.accounts.find(a=>a.id===id);
const ICON={
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  pie:'<svg viewBox="0 0 24 24"><path d="M12 3v9h9"/><circle cx="12" cy="12" r="9"/></svg>',

  coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.6-.8-1.6-1.2-2.8-1.2-1.7 0-2.8.8-2.8 2s1.1 1.7 2.8 2 2.8.8 2.8 2-1.1 2-2.8 2c-1.2 0-2.2-.4-2.8-1.2M12 6v2M12 16v2"/></svg>',
  menu:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="18.5" r="1"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20.5 13.2A8.3 8.3 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>',

/* ============================================================
   The engine. Replays every transaction in date order, per account and
   security, keeping FIFO lots in kroner (fees included in cost, deducted
   from proceeds) — the same method Skatteetaten uses for shares.
   ============================================================ */
const ORDER={split:0,dep:0.5,buy:1,div:2,sell:3,wd:4};
/* for cash, money coming in on a day is available to that day's buys */
const CASHORDER={dep:0,sell:1,div:2,buy:3,wd:4,split:5};
const cashSort=txs=>txs.slice().sort((a,b)=>a.date.localeCompare(b.date)||(CASHORDER[a.type]-CASHORDER[b.type]));
/* A foreign-currency line without its own rate borrows today's, and is flagged. */
function txCur(t){ return t.cur||sec(t.secId)?.cur||'NOK'; }
function txFx(t){ const c=txCur(t); if(c==='NOK') return 1; const f=num(t.fx); return f>0?f:fxNow(c); }
const fxMissing=t=>txCur(t)!=='NOK'&&!(num(t.fx)>0)&&t.type!=='split';
/* What the screens show: everything, only stocks, or only funds. Holdings checks
   (can I sell this many?) always look at everything. */
const kindOf=s=>isFund(s)?'fond':'aksje';
const scope=()=>DB.settings.scope||'all';
const bothKinds=()=>DB.secs.some(isFund)&&DB.secs.some(s=>!isFund(s));
function inScope(secId){ const sc=scope(); if(!secId) return sc==='all'||!bothKinds(); if(sc==='all'||!bothKinds()) return true; const s=sec(secId); return !!s&&kindOf(s)===sc; }
function sortedTx(all){ return DB.tx.filter(t=>all||inScope(t.secId)).sort((a,b)=>a.date.localeCompare(b.date)||(ORDER[a.type]-ORDER[b.type])||(a.created||0)-(b.created||0)); }
function compute(){
  const lots={}, realized=[], divs=[], errors=[];
  const K=(a,s)=>a+'|'+s;
  for(const t of sortedTx()){
    if(isCashTx(t)) continue;
    const k=K(t.accId,t.secId); const L=lots[k]=lots[k]||[];
    if(fxMissing(t)) errors.push({tx:t, msg:`mangler valutakurs for ${txCur(t)} – trykk her og hent den`});
    if(t.type==='buy'){
      const q=num(t.qty), cost=q*num(t.price)*(txFx(t)||1)+(num(t.fee)||0);
      L.push({q, cpu:cost/q, date:t.date, txId:t.id});
    } else if(t.type==='split'){
      const r=num(t.ratio)||1; L.forEach(l=>{ l.q*=r; l.cpu/=r; });
    } else if(t.type==='sell'){
      let q=num(t.qty); const proceeds=q*num(t.price)*(txFx(t)||1)-(num(t.fee)||0);
      let cost=0; const sold=q;
      while(q>1e-9&&L.length){ const l=L[0], take=Math.min(l.q,q); cost+=take*l.cpu; l.q-=take; q-=take; if(l.q<=1e-9) L.shift(); }
      if(q>1e-4) errors.push({tx:t, msg:`Salget er ${qf(q)} aksjer større enn beholdningen`});
      realized.push({tx:t, date:t.date, secId:t.secId, accId:t.accId, qty:sold, proceeds, cost, gain:proceeds-cost});
    } else if(t.type==='div'){
      const gross=num(t.qty)*num(t.perShare)*(txFx(t)||1), tax=num(t.tax)||0;
      divs.push({tx:t, date:t.date, secId:t.secId, accId:t.accId, gross, tax, net:gross-tax});
    }
  }
  const pos={};
  for(const [k,L] of Object.entries(lots)){
    const [accId,secId]=k.split('|'); const q=L.reduce((s,l)=>s+l.q,0); if(q<1e-4) continue;
    const cost=L.reduce((s,l)=>s+l.q*l.cpu,0);
    const p=pos[secId]=pos[secId]||{secId,qty:0,cost:0,byAcc:{},lots:[]};
    p.qty+=q; p.cost+=cost; p.byAcc[accId]=(p.byAcc[accId]||0)+q; L.forEach(l=>p.lots.push({...l,accId}));
  }
  for(const p of Object.values(pos)){
    const s=sec(p.secId), px=s&&num(s.price), fx=s?fxNow(s.cur):NaN;
    p.value=(px>0&&fx>0)?p.qty*px*fx:null; p.unreal=p.value!=null?p.value-p.cost:null; p.avg=p.cost/p.qty;
  }
  const cash=cashOn()?cashReplay(sortedTx(true)):null;
  return {pos, realized, divs, errors, cash};
}
/* Cash per account, kept in pockets: money from selling stocks sits in the
   stock pocket, from funds in the fund pocket, and plain deposits in a free
   pocket. A buy spends its own pocket first, then free money, then the other
   pocket (seen from that side, a transfer out). Only what no pocket covers is
   new money put in. Withdrawals take free money first, then from the pockets
   in proportion. "Alt" adds everything up; Aksjer/Fond see their own pocket. */
const cashOn=()=>true;
const keepsCash=accId=>(acc(accId)||{}).cash!=='out';
const KINDS=['aksje','fond'];
function newCashState(){ return {acc:{}, dep:{free:0,aksje:0,fond:0}}; }
function pockets(st,a){ return st.acc[a]=st.acc[a]||{free:0,aksje:0,fond:0}; }
function cashStep(st,t){
  const a=t.accId, P=pockets(st,a), keep=keepsCash(a), D=st.dep;
  const k=t.secId?kindOf(sec(t.secId)||{}):null;
  if(t.type==='buy'){ let c=-txAmount(t); if(!keep){ D[k]+=c; return; }
    const o=k==='aksje'?'fond':'aksje';
    let x=Math.max(0,Math.min(P[k],c)); P[k]-=x; c-=x;
    x=Math.max(0,Math.min(P.free,c)); P.free-=x; D.free-=x; D[k]+=x; c-=x;
    x=Math.max(0,Math.min(P[o],c)); P[o]-=x; D[o]-=x; D[k]+=x; c-=x;
    D[k]+=c; }
  else if(t.type==='sell'||t.type==='div'){ const p=txAmount(t); if(keep) P[k]+=p; else D[k]-=p; }
  else if(t.type==='dep'){ const v=num(t.amount)||0; P.free+=v; D.free+=v; }
  else if(t.type==='wd'){ let v=num(t.amount)||0;
    const x=Math.max(0,Math.min(P.free,v)); P.free-=x; D.free-=x; v-=x;
    const avail=Math.max(0,P.aksje)+Math.max(0,P.fond);
    if(v>0&&avail>0){ const take=Math.min(v,avail);
      KINDS.forEach(q=>{ const part=take*Math.max(0,P[q])/avail; P[q]-=part; D[q]-=part; }); v-=take; }
    if(v>0){ P.free-=v; D.free-=v; } }
}
/* what the current view sees of a cash state */
function cashView(st){
  const sc=bothKinds()?scope():'all';
  const pick=P=>sc==='all'?P.free+P.aksje+P.fond:P[sc];
  const byAcc={}; Object.entries(st.acc).forEach(([a,P])=>{ const v=pick(P); byAcc[a]=Math.abs(v)<0.005?0:v; });
  const deposited=sc==='all'?st.dep.free+st.dep.aksje+st.dep.fond:st.dep[sc];
  return {byAcc, total:Object.values(byAcc).reduce((x,y)=>x+y,0), deposited};
}
function cashReplay(txs){ const st=newCashState(); cashSort(txs).forEach(t=>cashStep(st,t)); return cashView(st); }
/* the whole account, whatever view is chosen — for the account sheet and adjustments */
function cashAll(){ const st=newCashState(); cashSort(sortedTx(true)).forEach(t=>cashStep(st,t)); const o={}; Object.entries(st.acc).forEach(([a,P])=>o[a]=P.free+P.aksje+P.fond); return o; }
/* Shares held at the close of the day before the ex-date = entitled to the dividend. */
function qtyHeld(secId, accId, beforeDate){
  let q=0;
  for(const t of sortedTx(true)){
    if(t.secId!==secId||(accId&&t.accId!==accId)||t.date>=beforeDate) continue;
    if(t.type==='buy') q+=num(t.qty); else if(t.type==='sell') q-=num(t.qty); else if(t.type==='split') q*=num(t.ratio)||1;
  }
  return Math.max(0, Math.round(q*1e6)/1e6);
}
function fxNow(cur){ if(!cur||cur==='NOK') return 1; const f=DB.fx[cur]; if(f&&f.rate>0) return f.rate;
  const H=(DB.fxHist||{})[cur]||{}; const d=Object.keys(H).sort().pop(); return d?H[d]:NaN; }

/* ============================================================
   Data sources — filled in below (prices, dividends, exchange rates)
   ============================================================ */
/* Every network call gives up after a while, so one slow answer can't freeze a refresh. */
function fetchT(url,opt={},ms=15000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{...opt,signal:c.signal}).catch(e=>{ throw e&&e.name==='AbortError'?new Error('tidsavbrudd – fikk ikke svar på '+Math.round(ms/1000)+' s'):e; }).finally(()=>clearTimeout(t));
}
/* ---------- Exchange rates: Norges Bank first, ECB (Frankfurter) as backup ---------- */
async function fxNorgesBank(cur, start, end){
  const u=`${typeof proxyBase==='function'?proxyBase('nb','https://data.norges-bank.no'):'https://data.norges-bank.no'}/api/data/EXR/B.${cur}.NOK.SP?format=sdmx-json&startPeriod=${start}&endPeriod=${end}&locale=en`;
  const r=await fetchT(u); if(!r.ok) throw new Error('Norges Bank '+r.status);
  const j=await r.json(); const root=j.data||j, st=root.structure;
  const dates=st.dimensions.observation[0].values.map(v=>v.id);
  const defs=(st.attributes&&st.attributes.series)||[];
  const out={};
  for(const s of Object.values(root.dataSets[0].series)){
    const ai=defs.findIndex(a=>a.id==='UNIT_MULT');
    const mult=ai>=0&&s.attributes&&s.attributes[ai]!=null?Number(defs[ai].values[s.attributes[ai]].id)||0:(['SEK','DKK','JPY','ISK'].includes(cur)?2:0);
    for(const [oi,ob] of Object.entries(s.observations||{})) if(ob&&ob[0]!=null) out[dates[oi]]=Number(ob[0])/Math.pow(10,mult);
  }
  return out;
}
async function fxFrankfurter(cur, start, end){
  for(const base of ['https://api.frankfurter.dev/v1','https://api.frankfurter.app']){
    try{ const r=await fetchT(`${base}/${start}..${end}?from=${cur}&to=NOK`); if(!r.ok) continue;
      const j=await r.json(); const out={}; for(const [d,v] of Object.entries(j.rates||{})) if(v&&v.NOK) out[d]=v.NOK; return out; }catch(e){}
  }
  throw new Error('ingen svar');
}
/* Rate on a date = last published rate on or before it (weekends, holidays). */
async function fxOn(cur, date){
  if(cur==='NOK') return {rate:1,date};
  DB.fxHist=DB.fxHist||{}; const H=DB.fxHist[cur]=DB.fxHist[cur]||{};
  const pick=()=>{ const ds=Object.keys(H).filter(d=>d<=date&&d>=addDays(date,-10)).sort(); const d=ds[ds.length-1]; return d?{rate:H[d],date:d}:null; };
  let hit=pick(); if(hit) return hit;
  const start=addDays(date,-10), end=date>today()?today():date;
  let got=null, err='';
  try{ got=await fxNorgesBank(cur,start,end); }catch(e){ err=e.message; }
  if(!got||!Object.keys(got).length){ try{ got=await fxFrankfurter(cur,start,end); }catch(e){ err+=(err?', ':'')+'ECB '+e.message; } }
  if(got) Object.assign(H,got);
  save(); hit=pick(); if(hit) return hit;
  throw new Error(err||'fant ingen kurs');
}
async function refreshFx(){
  const curs=[...new Set(DB.secs.map(s=>s.cur).filter(c=>c&&c!=='NOK'))];
  for(const c of curs){ try{ const r=await fxOn(c,today()); DB.fx[c]={rate:r.rate,date:r.date,src:'auto'}; }catch(e){} }
  save();
}

const GEMINI_FALLBACKS=['gemini-3.6-flash','gemini-3.5-flash-lite','gemini-3.5-flash','gemini-2.5-flash-lite','gemini-flash-latest'];
async function askGemini(prompt,opt={}){
  const model=opt.model||DB.settings.model||GEMINI_FALLBACKS[0];
  let r,j;
  try{ r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
      {method:'POST',headers:{'content-type':'application/json','x-goog-api-key':DB.settings.gemKey},
       body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.5,maxOutputTokens:8192}})});
    j=await r.json(); }catch(e){ throw new Error('Fikk ikke kontakt med Google. Sjekk nettforbindelsen.'); }
  if(!r.ok){ const msg=j?.error?.message||('HTTP '+r.status), raw=JSON.stringify(j?.error||{});
    if(/quota|RESOURCE_EXHAUSTED/i.test(msg)||r.status===429){
      if(/PerMinute|per minute/i.test(raw)) throw new Error('For mange forespørsler på kort tid. Vent et minutt og prøv igjen.');
      const tried=opt.tried||[]; const next=GEMINI_FALLBACKS.find(m=>m!==model&&!tried.includes(m));
      if(next&&tried.length<3) return askGemini(prompt,{model:next,tried:[...tried,model]});
      throw new Error('Dagskvoten for gratismodellene er brukt opp. Den nullstilles i løpet av morgenen.'); }
    if(/API key|API_KEY_INVALID|PERMISSION_DENIED/i.test(msg)) throw new Error('Nøkkelen ble avvist. Sjekk den under Meny → Datakilder.');
    if(/no longer available|not found|does not exist/i.test(msg)){ const tried=opt.tried||[]; const next=GEMINI_FALLBACKS.find(m=>m!==model&&!tried.includes(m));
      if(next&&tried.length<3) return askGemini(prompt,{model:next,tried:[...tried,model]}); }
    throw new Error(msg); }
  if((opt.tried||[]).length){ DB.settings.model=model; save(); }
  const cand=j.candidates?.[0]||{};
  let text=(cand.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('\n').trim();
  if(cand.finishReason==='MAX_TOKENS') text+='\n\n(Svaret ble avkortet. Trykk «Lag ny analyse» for å prøve igjen.)';
  if(!text) throw new Error('Tomt svar fra Gemini. Prøv igjen om litt.');
  return text;
}
function portfolioSummary(C){
  const t=totals(C), P=Object.values(C.pos).sort((a,b)=>(b.value??b.cost)-(a.value??a.cost));
  const tot=P.reduce((s,p)=>s+(p.value??p.cost),0)||1;
  const lines=P.map(p=>{ const s=sec(p.secId);
    return `- ${s.name}${s.ticker?' ('+s.ticker+')':''}: ${nf((p.value??p.cost)/tot*100,1)} % av porteføljen, sektor ${s.sector||'ukjent'}, handles i ${s.cur}${s.divCur&&s.divCur!==s.cur?', utbytte i '+s.divCur:''}, urealisert ${p.unreal!=null?pct(p.unreal/p.cost*100):'ukjent'}, utbytte siste 12 mnd ${nf(divLast12(C,p.secId))} kr, kontoer: ${Object.keys(p.byAcc).map(a=>acc(a)?.type==='ask'?'ASK':'ordinær').join('+')}`; });
  const cur=group(C,p=>sec(p.secId)?.cur).map(x=>`${x.k} ${nf(x.v/tot*100,0)} %`).join(', ');
  const sect=group(C,p=>sec(p.secId)?.sector).map(x=>`${x.k} ${nf(x.v/tot*100,0)} %`).join(', ');
  const from=addDays(today(),-365), l12=C.divs.filter(d=>d.date>=from).reduce((s,d)=>s+d.net,0);
  const nTrades=DB.tx.filter(x=>x.type==='buy'||x.type==='sell').length;
  const fees=DB.tx.reduce((s,x)=>s+(num(x.fee)||0),0);
  return `Dato: ${today()}
Markedsverdi: ${nf(t.value)} kr. Investert i nåværende beholdning: ${nf(t.cost)} kr. Urealisert: ${sgn(t.unreal)} kr. Realisert totalt: ${sgn(t.real)} kr. Utbytte totalt: ${nf(t.div)} kr, siste 12 mnd ${nf(l12)} kr.
Antall handler: ${nTrades}. Kurtasje totalt: ${nf(fees)} kr.
Valuta (eksponering etter handelsvaluta): ${cur}
Sektor: ${sect}
Beholdning:
${lines.join('\n')}`;
}

/* One range call per currency gives the charts a daily rate back to the first trade. */
async function ensureFxRange(cur, start){
  if(cur==='NOK') return;
  DB.fxHist=DB.fxHist||{}; const H=DB.fxHist[cur]=DB.fxHist[cur]||{};
  DB.fxSpan=DB.fxSpan||{}; const sp=DB.fxSpan[cur];
  if(sp&&sp.from<=start&&sp.to>=addDays(today(),-1)) return;
  const from=sp&&sp.from<=start?addDays(sp.to,-3):addDays(start,-10);
  let got=null;
  try{ got=await fxNorgesBank(cur,from,today()); }catch(e){}
  if(!got||!Object.keys(got).length){ try{ got=await fxFrankfurter(cur,from,today()); }catch(e){} }
  if(got&&Object.keys(got).length){ Object.assign(H,got); DB.fxSpan[cur]={from:sp&&sp.from<from?sp.from:from,to:today()}; save(); }
}

/* ---------- Pending dividends: what the data source says was paid while you held shares ---------- */
function pendingDivs(C){
  const out=[];
  for(const s of DB.secs){
    if(!inScope(s.id)) continue;
    const list=(DB.divCache[s.id]||{}).items||[];
    for(const d of list){
      if(!d.exDate||!(d.amount>0)) continue;
      const pay=d.payDate||d.exDate; if(pay>today()) continue;          // not paid yet
      for(const a of DB.accounts){
        const q=qtyHeld(s.id,a.id,d.exDate); if(q<=0) continue;
        const near=(x,y)=>x&&y&&Math.abs(parseYmd(x)-parseYmd(y))<=3*864e5;   // old Yahoo dates could be a day off
        if((DB.dismissed[s.id]||[]).some(k=>k.split('|')[1]===a.id&&near(k.split('|')[0],d.exDate))) continue;
        const have=DB.tx.some(t=>t.type==='div'&&t.secId===s.id&&t.accId===a.id&&(near(t.exDate,d.exDate)||Math.abs(parseYmd(t.date)-parseYmd(pay))<12*864e5));
        if(have) continue;
        out.push({secId:s.id, accId:a.id, exDate:d.exDate, payDate:pay, amount:d.amount, cur:d.cur||s.divCur||s.cur, qty:q});
      }
    }
  }
  return out.sort((a,b)=>b.payDate.localeCompare(a.payDate));
}
async function addPending(list){
  if(!list.length) return;
  toast('Henter valutakurser…');
  let n=0, miss=0;
  for(const p of list){
    let fx='';
    if(p.cur!=='NOK'){ try{ fx=String((await fxOn(p.cur,p.payDate)).rate); }catch(e){ miss++; } }
    DB.tx.push({id:uid(),created:Date.now()+n,type:'div',date:p.payDate,exDate:p.exDate,secId:p.secId,accId:p.accId,qty:String(p.qty),
      perShare:String(p.amount),cur:p.cur,fx,tax:'',auto:true,note:'Hentet automatisk'});
    n++;
  }
  save(); render(); toast(miss?`${n} lagt til – ${miss} mangler valutakurs, trykk på dem og fyll inn`:`${n} ${n===1?'utbytte':'utbytter'} lagt til`);
}

/* ============================================================
   Watchlist: follow stocks (owned or not) and get an alert when a limit is hit.
   Prices come from Yahoo through the same proxy; funds use the ordinary quote path.
   ============================================================ */
function watchDayPct(w){
  const px=w?num(w.price):NaN; if(!(px>0)) return null;
  let pc=num(w.prevClose)>0?num(w.prevClose):0;
  if(!pc){ const ks=Object.keys(w.hist||{}).sort().filter(d=>d<today()); if(ks.length) pc=w.hist[ks[ks.length-1]]; }
  return pc>0?(px/pc-1)*100:null;
}
function ruleText(r){
  return r.type==='above'?`over ${nf(r.value,r.value<10?2:0)}`
       :r.type==='below'?`under ${nf(r.value,r.value<10?2:0)}`
       :r.type==='pctup'?`opp ${nf(r.value,r.value%1?1:0)} %`
       :`ned ${nf(r.value,r.value%1?1:0)} %`;
}
function ruleTriggered(w,r){
  const p=num(w.price); if(!(p>0)) return false;
  if(r.type==='above') return p>=r.value;
  if(r.type==='below') return p<=r.value;
  const d=watchDayPct(w); if(d==null) return false;
  if(r.type==='pctup') return d>=r.value;
  if(r.type==='pctdn') return d<=-r.value;
  return false;
}
function secAlerts(){ return DB.secs.filter(s=>s.alerts&&s.alerts.length); }
function watchAlertCount(){ return secAlerts().reduce((n,s)=>n+s.alerts.filter(r=>r.hit&&!r.off).length,0); }
function checkWatchAlerts(){
  const list=secAlerts(); if(!list.length) return;
  const fresh=[];
  for(const w of list){ for(const r of w.alerts){
    if(r.off){ if(r.hit) r.hit=null; continue; }
    const on=ruleTriggered(w,r);
    if(on&&!r.hit){ r.hit=new Date().toISOString(); fresh.push({w,r}); }
    else if(!on&&r.hit){ r.hit=null; }   /* re-arm when the price moves back */
  }}
  if(fresh.length){ save();
    const lines=fresh.map(({w,r})=>`${w.name}: ${ruleText(r)} (${nf(num(w.price),num(w.price)<10?2:2)} ${w.cur||''})`.trim());
    notify(fresh.length===1?'Kursvarsel':`${fresh.length} kursvarsler`, lines.join('\n'));

/* ============================================================
   Daily value series — the basis for the neon charts and the calendar.
   Replays the transactions day by day; prices carry forward from the last
   known close (or the last trade price when there's no history yet).
   ============================================================ */
let _series=null, _seriesKey='';
function lastOn(map, keys, d){ // keys sorted asc; last value with key<=d
  let lo=0, hi=keys.length-1, ans=-1;
  while(lo<=hi){ const m=(lo+hi)>>1; if(keys[m]<=d){ ans=m; lo=m+1; } else hi=m-1; }
  return ans>=0?map[keys[ans]]:undefined;
}
function dailySeries(){
  const key=JSON.stringify([scope(), DB.accounts.map(a=>a.cash||'').join(), DB.tx.map(t=>t.amount||'').join(), DB.tx.length, DB.tx.map(t=>t.id+t.date+t.qty+t.price+t.fx+t.ratio).join('').length, DB.secs.map(s=>(s.price||'')+Object.keys(s.hist||{}).length).join(','), Object.values(DB.fxHist||{}).map(h=>Object.keys(h).length).join(',')]);
  if(_series&&_seriesKey===key) return _series;
  const tx=sortedTx(true); if(!tx.some(t=>inScope(t.secId))) return (_series={days:[],hasHist:false});
  const start=(tx.find(t=>inScope(t.secId))||tx[0]).date, end=today();
  const hk={}; DB.secs.forEach(s=>{ hk[s.id]=Object.keys(s.hist||{}).sort(); });
  const fxk={}; Object.entries(DB.fxHist||{}).forEach(([c,h])=>{ fxk[c]=Object.keys(h).sort(); });
  const hasHist=DB.secs.some(s=>hk[s.id].length>1);
  const qty={}, lastTradePx={};
  let i0=0; const withCash=true; const cst=newCashState();
  /* cash comes from every transaction (a fund buy can spend stock money), so replay
     whatever happened before the view's first day as well */
  while(i0<tx.length&&tx[i0].date<start) i0++;
  cashSort(tx.slice(0,i0)).forEach(t=>cashStep(cst,t));
  let i=i0, invested=0, prev=null; const days=[];
  for(let d=start; d<=end; d=addDays(d,1)){
    let flow=0, div=0; const events=[];
    const today_=[]; while(i<tx.length&&tx[i].date===d) today_.push(tx[i++]);
    if(withCash) cashSort(today_).forEach(t=>cashStep(cst,t));
    for(const t of today_){ if(!inScope(t.secId)) continue; events.push(t);
      if(isCashTx(t)) continue;
      if(t.type==='buy'){ qty[t.secId]=(qty[t.secId]||0)+num(t.qty); const c=-txAmount(t); flow+=c; invested+=c; lastTradePx[t.secId]=num(t.price); }
      else if(t.type==='sell'){ qty[t.secId]=(qty[t.secId]||0)-num(t.qty); const p=txAmount(t); flow-=p; invested-=p; lastTradePx[t.secId]=num(t.price); }
      else if(t.type==='split'){ const r=num(t.ratio)||1; qty[t.secId]=(qty[t.secId]||0)*r; if(lastTradePx[t.secId]) lastTradePx[t.secId]/=r; }
      else if(t.type==='div') div+=txAmount(t);
    }
    let value=0, priced=true;
    for(const [sid,q] of Object.entries(qty)){ if(q<=1e-9) continue; const s=sec(sid); if(!s) continue;
      let px=hk[sid].length?lastOn(s.hist,hk[sid],d):undefined;
      /* no history at all: hold today's price flat, so the day it arrives isn't counted as a huge gain */
      if(px==null){ px=!hk[sid].length&&num(s.price)>0?num(s.price):lastTradePx[sid]; priced=false; }
      if(d===end&&num(s.price)>0) px=num(s.price);
      let fx=1; if(s.cur!=='NOK'){ const H=(DB.fxHist||{})[s.cur]; fx=(H&&fxk[s.cur]?lastOn(H,fxk[s.cur],d):undefined)||fxNow(s.cur)||1; }
      value+=q*(px||0)*fx; }
    let cash=0;
    if(withCash){ const V=cashView(cst); cash=V.total; value+=cash; flow=V.deposited-(prev?prev.invested:0); invested=V.deposited; }
    /* with cash tracked, dividends land in value; take them out so a day's figure is price movement */
    const gain=prev?value-prev.value-flow-(withCash?div:0):0;
    days.push({d, value, invested, flow, div, gain, events, priced, cash});
    prev=days[days.length-1];
  }
  _seriesKey=key; _series={days, hasHist};
  return _series;
}

  for(const sid of new Set([...Object.keys(qE),...Object.keys(qP)])){
    const s=sec(sid); if(!s) continue; const e=qE[sid]||0, p=qP[sid]||0; if(e<=1e-3&&p<=1e-3) continue;   // leftovers from rounding are not holdings
    const pk=pxOn(s,k), pp=pxOn(s,prevD); if(pk==null) continue;
    const vE=e*pk*fxOnD(s,k), vP=pp!=null?p*pp*fxOnD(s,prevD):0;
    const gain=vE-vP-(flow[sid]||0);
    const pct=pp?(pk*fxOnD(s,k))/(pp*fxOnD(s,prevD))-1:null;
    out.push({s, gain, pct, value:vE, px:pk, qty:e});
  }
  return out.sort((a,b)=>b.gain-a.gain);
}
const pxTxt=m=>`${nf(m.px,m.px<10?3:2)}${m.s.cur&&m.s.cur!=='NOK'?' '+m.s.cur:''}`;
const qtyTxt=q=>nf(q,Math.abs(q-Math.round(q))<1e-6?0:Math.min(4,(String(+q.toFixed(4)).split('.')[1]||'').length));
function calDaySheet(k){

/* ============================================================
   Import from a fund house's transaction export (KLP's CSV and similar:
   Fondsnavn, ISIN, Transaksjonstype, Antall andeler, Pris pr andel,
   Handelsbeløp, Handelsdato …). Units in these files are rounded to two
   decimals, so units are recomputed as amount / price to keep sells exact.
   ============================================================ */
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); f=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else f+=c; }
  row.push(f); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
const MON_EN={jan:1,feb:2,mar:3,apr:4,may:5,mai:5,jun:6,jul:7,aug:8,sep:9,oct:10,okt:10,nov:11,dec:12,des:12};
function parseAnyDate(v){
  const s=String(v||'').trim(); let m=s.match(/^(\d{1,2})[\/. -]([A-Za-zæøå]{3})[a-zæøå]*\.?[\/. -](\d{4})$/);
  if(m){ const mo=MON_EN[m[2].toLowerCase()]; if(mo) return `${m[3]}-${pad(mo)}-${pad(m[1])}`; }
  return dmyToIso(s);
}
const numNo=v=>{ const s=String(v??'').replace(/[\s ]/g,''); if(!s) return NaN; return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s); };
function fundSector(name){ const n=name.toLowerCase();
  return /fremvoksende|emerging/.test(n)?'Fremvoksende markeder':/norden|nordic/.test(n)?'Norden':/norge|norway|norsk/.test(n)?'Norge':/global|verden|world/.test(n)?'Global':/rente|obligasjon|pengemarked|kreditt/.test(n)?'Renter':'Fond'; }
const TXMAP=[[/^(kjøp|kjop|tegning|innskudd|sparing|spareavtale|månedlig sparing|buy)/i,'buy'],[/^(salg|innløsning|innlosning|uttak|sell)/i,'sell'],[/utbytte/i,'div']];

function readFundCsv(text){
  const rows=parseCsv(text); if(rows.length<2) throw new Error('Fila er tom');
  const H=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>H.findIndex(h=>names.some(n=>h===n||h.startsWith(n)));
  const c={name:col('fondsnavn','fond','verdipapir','navn'), isin:col('isin'), type:col('transaksjonstype','type'), units:col('antall andeler','antall'),
    price:col('pris pr andel','kurs','andelskurs','pris'), amount:col('handelsbeløp','beløp','belop'), date:col('handelsdato','dato'), nav:col('nav dato')};
  if(c.name<0||c.type<0||c.date<0||(c.amount<0&&c.units<0)) throw new Error('Kjente ikke igjen kolonnene. Forventet bl.a. Fondsnavn, Transaksjonstype og Handelsdato.');
  const out=[], skipped=[];
  rows.slice(1).forEach((r,i)=>{
    const typeTxt=(r[c.type]||'').trim(), kind=(TXMAP.find(([re])=>re.test(typeTxt))||[])[1];
    const date=parseAnyDate(r[c.date]), price=numNo(r[c.price]), amount=numNo(r[c.amount]), unitsRaw=numNo(r[c.units]);
    if(!kind||!date){ skipped.push(`Linje ${i+2}: «${typeTxt||'?'}» ${r[c.date]||''}`); return; }
    let units=unitsRaw;
    if(amount>0&&price>0) units=Math.round(amount/price*1e6)/1e6;      // exact, not the rounded 2-decimal figure
    if(!(units>0)||!(price>0)){ skipped.push(`Linje ${i+2}: mangler antall eller kurs`); return; }
    out.push({name:(r[c.name]||'').trim(), isin:(c.isin>=0?r[c.isin]:'').trim().toUpperCase(), kind, date, units, price, amount, nav:c.nav>=0?parseAnyDate(r[c.nav]):''});
  });
  return {rows:out, skipped};
}

function importSheet(){
  const sh=openSheet(`<h3>Importer transaksjoner</h3><p class="sub">CSV fra fondsforvalteren, f.eks. KLP: Min side → Transaksjoner → Eksporter som CSV.</p>
    <label class="btn solid full" style="margin-bottom:10px">Velg CSV-fil<input type="file" id="impf" accept=".csv,text/csv,text/plain" hidden></label>

  sh.querySelector('#impf').onchange=async e=>{

      if(r.kind==='div'){ t.qty='1'; t.perShare=String(r.amount||r.units*r.price); } else { t.qty=String(r.units); t.price=String(r.price); }

/* ============================================================
   Dividend calendar: what came in, what's announced, and what to expect.
   Expected = last year's dividends repeated, for what you own today.
   ============================================================ */
let dcMode='ahead';   // 'ahead' (next 12 months) | 'back' (last 12 months)
const DC={rec:'#39FF88', ann:'#22F5D0', est:'#FFD23F'};
function monthKey(d){ return d.slice(0,7); }
function addMonths(k,n){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
const MONL=['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];

function divEvents(C){
  const t0=today(), out=[];
  /* received */
  C.divs.forEach(d=>out.push({kind:'rec', date:d.date, secId:d.secId, amount:d.net, note:d.tx.exDate?`eks-dato ${prettyDate(d.tx.exDate)}`:''}));
  const held=C.pos;
  for(const [sid,p] of Object.entries(held)){
    const s=sec(sid); if(!s) continue;
    const items=((DB.divCache[sid]||{}).items||[]).slice().sort((a,b)=>a.exDate.localeCompare(b.exDate));
    const fx=c=>c==='NOK'?1:(fxNow(c)||1);
    /* announced: ex-date or pay date still ahead */
    const ann=items.filter(d=>(d.payDate||d.exDate)>t0);
    ann.forEach(d=>out.push({kind:'ann', date:d.payDate||d.exDate, exDate:d.exDate, secId:sid, perShare:d.amount, cur:d.cur||s.divCur||s.cur, amount:p.qty*d.amount*fx(d.cur||s.divCur||s.cur), note:`eks-dato ${prettyDate(d.exDate)}`}));
    /* expected: each dividend from the last 12 months, one year on */
    let base=items.filter(d=>d.exDate>addDays(t0,-365)&&d.exDate<=t0).map(d=>({exDate:d.exDate, payDate:d.payDate, amount:d.amount, cur:d.cur||s.divCur||s.cur}));
    if(!base.length){
      /* no data source history: use what you actually received, per share */
      base=C.divs.filter(d=>d.secId===sid&&d.date>addDays(t0,-365)).map(d=>({exDate:d.tx.exDate||addDays(d.date,-14), payDate:d.date, amount:num(d.tx.perShare), cur:txCur(d.tx)}));
    }
    base.forEach(b=>{
      const ex=addDays(b.exDate,365), pay=b.payDate?addDays(b.payDate,365):addDays(ex,14);
      if(pay<=t0) return;
      if(ann.some(a=>Math.abs(parseYmd(a.exDate)-parseYmd(ex))<50*864e5)) return;   // already announced
      out.push({kind:'est', date:pay, exDate:ex, secId:sid, perShare:b.amount, cur:b.cur, amount:p.qty*b.amount*fx(b.cur), note:`anslag ut fra ${prettyDate(b.exDate)}`});
    });
  }
  /* estimates only when asked for — confirmed dividends are the default */
  return out.filter(e=>inScope(e.secId)&&(e.kind!=='est'||DB.settings.dcEst)).sort((a,b)=>a.date.localeCompare(b.date));
}

function viewDivCal(C){
  const ev=divEvents(C), t0=today(), m0=monthKey(t0);
  const months=dcMode==='ahead'?Array.from({length:12},(_,i)=>addMonths(m0,i)):Array.from({length:12},(_,i)=>addMonths(m0,i-11)).reverse();
  const inM=k=>ev.filter(e=>monthKey(e.date)===k&&(dcMode==='ahead'?(e.kind!=='rec'||e.date>=addDays(t0,-31)):e.kind==='rec'));
  const sum=(L,k)=>L.filter(e=>!k||e.kind===k).reduce((a,e)=>a+e.amount,0);
  const all=months.flatMap(inM);
  const tot=sum(all), est=sum(all,'est'), ann=sum(all,'ann'), rec=sum(all,'rec');
  /* neon bars, stacked by kind */
  const W=360,H=120,T=10,B=20, bw=(W-16)/12;
  const order=dcMode==='ahead'?months:months.slice().reverse();
  const max=Math.max(1,...order.map(k=>sum(inM(k))));
  const bars=order.map((k,i)=>{ const L=inM(k); let y=H-B, out='';
    ['rec','ann','est'].forEach(kd=>{ const v=sum(L,kd); if(!v) return; const h=v/max*(H-T-B); y-=h;
      out+=`<rect x="${8+i*bw+bw*.18}" y="${y}" width="${bw*.64}" height="${Math.max(1.5,h)}" rx="2" fill="${DC[kd]}" ${kd==='est'?'fill-opacity=".55"':''} filter="url(#gdc)"/>`; });
    if(!L.length) out=`<rect x="${8+i*bw+bw*.3}" y="${H-B-1.5}" width="${bw*.4}" height="1.5" fill="${NEON.grid}"/>`;
    return out+`<text x="${8+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="${NEON.axis}">${MON[+k.slice(5)-1].slice(0,1).toUpperCase()}</text>`; }).join('');
  const head=`<div class="neon">
    <div class="spread"><div><div class="nlbl">${dcMode==='ahead'?'Neste 12 måneder':'Siste 12 måneder'}</div><div class="nbig num">${kr(tot)}</div></div>

/* ---------- Prices and dividends: EODHD (free key: 20 calls a day) ----------
   Prices are the latest end-of-day close. Dividends come with ex-date, pay date
   and currency, so 2020 Bulkers' USD dividends land in USD. The free plan is
   rationed, so prices refresh once a day and dividend history once a week. */
const PROVIDER_GAP_MS=250;
const PROVIDER_INFO='Aksjer hentes fra Yahoo Finance via mellomstasjonen – uten nøkkel og uten daglig grense: kurs, kurshistorikk og utbytte i ett oppslag. Fond slås opp hos Yahoo med ISIN. Det Yahoo ikke har, hentes fra EODHD. Gratis EODHD-nøkkel: registrer deg på eodhd.com og kopier «API token». Gratisnivået der gir 20 oppslag i døgnet.';
const PROVIDER_KEY_LABEL='EODHD API token';
const capDaily=()=>Math.max(1,parseInt(DB.settings.eodCap)||20);
const DAILY_CAP=20;
function dataReady(){ return !!DB.settings.apiKey; }
const canFetch=()=>dataReady()||(!!DB.settings.proxy&&!DB.proxyOld);
/* EQNR + NOK → EQNR.OL, MSFT + USD → MSFT.US. A ticker with a dot is used as written. */
function eodSymbol(s){
  const t=String(s.ticker||'').trim().toUpperCase(); if(!t) return '';
  if(s.kind==='fond') return /^[A-Z]{2}[A-Z0-9]{9}\d$/.test(t)?`${t}.EUFUND`:t;
  if(t.includes('.')) return t;
  const ex={NOK:'OL',USD:'US',SEK:'ST',DKK:'CO',EUR:'',GBP:'LSE'}[s.cur];
  return ex?`${t}.${ex}`:t;
}
function budget(){ const k=today(); DB.calls=DB.calls&&DB.calls.day===k?DB.calls:{day:k,n:0}; return capDaily()-DB.calls.n; }
/* keep the counter in an open Datakilder sheet live */
function showBudget(){ const e=document.getElementById('pbudget'); if(e) e.textContent=`${budget()} av ${capDaily()} EODHD-oppslag igjen i dag.`; }
async function eod(path, params){
  if(budget()<=0) throw new Error(`dagens ${capDaily()} EODHD-oppslag er brukt opp – prøver igjen i morgen`);
  const u=`${proxyBase('eodhd','https://eodhd.com')}/api/${path}?api_token=${encodeURIComponent(DB.settings.apiKey)}&fmt=json${params||''}`;
  let r; try{ r=await fetchT(u); }catch(e){ throw new Error(DB.settings.proxy?'fikk ikke kontakt via mellomstasjonen – sjekk adressen':'EODHD tillater ikke kall rett fra nettleseren – sett opp mellomstasjonen under'); }
  DB.calls.n++; save(); showBudget();
  const txt=await r.text();
  /* pass EODHD's own words along — they say exactly what's wrong (plan, ticker, quota) */
  const said=txt.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,140);
  const tail=said?` (EODHD: «${said}»)`:'';
  if(r.status===401) throw new Error('nøkkelen ble avvist'+tail);
  if(r.status===403) throw new Error('ikke tillatt på din plan eller for denne tickeren'+tail);
  if(r.status===402||r.status===429) throw new Error('kvoten hos EODHD er brukt opp'+tail);
  if(r.status===404) throw new Error(`fant ikke ${path.split('/').pop()}`+tail);
  if(!r.ok) throw new Error('EODHD svarte '+r.status+tail);
  try{ return JSON.parse(txt); }catch(e){ throw new Error('uventet svar'+tail); }
}
/* ---------- Yahoo Finance (through the user's worker) ---------- */
function yahooSymbol(s){
  const t=String(s.ticker||'').trim().toUpperCase(); if(!t||isFund(s)) return '';
  if(/\.US$/.test(t)) return t.slice(0,-3);
  if(t.includes('.')) return t.replace(/\.LSE$/,'.L');
  const ex={NOK:'.OL',USD:'',SEK:'.ST',DKK:'.CO',GBP:'.L'}[s.cur];
  return ex==null?'':t+ex;
}
const yahooReady=()=>!!DB.settings.proxy&&!DB.proxyOld;
/* Funds: Yahoo lists Norwegian funds under Morningstar ids (e.g. 0P00018V9L.IR).
   Look the ISIN up once in Yahoo's search and remember the answer on the fund. */
const ISIN_RE=/^[A-Z]{2}[A-Z0-9]{9}\d$/;
function fundYahoo(s){
  if(!isFund(s)) return '';
  const t=String(s.ticker||'').trim().toUpperCase();
  if(/^0P[0-9A-Z]{8}(\.[A-Z]{1,3})?$/.test(t)) return t;
  return s.ySym&&s.ySym!=='-'?s.ySym:'';
}
const yahooFor=s=>yahooSymbol(s)||fundYahoo(s);
/* worth trying Yahoo for this one? (a fund not looked up yet counts) */
const yahooMaybe=s=>yahooReady()&&(!!yahooFor(s)||(isFund(s)&&ISIN_RE.test(String(s.ticker||'').trim().toUpperCase())&&!(s.ySym==='-'&&s.yTried&&Date.now()-s.yTried<7*864e5)));
async function resolveFundYahoo(s){
  if(fundYahoo(s)) return fundYahoo(s);
  const isin=String(s.ticker||'').trim().toUpperCase(); if(!ISIN_RE.test(isin)) return '';
  if(s.ySym==='-'&&s.yTried&&Date.now()-s.yTried<7*864e5) return '';
  s.yTried=Date.now();
  try{ const r=await fetchT(`${proxyBase('yahoo','')}/v1/finance/search?q=${encodeURIComponent(isin)}&quotesCount=6&newsCount=0&listsCount=0`,{},8000);
    const j=await r.json(); const qs=(j&&j.quotes)||[];
    const hit=qs.find(q=>/MUTUALFUND|ETF/i.test(q.quoteType||'')&&/\.IR$/.test(q.symbol||''))||qs.find(q=>/MUTUALFUND|ETF/i.test(q.quoteType||''))||qs[0];
    s.ySym=hit&&hit.symbol?hit.symbol:'-'; }
  catch(e){ s.ySym='-'; s.yTried=Date.now()-6*864e5; }   // no answer: try again tomorrow, not in a week
  save(); return fundYahoo(s);
}
/* with a paid EODHD plan you can let EODHD go first; Yahoo then only fills gaps */
const eodFirst=()=>DB.settings.prefer==='eodhd'&&dataReady();
async function yahoo(s){
  const sym=yahooFor(s); if(!sym) throw new Error('ingen Yahoo-ticker');
  const first=DB.tx.filter(t=>t.secId===s.id).map(t=>t.date).sort()[0]||addDays(today(),-365);
  const hd=Object.keys(s.hist||{}).sort();
  const from=hd.length&&hd[0]<=addDays(first,3)?addDays(hd[hd.length-1],-7):addDays(first,-10);
  const p1=Math.floor(parseYmd(from)/1000), p2=Math.floor(Date.now()/1000)+86400;
  const u=`${proxyBase('yahoo','')}/v8/finance/chart/${encodeURIComponent(sym)}?period1=${p1}&period2=${p2}&interval=1d&events=div`;
  let r, txt;
  try{ r=await fetchT(u,{},25000); txt=await r.text(); }catch(e){ r=null; }
  /* a long history can be too much in one go — fall back to Yahoo's own range */
  if(!r||!r.ok){ const yrs=Math.ceil((Date.now()-parseYmd(from))/(365*864e5));
    const u2=`${proxyBase('yahoo','')}/v8/finance/chart/${encodeURIComponent(sym)}?range=${yrs<=1?'1y':yrs<=2?'2y':yrs<=5?'5y':yrs<=10?'10y':'max'}&interval=1d&events=div`;
    try{ r=await fetchT(u2,{},25000); txt=await r.text(); }catch(e){ throw new Error('fikk ikke kontakt via mellomstasjonen'); } }
  if(/^Mellomstasjonen virker/.test(txt)&&!/v2/.test(txt)){ DB.proxyOld=true; save(); throw new Error('mellomstasjonen har gammel kode'); }
  let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('Yahoo svarte '+r.status); }
  const res=j?.chart?.result?.[0];
  if(!res){ const d=j?.chart?.error?.description||('Yahoo svarte '+r.status); throw new Error(/no data|not found|delisted/i.test(d)?`Yahoo kjenner ikke ${sym}`:d); }
  const ts=res.timestamp||[], cl=res.indicators?.quote?.[0]?.close||[];
  s.hist=s.hist||{};
  /* Yahoo stamps daily bars at the exchange's local midnight (23:00 UTC the day before for Oslo),
     so dates must be read in the exchange's time zone, not UTC */
  const off=Number(res.meta?.gmtoffset)||0;
  const ymdUTC=x=>new Date((x+off)*1000).toISOString().slice(0,10);
  ts.forEach((x,i)=>{ if(cl[i]>0) s.hist[ymdUTC(x)]=Math.round(cl[i]*1e4)/1e4; });
  const divs=Object.values(res.events?.dividends||{}).map(d=>({exDate:ymdUTC(d.date),payDate:'',amount:Number(d.amount),cur:(res.meta?.currency||s.cur||'NOK').toUpperCase()})).filter(d=>d.amount>0).sort((a,b)=>a.exDate.localeCompare(b.exDate));
  /* keep what earlier, longer fetches found */
  const old=(DB.divCache[s.id]||{}).items||[], seen=new Set(divs.map(d=>d.exDate));
  DB.divCache[s.id]={at:new Date().toISOString(),src:'Yahoo',items:old.filter(d=>!seen.has(d.exDate)).concat(divs)};
  const price=Number(res.meta?.regularMarketPrice)||Number(cl.filter(Boolean).pop());
  const when=res.meta?.regularMarketTime?ymdUTC(res.meta.regularMarketTime):ymdUTC(ts[ts.length-1]);
  s.priceFetched=today(); s.priceVia='Yahoo'; s.priceTs=Date.now();
  return {price, date:when, time:res.meta?.regularMarketTime?new Date(res.meta.regularMarketTime*1000).toISOString():'', cur:(res.meta?.currency||'').toUpperCase()==='GBX'?'GBP':(res.meta?.currency||'').toUpperCase(), src:'Yahoo'};
}
async function getQuote(s){
  if(eodFirst()&&eodSymbol(s)){ try{ return await getQuoteEod(s); }catch(e){ if(!yahooMaybe(s)) throw e; s.eodErr=e.message; } }
  if(yahooReady()&&isFund(s)&&!fundYahoo(s)) await resolveFundYahoo(s);
  if(yahooReady()&&yahooFor(s)){
    if(s.priceVia==='Yahoo'&&s.priceTs&&Date.now()-s.priceTs<4*60e3&&s.price&&Object.keys(s.hist||{}).length>2) return {price:s.price,date:(s.priceAt||'').slice(0,10),time:s.priceAt,src:'Yahoo'};   // only skip a fetch made minutes ago
    try{ return await yahoo(s); }catch(e){ s.yahooErr=e.message; if(!dataReady()) throw e; }
  }
  if(!dataReady()||eodFirst()) return null;
  return getQuoteEod(s);
}
async function getQuoteEod(s){
  const sym=eodSymbol(s); if(!sym) return null;
  if(s.priceSrc==='EODHD'&&s.priceAt&&s.priceFetched===today()) return {price:s.price,date:s.priceAt.slice(0,10),src:'EODHD'};
  /* same single call as before, but reaching back to the first trade the first time,
     so the charts and calendar get a daily close history for free */
  const hd=Object.keys(s.hist||{}).sort(), first=DB.tx.filter(t=>t.secId===s.id).map(t=>t.date).sort()[0]||today();
  const from=hd.length&&hd[0]<=addDays(first,3)?addDays(hd[hd.length-1],-3):addDays(first,-5);
  const rows=await eod(`eod/${encodeURIComponent(sym)}`,`&from=${from}`);
  if(!Array.isArray(rows)||!rows.length) return null;
  s.hist=s.hist||{}; rows.forEach(r=>{ if(r.date&&Number(r.close)>0) s.hist[r.date]=Number(r.close); });
  const last=rows[rows.length-1]; s.priceFetched=today();
  return {price:Number(last.close), date:last.date, src:'EODHD'};
}
async function getDividends(s){
  const c=DB.divCache[s.id];
  if(c&&c.src==='Yahoo'&&c.at&&(Date.now()-new Date(c.at))<2*864e5&&!eodFirst()) return c.items;   // came with today's price
  if(c&&c.at&&(Date.now()-new Date(c.at))<6*864e5) return c.items;
  if(!dataReady()) return c?c.items:null;
  if(isFund(s)) return c?c.items:[];   // accumulating funds pay no dividends — save the quota for prices
  const sym=eodSymbol(s); if(!sym) return null;
  const first=DB.tx.filter(t=>t.secId===s.id).map(t=>t.date).sort()[0]||addDays(today(),-365);
  const rows=await eod(`div/${encodeURIComponent(sym)}`,`&from=${addDays(first,-5)}`);
  if(!Array.isArray(rows)) return null;
  return rows.map(d=>({exDate:d.date, payDate:d.paymentDate||'', amount:Number(d.unadjustedValue??d.value), cur:(d.currency||'').toUpperCase()}))
    .filter(d=>d.exDate&&d.amount>0);
}

const WORKER_CODE="// Mellomstasjon for Portef\u00f8lje-appen (Cloudflare Worker) \u2013 v2\n// Videresender bare til EODHD, Yahoo Finance og Norges Bank, og bare for appen din.\nconst ALLOW_ORIGIN = 'https://jorq-spec.github.io';\nconst HOSTS = {\n  eodhd: 'https://eodhd.com',\n  nb: 'https://data.norges-bank.no',\n  yahoo: 'https://query1.finance.yahoo.com',\n  yahoo2: 'https://query2.finance.yahoo.com',\n};\nconst cors = {\n  'Access-Control-Allow-Origin': ALLOW_ORIGIN,\n  'Access-Control-Allow-Methods': 'GET, OPTIONS',\n  'Access-Control-Allow-Headers': '*',\n};\nexport default {\n  async fetch(req) {\n    if (req.method === 'OPTIONS') return new Response(null, { headers: cors });\n    const origin = req.headers.get('Origin');\n    if (origin && origin !== ALLOW_ORIGIN) return new Response('Ikke tillatt', { status: 403 });\n    const url = new URL(req.url);\n    const [, svc, ...rest] = url.pathname.split('/');\n    if (!HOSTS[svc]) return new Response('Mellomstasjonen virker. v2', { status: 200, headers: cors });\n    const ua = svc.startsWith('yahoo')\n      ? 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'\n      : 'portefolje-app';\n    const r = await fetch(HOSTS[svc] + '/' + rest.join('/') + url.search, {\n      headers: { 'User-Agent': ua, 'Accept': 'application/json,text/plain,*/*' },\n      cf: { cacheTtl: 1800, cacheEverything: true },\n    });\n    const h = new Headers(r.headers);\n    for (const [k, v] of Object.entries(cors)) h.set(k, v);\n    h.delete('set-cookie');\n    return new Response(r.body, { status: r.status, headers: h });\n  },\n};\n";

function lastUpdateText(){
  if(DEMO) return 'Oppdiktede eksempeltall';
  const ts=DB.secs.map(s=>s.priceAt).filter(Boolean).sort(); const l=ts[ts.length-1];
  if(!l) return 'Kurser ikke hentet ennå';
  const d=new Date(l), loc=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const exact=!/T12:00:00$/.test(l)&&!isNaN(d);
  if(exact&&loc===today()) return `Kurser i dag kl. ${pad(d.getHours())}:${pad(d.getMinutes())}`+(typeof marketOpen==='function'&&marketOpen()?' · oppdateres løpende':'');
  return `Kurser fra ${prettyDate(l.slice(0,10))}`+(exact?` kl. ${pad(d.getHours())}:${pad(d.getMinutes())}`:'');
}
function totals(C){
  const P=Object.values(C.pos);
  const value=P.reduce((s,p)=>s+(p.value??p.cost),0), cost=P.reduce((s,p)=>s+p.cost,0);
  const unreal=P.reduce((s,p)=>s+(p.unreal||0),0), missing=P.filter(p=>p.value==null).length;
  const real=C.realized.reduce((s,r)=>s+r.gain,0), div=C.divs.reduce((s,d)=>s+d.net,0);
  const cash=C.cash?C.cash.total:0;
  return {value:value+cash,secValue:value,cash,deposited:C.cash?C.cash.deposited:null,cost,unreal,missing,real,div,total:unreal+real+div};
}
function allocHtml(items){
  const tot=items.reduce((s,x)=>s+x.v,0); if(!tot) return '';
  const col=i=>`var(--c${(i%8)+1})`;
  return `<div class="alloc">${items.map((x,i)=>`<i style="width:${x.v/tot*100}%;background:${col(i)}"></i>`).join('')}</div>
    <div class="legend">${items.map((x,i)=>`<div${x.id?` data-act="opensec" data-id="${esc(x.id)}" class="tap"`:''}><i style="background:${col(i)}"></i><span>${esc(x.k)}</span><b class="num">${nf(x.v/tot*100,1)} %</b>${x.id?'<em class="chev">›</em>':''}</div>`).join('')}</div>`;
}
function group(C, keyFn){
  const m={}; Object.values(C.pos).forEach(p=>{ const k=keyFn(p)||'Ukjent'; m[k]=(m[k]||0)+(p.value??p.cost); });
  return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
}

      </div>
    </div>
    ${valueChart()}

/* Side by side: how the stocks and the funds are doing. */
function splitCard(C){
  const part=k=>{ const P=Object.values(C.pos).filter(p=>kindOf(sec(p.secId))===k);
    const ids=new Set(DB.secs.filter(s=>kindOf(s)===k).map(s=>s.id));
    const v=P.reduce((a,p)=>a+(p.value??p.cost),0), c=P.reduce((a,p)=>a+p.cost,0), u=P.reduce((a,p)=>a+(p.unreal||0),0);
    const r=C.realized.filter(x=>ids.has(x.secId)).reduce((a,x)=>a+x.gain,0), d=C.divs.filter(x=>ids.has(x.secId)).reduce((a,x)=>a+x.net,0);
    return {v,c,u,r,d,t:u+r+d}; };
  const A=part('aksje'), F=part('fond'), tot=(A.v+F.v)||1;
  const row=(l,a,f,fmt)=>`<tr><td>${l}</td><td class="${fmt==='g'?cls(a):''}">${fmt==='g'?sgn(a):nf(a)}</td><td class="${fmt==='g'?cls(f):''}">${fmt==='g'?sgn(f):nf(f)}</td></tr>`;
  return `<div class="card"><div class="spread"><span class="tiny muted" style="font-weight:650">Aksjer og fond</span><span class="tiny muted">kr</span></div>
    <div class="alloc"><i style="width:${A.v/tot*100}%;background:var(--c1)"></i><i style="width:${F.v/tot*100}%;background:var(--c2)"></i></div>
    <table class="t"><thead><tr><th></th><th><span style="color:var(--c1)">●</span> Aksjer</th><th><span style="color:var(--c2)">●</span> Fond</th></tr></thead><tbody>
      <tr><td>Andel</td><td>${nf(A.v/tot*100,1)} %</td><td>${nf(F.v/tot*100,1)} %</td></tr>
      ${row('Markedsverdi',A.v,F.v)}${row('Urealisert',A.u,F.u,'g')}${row('Realisert',A.r,F.r,'g')}${row('Utbytte',A.d,F.d)}${row('Totalt',A.t,F.t,'g')}
      <tr><td>Avkastning</td><td class="${cls(A.u)}">${pct(A.c?A.u/A.c*100:null)}</td><td class="${cls(F.u)}">${pct(F.c?F.u/F.c*100:null)}</td></tr>
    </tbody></table><p class="note">Avkastning er urealisert gevinst målt mot det du har i dag. Trykk Aksjer eller Fond øverst for å se bare den delen.</p></div>`;
}
function aiHtml(a){
  return `<div class="tiny muted" style="margin-bottom:8px">${esc(prettyDate(a.date))}</div>${String(a.text).split(/\n{2,}/).map(p=>`<p>${esc(p.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</p>`).join('')}
    <p class="note" style="margin:0 0 10px">Laget av en AI ut fra tallene i appen. Den kjenner ikke nyheter fra i dag og kan ta feil. Ikke finansiell rådgivning.</p>`;
}
function viewHold(C){
  const P=Object.values(C.pos).sort((a,b)=>(b.value??b.cost)-(a.value??a.cost));
  const closed=DB.secs.filter(s=>!C.pos[s.id]);
  if(!P.length&&!closed.length&&!(C.cash&&C.cash.total)) return `<div class="empty"><h3>Ingenting her ennå</h3><p>Aksjene dukker opp når du legger inn et kjøp.</p></div>`;
  const row=(s,p)=>{ const d12=divLast12(C,s.id);
    return `<button class="item" data-act="opensec" data-id="${s.id}">
      <div class="b"><b>${esc(s.name)}</b><span>${isFund(s)?'<span class="tag">Fond</span> ':''}${p?`${qf(p.qty)} ${isFund(s)?'andeler':'stk'}${num(s.price)>0?` · kurs <b style="display:inline;font-size:inherit;color:var(--ink)">${nf(num(s.price),2)}</b>`:''} · snitt ${nf(p.avg,2)} kr`:'Solgt ut'}${s.ticker?' · '+esc(s.ticker):''}${s.cur!=='NOK'?' · '+s.cur:''}</span></div>
      <div class="r">${p?`<b class="num">${kr(p.value??p.cost)}</b><span class="num ${cls(p.unreal)}">${p.unreal!=null?pct(p.unreal/p.cost*100):'mangler kurs'}</span>`:`<span class="num ${cls(realOf(C,s.id))}">${sgn(realOf(C,s.id))} kr</span>`}${d12?`<span class="tiny muted num">utb. ${nf(d12)} kr/år</span>`:''}</div></button>`; };
  const closedS=closed.filter(s=>inScope(s.id));
  const noTick=DB.secs.filter(s=>!s.ticker&&!isFund(s)&&tickerGuess(s.name));
  const tickNote=noTick.length?`<div class="card" style="border-color:var(--warn)"><b>${noTick.length} ${noTick.length===1?'aksje mangler':'aksjer mangler'} ticker</b><p class="tiny muted" style="margin:4px 0 8px">Uten ticker hentes verken kurs eller utbytte. Appen kjenner igjen ${noTick.map(s=>esc(s.name)).slice(0,6).join(', ')}${noTick.length>6?' …':''}.</p><button class="btn sm solid" data-act="filltick">Fyll inn tickere</button></div>`:'';
  const cashRows=C.cash?Object.entries(C.cash.byAcc).filter(([a,v])=>Math.abs(v)>=1).map(([a,v])=>`<button class="item" data-act="accounts"><div class="b"><b>${esc(acc(a)?.name||'Konto')}</b><span>Kontanter${acc(a)?.type==='ask'?' · ASK':''}</span></div><div class="r"><b class="num ${v<0?'down':''}">${kr(v)}</b></div></button>`).join(''):'';
  const cashHtml=cashRows?`<h2 class="sec spread"><span>Kontanter</span><span class="num">${kr(C.cash.total)}</span></h2>${cashRows}`:'';
  if(scope()==='all'&&bothKinds()){
    const grp=k=>{ const L=P.filter(p=>kindOf(sec(p.secId))===k); if(!L.length) return '';
      const v=L.reduce((a,p)=>a+(p.value??p.cost),0), c=L.reduce((a,p)=>a+p.cost,0), u=L.reduce((a,p)=>a+(p.unreal||0),0);
      return `<h2 class="sec spread" style="margin-top:${k==='aksje'?'4px':'22px'}"><span>${k==='fond'?'Fond':'Aksjer'}</span><span class="num">${kr(v)} · <span class="${cls(u)}">${pct(c?u/c*100:null)}</span></span></h2>${L.map(p=>row(sec(p.secId),p)).join('')}`; };
    return tickNote+grp('aksje')+grp('fond')+cashHtml+(closedS.length?`<h2 class="sec">Tidligere eid</h2>${closedS.map(s=>row(s,null)).join('')}`:'');
  }
  return tickNote+P.map(p=>row(sec(p.secId),p)).join('')+cashHtml+(closedS.length?`<h2 class="sec">Tidligere eid</h2>${closedS.map(s=>row(s,null)).join('')}`:'');
}
const realOf=(C,id)=>C.realized.filter(r=>r.secId===id).reduce((s,r)=>s+r.gain,0);
function divLast12(C,id){ const from=addDays(today(),-365); return C.divs.filter(d=>d.secId===id&&d.date>=from).reduce((s,d)=>s+d.net,0); }
function txLine(t){
  if(isCashTx(t)){ const a=acc(t.accId);
    return `<button class="item" data-act="opentx" data-id="${t.id}"><div class="b"><b>${esc(TYPES[t.type])} · ${esc(a?.name||'Konto')}</b><span>${esc(prettyDate(t.date))}${t.note?' · '+esc(t.note):''}</span></div>
      <div class="r"><b class="num ${t.type==='dep'?'up':''}">${sgn(txAmount(t))}</b><span class="tiny muted">kr</span></div></button>`; }
  const s=sec(t.secId), a=acc(t.accId), cur=t.cur||s?.cur||'NOK';
  let what='';
  if(t.type==='buy'||t.type==='sell') what=`${qf(num(t.qty))}${isFund(s)?' andeler':''} × ${nf(num(t.price),isFund(s)?4:2).replace(/(,\d\d)0+$/,'$1')} ${cur}`;
  else if(t.type==='div') what=`${qf(num(t.qty))} × ${nf(num(t.perShare),4).replace(/,?0+$/,'')} ${cur}`;
  else what=`forhold ${t.ratio}`;
  const amt=t.type==='split'?null:txAmount(t);
  return `<button class="item" data-act="opentx" data-id="${t.id}">
    <div class="b"><b>${esc(TYPES[t.type])} · ${esc(s?.name||'?')}</b><span>${esc(prettyDate(t.date))} · ${esc(what)}${DB.accounts.length>1&&a?` · ${esc(a.name)}`:''}</span></div>
    <div class="r">${amt!=null?`<b class="num ${t.type==='buy'?'':'up'}">${sgn(amt)}</b><span class="tiny muted">kr</span>`:''}</div></button>`;
}
/* Live search: only the list below the search field is redrawn, so the
   keyboard stays up while typing. Every word must match somewhere. */
let txQuery='';
const fold=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function txAmount(t){
  return t.type==='buy'?-(num(t.qty)*num(t.price)*(txFx(t)||1)+(num(t.fee)||0))
    :t.type==='sell'?num(t.qty)*num(t.price)*(txFx(t)||1)-(num(t.fee)||0)
    :t.type==='div'?num(t.qty)*num(t.perShare)*(txFx(t)||1)-(num(t.tax)||0)
    :t.type==='dep'?(num(t.amount)||0):t.type==='wd'?-(num(t.amount)||0):0;
}
function txHay(t){
  const s=sec(t.secId)||{}, a=acc(t.accId)||{}, amt=txAmount(t);
  return fold([TYPES[t.type], s.name, s.ticker, isCashTx(t)?'kontanter innskudd uttak':'', s.sector, isFund(s)?'fond':'aksje', a.name, a.type==='ask'?'ask aksjesparekonto':'',
    t.note, t.cur||s.cur, t.date, isoToDMY(t.date), prettyDate(t.date), MON[parseYmd(t.date).getMonth()],
    t.qty, t.price, t.perShare, Math.round(Math.abs(amt)), nf(Math.abs(amt)), t.auto?'automatisk':''].join(' '));
}
function txListHtml(){
  const words=fold(txQuery).split(/\s+/).filter(Boolean);
  const list=DB.tx.filter(t=>inScope(t.secId)&&(txFilter==='all'||t.type===txFilter||(txFilter==='cash'&&isCashTx(t)))&&(!words.length||(h=>words.every(w=>h.includes(w)))(txHay(t))))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  if(!list.length) return `<p class="muted tiny" style="margin:10px 2px">${words.length?'Ingen treff.':'Ingen i denne kategorien.'}</p>`;
  let lastY='', out='';
  for(const t of list){ const y=t.date.slice(0,4); if(y!==lastY){ out+=`<h2 class="sec">${y}</h2>`; lastY=y; } out+=txLine(t); }
  const head=(words.length||txFilter!=='all')?(()=>{ const by={}; list.forEach(t=>{ by[t.type]=(by[t.type]||0)+txAmount(t); });
    const parts=[['buy','kjøpt for'],['sell','solgt for'],['div','utbytte']].filter(([k])=>by[k]).map(([k,l])=>`${l} ${kr(Math.abs(by[k]))}`);
    return `<p class="tiny muted" style="margin:2px 2px 0">${list.length} ${list.length===1?'treff':'treff'}${parts.length?' · '+parts.join(' · '):''}</p>`; })():'';
  return head+out;
}
function viewTx(){
  if(!DB.tx.length) return `<div class="empty"><h3>Ingen transaksjoner</h3><p>Trykk «Ny transaksjon» for å legge inn et kjøp.</p></div>`;
  return `<div class="f" style="margin-bottom:8px;position:relative"><input type="text" inputmode="search" id="txq" value="${esc(txQuery)}" placeholder="Søk: aksje, fond, konto, år, måned, beløp…" autocomplete="off" enterkeyhint="search" style="padding-right:40px">
      ${txQuery?'<button id="txqx" aria-label="Tøm søk" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px">×</button>':''}</div>
    <div class="chips">${[['all','Alle'],['buy','Kjøp'],['sell','Salg'],['div','Utbytte'],['split','Splitt'],['cash','Inn/ut']].map(([k,l])=>`<button class="chip" data-act="txf" data-k="${k}" aria-pressed="${txFilter===k}">${l}</button>`).join('')}</div>

document.addEventListener('input',e=>{

document.addEventListener('click',e=>{ if(e.target.id!=='txqx') return; txQuery=''; const i=$('#txq'); if(i){ i.value=''; i.focus(); } $('#txlist').innerHTML=txListHtml(); e.target.remove(); });
function viewDiv(C){

      ${pend.map((p,i)=>`<div class="item" style="cursor:default"><div class="b"><b>${esc(sec(p.secId)?.name)} <span class="tag new">Ny</span></b>

        <div class="r"><button class="btn sm" data-act="adddiv" data-i="${i}">Legg til</button></div></div>`).join('')}
      <div class="row"><button class="btn solid full" data-act="addalldiv">Legg til alle</button><button class="btn full" data-act="dismissall">Ignorer</button></div>
      <p class="note">Antall aksjer er beholdningen dagen før eks-dato. Valutakursen hentes fra Norges Bank for utbetalingsdagen. Sjekk mot sluttseddel/kontoutskrift om kildeskatt er trukket.</p>`:''}
    <div class="card" style="margin-top:${pend.length?'14px':'0'}">
      <div class="kv" style="margin-top:0">
        <div><span>Siste 12 måneder</span><b class="num">${kr(l12)}</b></div>
        <div><span>Totalt mottatt</span><b class="num">${kr(totDiv)}</b></div>

      </div>
      ${ys.length?`<div class="bars">${ys.map(y=>`<div><em>${nf(byY[y]/1000,1)}k</em><i style="height:${Math.max(3,byY[y]/max*100)}%"></i><span>${y}</span></div>`).join('')}</div>`:''}
    </div>

      ${top.length&&totDiv?`<p class="note">${esc(sec(top[0][0])?.name)} står for ${nf(top[0][1]/totDiv*100,0)} % av alt utbytte du har fått.</p>`:''}</div>`:''}

}

/* Tell the app what's actually on the account; the gap is booked as a deposit or a
   withdrawal today, so history stays intact and the total matches the bank. */
function cashAdjustSheet(accId){
  const a=acc(accId); if(!a) return; const now=cashAll()[accId]||0;
  const sh=openSheet(`<h3>Kontanter på ${esc(a.name)}</h3><p class="sub">Appen regner med ${kr(now,2)}. Skriv inn det som faktisk står på kontoen i dag, så føres forskjellen som et uttak eller innskudd.</p>
    <div class="f"><label for="cashv">Kontanter nå (kr)</label><input id="cashv" inputmode="decimal" placeholder="f.eks. 0 eller 2 350"></div>
    <p class="hint" id="cashh" style="margin:-4px 2px 12px"></p>
    <button class="btn solid full" id="cashgo">Lagre</button>`);
  const v=sh.querySelector('#cashv'), h=sh.querySelector('#cashh'); setTimeout(()=>v.focus(),120);
  v.oninput=()=>{ const x=num(v.value); h.textContent=isNaN(x)?'':Math.abs(x-now)<0.01?'Stemmer allerede.':x<now?`Føres som uttak på ${kr(now-x,2)}.`:`Føres som innskudd på ${kr(x-now,2)}.`; };
  sh.querySelector('#cashgo').onclick=()=>{ const x=num(v.value); if(isNaN(x)||x<0){ v.classList.add('bad'); return toast('Skriv inn et beløp'); }
    const diff=Math.round((x-now)*100)/100; if(Math.abs(diff)<0.01){ closeSheet(); return toast('Stemmer allerede'); }
    DB.tx.push({id:uid(),created:Date.now(),type:diff>0?'dep':'wd',date:today(),accId,amount:String(Math.abs(diff)),cur:'NOK',secId:'',note:'Justering av kontanter'});
    save(); closeSheet(); render(); toast(`Kontanter satt til ${kr(x)}`); };
}
