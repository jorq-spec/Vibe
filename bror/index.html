        const meal=t.dataset.meal, day=foodDate||todayKey();
        return confirmSheet(`Delete "${meal}"?`,'Every item logged under this meal today will be removed.','Delete',()=>{
          DB.food.entries[day]=(DB.food.entries[day]||[]).filter(e=>(e.meal||'Other')!==meal);
          save(); closeSheet(); render(); toast('Deleted');
        }, true);
      }
      if(a==='dorenamemeal'){
        const oldName=t.dataset.meal, day=foodDate||todayKey();
        const newName=(document.querySelector('#rnmeal').value||'').trim()||oldName;
        (DB.food.entries[day]||[]).forEach(e=>{ if((e.meal||'Other')===oldName) e.meal=newName; });
        save(); closeSheet(); render(); toast('Renamed'); return;
      }
      if(a==='docopymeal'){
        const meal=t.dataset.meal, day=foodDate||todayKey();
        const target=document.querySelector('#cpdate').value;
        if(!target){ toast('Pick a date first'); return; }
        const items=(DB.food.entries[day]||[]).filter(e=>(e.meal||'Other')===meal);
        if(!items.length){ toast('Nothing to copy'); return; }
        const clones=items.map(e=>({...e, id:uid()}));
        (DB.food.entries[target]=DB.food.entries[target]||[]).push(...clones);
        save(); closeSheet();
        toast(`Copied ${clones.length} item${clones.length===1?'':'s'} to ${prettyDate(target).toLowerCase()}`);
        if(target===foodDate) render();
        return;
      }

      /* ---- saved meal templates ---- */
      if(a==='openmeal') return mealDetailSheet(t.dataset.id);
      if(a==='newmeal') return newMealSheet();
      if(a==='createmeal'){
        const name=(document.querySelector('#nmname').value||'').trim();
        if(!name){ toast('Give it a name first'); return; }
        const m={id:uid(), name, items:[]};
        DB.food.meals.push(m); save();
        mealDetailSheet(m.id); return;
      }
      if(a==='addmealitem') return addMealItemSheet();
      if(a==='pickmealitem') return mealItemQtySheet(+t.dataset.i);
      if(a==='confirmmealitem'){
        const r=mealSearchResults[+t.dataset.i]; if(!r) return;
        const qv=parseFloat(document.querySelector('#miqty').value)||100;
        const m=DB.food.meals.find(x=>x.id===openMeal); if(!m) return;
        const n=scaleNut(r.per100, qv);
        m.items.push({name:r.name, brand:r.brand, source:r.source, per100:r.per100, qty:qv, unit:'g',
          kcal:n.kcal, protein:n.protein, carbs:n.carbs, fat:n.fat, fiber:n.fiber});
        save(); closeSheet(); mealDetailSheet(m.id); toast('Added to meal'); return;
      }
      if(a==='delmealitem'){
        const m=DB.food.meals.find(x=>x.id===openMeal); if(!m) return;
        m.items.splice(+t.dataset.i,1); save(); mealDetailSheet(m.id); return;
      }
      if(a==='delsavedmeal'){
        const id=t.dataset.id;
        return confirmSheet('Delete this meal?','The saved combo will be removed. Anything already logged stays as it is.','Delete',()=>{
          DB.food.meals=DB.food.meals.filter(x=>x.id!==id); openMeal=null; save(); mealsSheet(); toast('Deleted');
        }, true);
      }
      if(a==='logmeal'){
        const m=DB.food.meals.find(x=>x.id===t.dataset.id); if(!m||!m.items.length) return;
        const now3=nowTime(), meal=defaultMealFor(now3), day=foodDate||todayKey();
        const clones=m.items.map(it=>({id:uid(), time:now3, meal, name:it.name, brand:it.brand, source:it.source,
          per100:it.per100, qty:it.qty, unit:it.unit, kcal:it.kcal, protein:it.protein, carbs:it.carbs, fat:it.fat, fiber:it.fiber}));
        (DB.food.entries[day]=DB.food.entries[day]||[]).push(...clones);
        save(); closeSheet(); view='foodlog'; render();
        toast(`Added ${clones.length} item${clones.length===1?'':'s'} from ${m.name}`); return;
      }
      if(a==='export') return doExport();
      if(a==='exportjson') return doExportJson();
      if(a==='import'){ closeSheet(); return importSheet(); }
      if(a==='reset') return confirmSheet('Erase everything?','All workouts, sessions and plans on this device will be deleted. Export a backup first if you want to keep them.','Erase',()=>{
        DB=seed(); save(); closeSheet(); view='today'; render(); toast('Deleted'); }, true);

      if(a==='plan'){
        const sel=document.querySelector('#planpick'); if(!sel) return;
        const k=t.dataset.k;
        (DB.schedule[k]=DB.schedule[k]||[]).push(sel.value);
        save(); render(); daySheet(k); toast('Planned'); return;
      }
      if(a==='unplan'){
        const k=t.dataset.k;
        DB.schedule[k].splice(+t.dataset.i,1);
        if(!DB.schedule[k].length) delete DB.schedule[k];
        save(); render(); daySheet(k); return;
      }
      if(a==='startday'){
        if(DB.draft) return toast('Finish or discard the workout in progress first');
        closeSheet(); return startWorkout(t.dataset.id, t.dataset.k);
      }
      if(a==='pickone'){ closeSheet(); return startWorkout(t.dataset.id); }
      if(a==='savemeta'){
        const nm=(document.querySelector('#swname').value||'').trim();
        const dt=(document.querySelector('#swdate').value||'').trim();
        if(!nm){ document.querySelector('#swname').focus(); toast('The session needs a name'); return; }
        if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){ toast('Invalid date'); return; }
        DB.draft.workoutName=nm; DB.draft.date=dt;
        save(); closeSheet(); render(); toast('Saved'); return;
      }
      if(a==='switchto'){
        const id=t.dataset.id;
        if(id===DB.draft.workoutId){ closeSheet(); return; }
        const logged=DB.draft.exercises.reduce((n,e)=>n+(e.sets||[]).filter(setValid).length,0);
        if(!logged) return switchDraftTo(id);
        const w=DB.workouts.find(x=>x.id===id);
        return confirmSheet('Switch to '+w.name+'?',
          `${logged} logged sets are kept, and the exercises from ${w.name} are added below.`,
          'Switch', ()=>switchDraftTo(id));
      }
      if(a==='newquick'){ closeSheet(); return newQuickSheet(); }
      if(a==='createquick'){
        const nameEl=document.querySelector('#qwname');
        const name=(nameEl.value||'').trim();
        if(!name){ nameEl.focus(); toast('Give it a name first'); return; }
        const lines=(document.querySelector('#qwex').value||'').split('\n')
          .map(l=>l.trim()).filter(Boolean);
        const w={id:uid(), name, exercises:lines.map(l=>{
          const [nm,...rest]=l.split('|');
          return {id:uid(), name:nm.trim(), note:rest.join('|').trim(),
                  sets:DB.settings.defaultSets||3};
        })};
        DB.workouts.push(w); save(); closeSheet();
        startWorkout(w.id);
        toast(w.exercises.length ? 'Saved to your workouts' : 'Created — add exercises as you go');
        return;
      }
      if(a==='viewses'){ return sessionSheet(t.dataset.id); }
      if(a==='delses'){
        const id=t.dataset.id;
        return confirmSheet('Delete this session?','It disappears from your history and progress charts.','Delete',()=>{
          DB.sessions=DB.sessions.filter(s=>s.id!==id); save(); render(); toast('Deleted'); }, true);
      }
      if(a==='reopen'){
        if(DB.draft) return toast('Finish the workout in progress first');
        const s=DB.sessions.find(x=>x.id===t.dataset.id); if(!s) return;
        DB.draft=JSON.parse(JSON.stringify(s));
        DB.sessions=DB.sessions.filter(x=>x.id!==s.id);
        save(); closeSheet(); view='today'; render(); window.scrollTo(0,0); return;
      }
      if(a==='confirmaddex'){
        const inp=document.querySelector('#newexname');
        const note=document.querySelector('#newexnote');
        const nm=(inp.value||'').trim(); if(!nm){ inp.focus(); return; }
        DB.draft.exercises.push({name:nm, note:(note.value||'').trim(), unit:'reps', limbs:2,
          sets:Array.from({length:DB.settings.defaultSets||3},()=>newSet(null))});
        save(); closeSheet(); render(); return;
      }
      if(a==='renameex'){
        const i=+t.dataset.ex;
        const nm=document.querySelector('#exrename').value.trim();
        const nt=document.querySelector('#exrenote').value.trim();
        if(nm) DB.draft.exercises[i].name=nm;
        DB.draft.exercises[i].note=nt;
        save(); closeSheet(); render(); return;
      }
      if(a==='removeex'){
        const i=+t.dataset.ex;
        DB.draft.exercises.splice(i,1); save(); closeSheet(); render(); return;
      }
    });
    document.body.addEventListener('input', e=>{
      const t=e.target;
      if(t.dataset.sf){ DB.settings[t.dataset.sf]=Math.max(1,Math.min(16,parseInt(t.value)||3)); save(); return; }
    });
  }
}

function refreshLiveTotals(){
  if(!DB.draft) return;
  const st=sessionStats(DB.draft);
  const vals=document.querySelectorAll('.wrap > .card .stat .v');
  if(vals.length>=2){
    vals[0].textContent=fmtK(st.ton);
    vals[1].textContent=st.reps;
  }
  DB.draft.exercises.forEach((ex,i)=>{
    const blk=document.querySelectorAll('.exblock')[i];
    if(!blk) return;
    const s=exStats(ex);
    const box=blk.querySelector('.exstats');
    if(box) box.innerHTML = exStatsHtml(s);
  });
}


/* Tap the title during a session to rename it, move it to another day, or
   switch to a different workout entirely. Logged sets survive a switch — they
   stay put, and the new workout's exercises are added below. */
function switchWorkoutSheet(){
  const d=DB.draft; if(!d) return;
  const logged=d.exercises.reduce((n,e)=>n+(e.sets||[]).filter(setValid).length,0);
  const list=DB.workouts.map(w=>{
    const cur = w.id===d.workoutId;
    return `<button class="item" data-act="switchto" data-id="${w.id}">
      <div class="body"><b>${esc(w.name)}</b><span>${esc(w.exercises.map(e=>e.name).join(' · ')||'No exercises')}</span></div>
      ${cur?'<span class="pill on">Current</span>':`<span class="chev">${ICON.chev}</span>`}</button>`;
  }).join('');
  const c=el(`<div>
    <h3>This session</h3>
    <p class="sh-sub">Change the name or date, or switch to a different workout.</p>
    <div class="field"><label>Name</label>
      <input type="text" id="swname" value="${esc(d.workoutName)}" placeholder="Workout name"></div>
    <div class="field"><label>Date</label>
      <input type="date" id="swdate" value="${d.date}"></div>
    <button class="btn primary full" data-act="savemeta">Save changes</button>
    <div class="sectitle">Switch to a different workout</div>
    ${logged?`<p class="tiny muted" style="margin:-2px 2px 10px">${logged} sets are already logged. They stay, and the new workout's exercises are added below.</p>`:''}
    ${list}
  </div>`);
  openSheet(c);
}
function switchDraftTo(id){
  const w=DB.workouts.find(x=>x.id===id), d=DB.draft;
  if(!w||!d) return;
  const kept=d.exercises.filter(e=>(e.sets||[]).filter(setValid).length || (e.exNotes||'').trim());
  const have=new Set(kept.map(e=>e.name.toLowerCase()));
  const added=w.exercises.filter(e=>!have.has(e.name.toLowerCase())).map(e=>({
    name:e.name, note:e.note||'', target:e.target||'', kind:e.kind||'main', exNotes:'', unit:exUnit(e), limbs:Number(e.limbs)===1?1:2,
    sets:makeSets(e,e.sets||DB.settings.defaultSets||3)}));
  d.exercises=[...kept, ...added];
  d.workoutId=w.id; d.workoutName=w.name;
  save(); closeSheet(); render(); window.scrollTo(0,0);
  toast(kept.length ? `Switched to ${w.name} — kept ${kept.length} exercises` : `Switched to ${w.name}`);
}


function pickWorkoutSheet(){
  const list=DB.workouts.map(w=>`<button class="item" data-act="pickone" data-id="${w.id}">
    <div class="body"><b>${esc(w.name)}</b><span>${esc(w.exercises.map(e=>e.name).join(' · ')||'No exercises')}</span></div>
    <span class="chev">${ICON.chev}</span></button>`).join('');
  const create=`<button class="item" data-act="newquick" style="border-style:dashed;border-color:var(--line)">
    <div class="body"><b>Create a new workout</b><span>Name it, list the exercises, start straight away</span></div>
    <span class="chev">${ICON.plus}</span></button>`;
  const sub = DB.workouts.length ? 'Pick one to log right now.' : 'Nothing saved yet — build one and start.';
  openSheet(el(`<div><h3>Quick workout</h3><p class="sh-sub">${sub}</p>${list}${create}</div>`));
}

function newQuickSheet(){
  const c=el(`<div>
    <h3>New workout</h3>
    <p class="sh-sub">One exercise per line. Everything stays editable later.</p>
    <div class="field"><label>Name</label>
      <input type="text" id="qwname" placeholder="e.g. Day 5 – Arms"></div>
    <div class="field"><label>Exercises</label>
      <textarea id="qwex" rows="7" placeholder="Benk&#10;Pull ups&#10;Side raises"></textarea>
      <p class="tiny muted" style="margin:6px 2px 0">Add a rep range after a vertical bar if you want one — Benk | 8-12 reps</p></div>
    <button class="btn primary full" data-act="createquick">Create and start</button>
  </div>`);
  const sh=openSheet(c);
  setTimeout(()=>sh.querySelector('#qwname').focus(), 120);
}

function addExSheet(){
  const c=el(`<div><h3>Add exercise</h3><p class="sh-sub">Just for this session. To keep it, edit the workout.</p>
    <div class="field"><label>Name</label><input type="text" id="newexname" placeholder="e.g. Face pulls"></div>
    <div class="field"><label>Note (optional)</label><input type="text" id="newexnote" placeholder="e.g. 12-15 reps"></div>
    <button class="btn primary full" data-act="confirmaddex">Add exercise</button></div>`);
  const sh=openSheet(c); setTimeout(()=>sh.querySelector('#newexname').focus(), 120);
}
function exMenuSheet(i){
  const ex=DB.draft.exercises[i];
  const c=el(`<div><h3>${esc(ex.name)}</h3><p class="sh-sub">Rename it or take it out of this session.</p>
    <div class="field"><label>Name</label><input type="text" id="exrename" value="${esc(ex.name)}"></div>
    <div class="field"><label>Note</label><input type="text" id="exrenote" value="${esc(ex.note||'')}" placeholder="e.g. 6-10 reps"></div>
    <button class="btn primary full" data-act="renameex" data-ex="${i}">Save changes</button>
    <button class="btn danger full" data-act="removeex" data-ex="${i}" style="margin-top:10px">Remove from session</button></div>`);
  openSheet(c);
}

function finishSession(){
  const d=DB.draft;
  const st=sessionStats(d);
  if(!st.sets){ toast('Fill in at least one set first'); return; }
  confirmSheet('Save this workout?',
    `${st.sets} sets · ${fmtK(st.ton)} kg · ${st.reps} reps. It goes into your history and charts.`,
    'Save', ()=>{
      d.exercises.forEach(e=>{ e.sets=(e.sets||[]).filter(setValid); });
      d.exercises=d.exercises.filter(e=>e.sets.length || (e.exNotes||'').trim());
      DB.sessions.push(d);
      DB.sessions.sort((a,b)=>a.date.localeCompare(b.date));
      DB.draft=null; save(); view='progress'; render(); window.scrollTo(0,0); toast('Workout saved');
    });
}


/* Anything saved by an earlier Norwegian build still holds Norwegian names in
   local storage, so a reload would keep showing them. Rename in place, once. */
const WORKOUT_EN = {
  'dag 1 – overkropp':'Day 1 – Upper body',
  'dag 2 – bein og skuldre':'Day 2 – Legs and shoulders',
  'dag 3 – bryst og armer':'Day 3 – Chest and arms',
  'dag 4 – knebøy og bak':'Day 4 – Squats and posterior'
};
function englishify(db){
  const woName=n=>{
    const t=String(n||'').trim();
    return WORKOUT_EN[t.toLowerCase()] || t.replace(/^Dag(\s+\d+)/i,'Day$1');
  };
  const fixEx=e=>{
    e.name=toEn(e.name); e.note=toEn(e.note); e.target=toEn(e.target);
    return e;
  };
  (db.workouts||[]).forEach(w=>{ w.name=woName(w.name); (w.exercises||[]).forEach(fixEx); });
  (db.sessions||[]).forEach(s=>{ s.workoutName=woName(s.workoutName); (s.exercises||[]).forEach(fixEx); });
  if(db.draft){ db.draft.workoutName=woName(db.draft.workoutName); (db.draft.exercises||[]).forEach(fixEx); }
  db.v=3;
  return db;
}

/* ============================================================
   Boot
   ============================================================ */
/* A debounced save can still be pending when the app is swiped away,
   so force it out whenever the page is hidden or unloaded. */
['pagehide','beforeunload','blur'].forEach(ev=>
  window.addEventListener(ev, ()=>{ if(DB){ clearTimeout(Store._t); Store.flush(DB); } }));
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && DB){ clearTimeout(Store._t); Store.flush(DB); }
});

(async function(){
  DB = await Store.load();
  if(!DB || !Array.isArray(DB.workouts)) { DB = seed(); Store.flush(DB); }
  DB.settings = Object.assign({unit:'kg',defaultSets:3}, DB.settings||{});
  DB.schedule = DB.schedule||{}; DB.sessions = DB.sessions||[];
  if((DB.v||1) < 3){ englishify(DB); Store.flush(DB); }
  ensureFood();
  foodDate=todayKey();
  mode = DB.settings.appMode==='food' ? 'food' : 'trening';
  if(mode==='food') view='foodlog';
  applyLang(); applyTheme(); render();
})();
</script>
