<title>Parfymesamling</title>
<style>
:root{
  --bg:#0F171E; --surface:#17222B; --surface2:#1E2B35; --surface3:#26343F; --line:#2A3742; --line-soft:#1F2B35;
  --text:#E6EDF3; --muted:#9AA9B6; --faint:#6E7D8A;
  --accent:#3FB4BE; --accent-dim:#1B4A50; --accent-text:#8ED7DE; --on-accent:#0B2226;
  --good:#4CC585; --good-soft:#133326; --warn:#E0705A; --info:#F4B740; --info-soft:#3A2F12;
  --sans:-apple-system,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html.light{
  --bg:#F4F7F9; --surface:#FFFFFF; --surface2:#EDF2F5; --surface3:#E1E8ED; --line:#D6DEE4; --line-soft:#E8EDF1;
  --text:#12212B; --muted:#55636F; --faint:#8695A1;
  --accent:#0E7C86; --accent-dim:#D6EDEF; --accent-text:#0A5C64; --on-accent:#FFFFFF;
  --good:#1E8C4E; --good-soft:#DEF3E7; --warn:#C0392B; --info:#B7791F; --info-soft:#FBF0D8;
  color-scheme:light;
}
html.light .topbar{background:rgba(244,247,249,.92)}
html.light .tabs{background:var(--bg)}
html.light .fab{box-shadow:0 8px 20px rgba(14,124,134,.3)}
html.light .toast{background:#12212B;color:#fff}
html.light .scrim{background:rgba(18,33,43,.35)}
html.light .card .acc span{background:var(--surface2)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;padding-bottom:calc(92px + max(env(safe-area-inset-bottom), 4px));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,30,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-soft)}
.topbar img{width:36px;height:36px;border-radius:9px}
.topbar h1{font-size:19px;font-weight:700;flex:1}
  .topbar h1 span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.minibtn{height:38px;min-width:38px;padding:0 9px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700}
.minibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html.light .minibtn .sun,html:not(.light) .minibtn .moon{display:none}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{padding:14px 16px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line-soft);padding:6px 4px calc(8px + max(env(safe-area-inset-bottom), 4px));transform:translateZ(0);will-change:transform;backface-visibility:hidden}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px;font-weight:600;color:var(--faint);border-radius:8px;overflow:hidden;position:relative}
.tabs button b{font-size:15px;font-weight:700}
.tabs button .caret{position:absolute;top:2px;right:calc(50% - 30px);font-size:8px;opacity:.55}
.tabmenu{position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 -8px 30px rgba(0,0,0,.45)}
.tabmenu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabmenu button.on{background:var(--accent-dim);color:var(--accent-text)}
.tabmenu button .n{font-size:12.5px;font-weight:600;color:var(--faint);background:var(--surface2);padding:2px 9px;border-radius:999px}
.tabmenu button.on .n{background:rgba(255,255,255,.12);color:inherit}
.tabs button b{font-size:15px;font-weight:700;line-height:1.1}
.tabs button[aria-selected="true"]{color:var(--accent)}
.search{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.search input::placeholder{color:var(--faint)}
.fbtn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.fbtn.on{background:var(--accent-dim);border-color:var(--accent-dim);color:var(--accent-text)}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.filters h4{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.filters h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .n{opacity:.6;font-weight:500;margin-left:3px}
.chip.more{color:var(--accent-text);background:transparent;border-style:dashed}
.fmode{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.fmode button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600}
.fmode button.on{background:var(--surface3);color:var(--text)}
.count{font-size:12.5px;color:var(--faint);margin:0 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.countr{display:flex;align-items:center;gap:12px}.sortlbl{display:flex;align-items:center}.sortlbl .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#sortSel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--accent-text);font:inherit;font-weight:700;font-size:12.5px;padding:6px 26px 6px 10px;border-radius:999px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.count button{color:var(--accent-text);font-weight:600;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;width:100%;text-align:left;display:block}
.card:active{background:var(--surface2)}
.card .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .brand{font-size:12px;font-weight:600;color:var(--accent-text);text-transform:uppercase;letter-spacing:.04em}
.card .name{font-size:16.5px;font-weight:700;margin-top:1px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface3);color:var(--muted)}
.pill.fav{background:var(--info-soft);color:var(--info)}.pill.like{background:var(--good-soft);color:var(--good)}.pill.new{background:var(--accent-dim);color:var(--accent-text)}.pill.bad{background:#3A1C18;color:var(--warn)}
.card .acc{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.card .acc span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:600}
.card .notes{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.card .acc{margin-top:7px}
.det{font-size:13.5px}
.det .sec{margin-bottom:12px}
.det .sec h5{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.det .sec p{color:var(--text);line-height:1.5}
.det .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.det .acc{display:flex;flex-wrap:wrap;gap:5px}
.det .acc span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:600}
.det .actions{display:flex;gap:8px;margin-top:16px}
.det .actions .btn{flex:1}

.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
h4.sect{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 8px}
.wears{display:flex;flex-direction:column}
.wear{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.wear:last-child{border-bottom:0}
.wear .t{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;width:42px;flex:none;padding-top:2px}
.wear .n{flex:1;font-size:14px;color:var(--muted)}
.wear .n b{color:var(--text);font-weight:600}
.wear .n em{display:block;font-style:normal;font-size:12.5px;color:var(--faint);margin-top:2px}
.wear .x{color:var(--faint);font-size:13px;padding:2px 4px}
.wear:active{background:var(--surface2)}
.wlist{max-height:210px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
.witem{display:block;width:100%;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line-soft);font-size:14px}
.witem:last-child{border-bottom:0}
.witem b{font-weight:600}
.witem span{display:block;font-size:12px;color:var(--faint)}
.witem:active{background:var(--surface2)}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.col i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--accent)}
.col i.g{background:var(--good)}
.col .v{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.col .l{font-size:10px;color:var(--faint);white-space:nowrap}
.drill{grid-column:1/-1;margin:2px 0 8px;padding:8px 10px;background:var(--surface2);border-radius:8px}
.drill button{display:block;width:100%;text-align:left;font-size:12px;color:var(--muted);padding:3px 0;line-height:1.35}
.drill button:active{color:var(--accent-text)}
.drill button b{color:var(--text);font-weight:600}
.bar.clickable{cursor:pointer}
.bar.on .l{color:var(--accent-text)}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--faint)}
.card .meta b{color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--faint);padding:40px 20px}
.fab{position:fixed;right:16px;bottom:calc(86px + max(env(safe-area-inset-bottom), 4px));z-index:35;transform:translateZ(0);display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 16px calc(28px + max(env(safe-area-inset-bottom), 12px));max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:4px}
.sh-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.f textarea{min-height:64px;resize:vertical}
.f small{display:block;color:var(--faint);font-size:11.5px;margin-top:4px}
.row{display:flex;gap:8px}
.row .f{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line);background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--warn);border-color:#3A1C18;background:#2A1614}
.btn.ghost{background:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-dim);color:var(--accent-text)}
.lookup{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.lookup .row{margin-bottom:8px}
.lookup textarea{min-height:70px;font-size:13px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--line-soft)}
.item .body{flex:1}.item .body b{display:block;font-weight:600}.item .body span{font-size:12.5px;color:var(--muted)}
.item .chev{color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:40;white-space:nowrap}
/* stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stat h3{font-size:15px;font-weight:700;margin-bottom:2px}
.stat p{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.bar .l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.bar .t{height:14px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .t i.g{background:var(--good)}.bar .t i.y{background:var(--info)}
.bar .v{text-align:right;color:var(--faint);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;font-weight:700;color:var(--accent-text)}
.kpi span{font-size:11.5px;color:var(--muted)}
.gaps{display:flex;flex-wrap:wrap;gap:6px}
.gaps span{padding:5px 10px;border-radius:999px;background:var(--surface2);font-size:12.5px;color:var(--muted)}
.gaps span.low{background:var(--info-soft);color:var(--info)}
.gaps span.none{background:#3A1C18;color:var(--warn)}
</style>
</head>

const EN_RX=[[/^(\d+) av (\d+)$/,(m)=>m[1]+' of '+m[2]],[/^(\d+) flasker$/,(m)=>m[1]+' bottles'],[/^(.+) · (\d+) flasker$/,(m)=>tr(m[1])+' · '+m[2]+' bottles'],[/^(\d+) dufter · lagret på denne enheten$/,(m)=>m[1]+' fragrances · saved on this device'],[/^Slette (.+)\?$/,(m)=>'Delete '+m[1]+'?'],[/^Hentet inn (\d+) dufter$/,(m)=>'Imported '+m[1]+' fragrances'],[/^Erstatte alt med (\d+) dufter fra fila\?$/,(m)=>'Replace everything with '+m[1]+' fragrances from the file?'],[/^Erstatte alt med (\d+) dufter fra regnearket\?$/,(m)=>'Replace everything with '+m[1]+' fragrances from the spreadsheet?'],[/^Erstatte alt med de opprinnelige duftene fra regnearket\?$/,()=>'Replace everything with the original fragrances from the spreadsheet?'],[/^Erstatter alt med de (\d+) duftene appen ble laget med$/,(m)=>'Replaces everything with the '+m[1]+' fragrances the app shipped with'],[/^Funnet \((.+) sikkerhet\): (\d+) noter, (\d+) akkorder\. Sjekk at det er riktig duft før du lagrer\.$/,(m)=>'Found ('+tr(cap(m[1]))+' confidence): '+m[2]+' notes, '+m[3]+' accords. Check it is the right fragrance before saving.'],[/^Oppdatert \((.+) sikkerhet\): (\d+) noter, (\d+) akkorder\. Sjekk og lagre\.$/,(m)=>'Updated ('+tr(cap(m[1]))+' confidence): '+m[2]+' notes, '+m[3]+' accords. Check and save.'],[/^Feil: (.+)$/,(m)=>'Error: '+tr(m[1])], [/^(.+) · mangler$/,(m)=>tr(m[1])+' · missing'],[/^(.+) · (\d+)$/,(m)=>tr(m[1])+' · '+m[2]],[/^e\.g\. (.+)$/,(m)=>'e.g. '+m[1]],[/^Høy$/,()=>'High'],[/^Middels$/,()=>'Medium']];
const lang=()=>DB.settings.lang||'no';
function tr(x){
  if(lang()!=='en'||!x) return x;
  const t=String(x).trim(); if(!t) return x;
  const lead=String(x).match(/^\s*/)[0], trail=String(x).match(/\s*$/)[0];
  let out=EN[t];
  if(out==null){ for(const [rx,f] of EN_RX){ const m=t.match(rx); if(m){ out=f(m); break; } } }
  return out==null ? x : lead+out+trail;
}
function translateDOM(root){
  if(!root||lang()!=='en') return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const p=n.parentNode; if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE') return;
    if(p.closest('.drill, [data-noi18n]')) return;
    const v=tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; });
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>{ for(const a of ['placeholder','aria-label','title']){ if(e.hasAttribute(a)) e.setAttribute(a,tr(e.getAttribute(a))); } });
  root.querySelectorAll('option').forEach(o=>{ const v=tr(o.textContent); if(v!==o.textContent) o.textContent=v; });
}

function vocab(items,key){ const c={}; items.forEach(i=>(i[key]||[]).forEach(v=>{ const n=norm(v); c[n]=c[n]||{label:v,n:0}; c[n].n++; })); return Object.values(c).sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label,'nb')); }
function matches(i){
  if(q){ const s=norm(q); const hay=[i.brand,i.name,...(i.notes||[]),...(i.accords||[]),i.comment,i.notesRaw].join(' ').toLowerCase(); if(!hay.includes(s)) return false; }
  const groups=[['notes','notes'],['accords','accords'],['season','season'],['use','use'],['rating','rating']];
  for(const [k,f] of groups){
    if(!sel[k].size) continue;

    const arr=[...sel[k]];

}

/* Norwegian collation so Æ, Ø and Å land after Z instead of among the A's and O's,

const cmpNb=(a,b)=>String(a||'').localeCompare(String(b||''),'nb',{sensitivity:'base',numeric:true});

function ratingPill(r){ if(!r||r==='-') return ''; const k=r==='Favoritt'?'fav':/^liker ikke/i.test(r)?'bad':/^til vurdering$/i.test(r)?'new':/liker|veldig god/i.test(r)?'like':/^ny$/i.test(r)?'new':''; return `<span class="pill ${k}">${esc(r)}</span>`; }

/* A pasted perfume link already carries the brand and the name in its path,
   so the fields can be filled without any lookup at all. */
function parseFragranceUrl(raw){
  const u=String(raw||'').trim(); if(!/^https?:\/\//i.test(u)) return null;
  let url; try{ url=new URL(u); }catch(_){ return null; }
  const host=url.hostname.replace(/^www\./,'').toLowerCase();
  const seg=url.pathname.split('/').filter(Boolean).map(x=>{ try{ return decodeURIComponent(x); }catch(_){ return x; } });
  const pretty=x=>String(x||'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
  const SMALL=new Set(['de','du','des','la','le','les','of','the','and','pour','di','da','del','van','von','et','au','aux','en','y']);
  const titled=x=>pretty(x).split(' ').map((w,n)=>{
      const lw=w.toLowerCase();
      return (n>0&&SMALL.has(lw))?lw:w.replace(/^[a-zæøå]/,c=>c.toUpperCase());
    }).join(' ')
    /* French elisions lose their apostrophe in a URL slug: "L Eau d Issey" */
    .replace(/\b([LD])\s(?=[A-ZÆØÅ])/g,(m,c)=>c+"'")
    .replace(/\b[Dd]'\s*/g,"d'");
  if(host.endsWith('fragrantica.com')||host.endsWith('fragrantica.no')){
    const i=seg.findIndex(x=>/^perfumes?$/i.test(x));
    if(i<0||seg.length<i+3) return null;
    const brand=pretty(seg[i+1]);
    const name=pretty(seg[i+2].replace(/\.html?$/i,'').replace(/-\d+$/,''));
    return brand||name?{brand:titled(brand),name:titled(name),site:'Fragrantica',url:u}:null;
  }
  if(host.endsWith('parfumo.com')||host.endsWith('parfumo.net')||host.endsWith('parfumo.de')){
    const i=seg.findIndex(x=>/^(perfumes|parfums|duefte|düfte)$/i.test(x));
    if(i<0||seg.length<i+3) return null;
    const brand=pretty(seg[i+1]);
    const name=pretty(seg[i+2].replace(/\.html?$/i,''));
    return brand||name?{brand:titled(brand),name:titled(name),site:'Parfumo',url:u}:null;
  }
  return null;
}

/* ---------------- wear log ----------------
   A wear is a timestamped note of what was worn. It points at a bottle by id
   when there is one, but always keeps a name of its own so the entry survives
   the bottle being edited, moved or deleted. */
const pad2=n=>String(n).padStart(2,'0');
const todayKey=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const nowTime=(d=new Date())=>`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const wearsOn=day=>DB.wears.filter(w=>w.day===day);
const wearLabel=w=>[w.brand,w.name].filter(Boolean).join(' – ')||w.name||'?';
function addWear({item,brand,name,day,time,note}){
  const w={id:uid(), day:day||todayKey(), time:time||nowTime(),
    itemId:item?item.id:null, brand:item?item.brand:(brand||''), name:item?item.name:(name||''), note:note||''};
  DB.wears.push(w); save(); return w;
}
function wearStats(){
  const byKey={};
  DB.wears.forEach(w=>{ const k=w.itemId||('free:'+norm(wearLabel(w))); (byKey[k]=byKey[k]||{n:0,label:wearLabel(w),itemId:w.itemId,last:''}); byKey[k].n++;
    if(w.day>byKey[k].last) byKey[k].last=w.day; });
  return Object.values(byKey).sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label,'nb'));
}
const wearCount=id=>DB.wears.filter(w=>w.itemId===id).length;
const lastWorn=id=>DB.wears.filter(w=>w.itemId===id).map(w=>w.day).sort().pop()||'';
function fmtDay(day){
  const d=new Date(day+'T12:00:00'); const t=todayKey();
  if(day===t) return tr('I dag');
  const y=new Date(); y.setDate(y.getDate()-1);
  if(day===todayKey(y)) return tr('I går');
  return d.toLocaleDateString(lang()==='en'?'en-GB':'nb-NO',{weekday:'short',day:'numeric',month:'short'});
}
/* Months covered by the log, oldest first, so gaps show as empty columns. */
function wearMonths(n=12){
  const out=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const m=new Date(d); m.setMonth(d.getMonth()-i);
    const key=`${m.getFullYear()}-${pad2(m.getMonth()+1)}`;
    out.push({key, label:m.toLocaleDateString(lang()==='en'?'en-GB':'nb-NO',{month:'short'}), n:DB.wears.filter(w=>w.day.slice(0,7)===key).length}); }
  return out;
}
function colChart(data,cls=''){
  const max=Math.max(1,...data.map(d=>d.n));
  return `<div class="cols">${data.map(d=>`<div class="col"><span class="v">${d.n||''}</span><i class="${cls}" style="height:${d.n?Math.max(4,Math.round(d.n/max*72)):2}px"></i><span class="l">${esc(d.label)}</span></div>`).join('')}</div>`;
}
function viewWear(){
  const today=wearsOn(todayKey());
  const days=[...new Set(DB.wears.map(w=>w.day))].sort().reverse();
  const recent=days.filter(d=>d!==todayKey()).slice(0,14);
  const top=wearStats();
  const months=wearMonths(12);
  const line=w=>`<button class="wear" data-wear="${w.id}"><span class="t">${esc(w.time)}</span><span class="n"><b>${esc(w.name||'?')}</b>${w.brand?` · ${esc(w.brand)}`:''}${w.note?`<em>${esc(w.note)}</em>`:''}</span><span class="x">✕</span></button>`;
  /* Stats first: the log itself grows without limit, so anything below it
     effectively disappears once there's a few weeks of history. */
  const stats = DB.wears.length?`<h4 class="sect">${tr('Bruk over tid')}</h4>
      <div class="stat"><h3>${tr('Antall dufter per måned')}</h3><p>${tr('Siste 12 måneder.')}</p>${colChart(months)}</div>
      <div class="stat"><h3>${tr('Mest brukt')}</h3><p>${tr('Trykk for å åpne duften.')}</p>
        ${top.slice(0,15).map(t=>`<div class="bar ${t.itemId?'clickable':''}" ${t.itemId?`data-open="${t.itemId}"`:''}><span class="l">${esc(t.label)}</span><span class="t"><i style="width:${Math.round(t.n/top[0].n*100)}%"></i></span><span class="v">${t.n}</span></div>`).join('')}</div>
      ${wearAccords()}
      ${neglected()}`:'';
  return `${stats}
    <h4 class="sect" style="${DB.wears.length?'':'margin-top:0'}">${tr('Logg')}</h4>
    <div class="card" style="margin-bottom:14px">
      <div class="spread"><b style="font-size:15px">${tr('I dag')}</b><span class="pill ${today.length?'new':'none'}">${today.length} ${tr(today.length===1?'duft':'dufter')}</span></div>
      <div class="wears">${today.map(line).join('')||`<p class="small muted" style="margin-top:8px">${tr('Ingenting logget i dag ennå. Trykk «Bruker nå».')}</p>`}</div>
    </div>
    ${recent.length?`<h4 class="sect">${tr('Tidligere')}</h4>${recent.map(d=>`<div class="card"><div class="spread"><b style="font-size:14px">${esc(fmtDay(d))}</b><span class="small muted">${wearsOn(d).length}</span></div><div class="wears">${wearsOn(d).map(line).join('')}</div></div>`).join('')}`:''}`;
}
/* Which accords you actually reach for, as opposed to which you own. */
function wearAccords(){
  const c={};
  DB.wears.forEach(w=>{ const it=w.itemId?DB.items.find(x=>x.id===w.itemId):null; if(!it) return;
    (it.accords||[]).forEach(a=>{ const k=norm(a); c[k]=c[k]||{label:a,n:0}; c[k].n++; }); });
  const list=Object.values(c).sort((a,b)=>b.n-a.n).slice(0,12);
  if(!list.length) return '';
  const max=list[0].n;
  return `<div class="stat"><h3>${tr('Akkorder du faktisk bruker')}</h3><p>${tr('Talt per gang, ikke per flaske.')}</p>
    ${list.map(v=>`<div class="bar"><span class="l">${esc(v.label)}</span><span class="t"><i class="g" style="width:${Math.round(v.n/max*100)}%"></i></span><span class="v">${v.n}</span></div>`).join('')}</div>`;
}
function neglected(){
  const never=listItems('samling').filter(i=>!wearCount(i.id));

}

/* ---------------- statistics ---------------- */
let statScope='samling', drill=null;
function statBase(){ return statScope==='samling'?listItems('samling'):statScope==='begge'?[...listItems('samling'),...listItems('onske')]:DB.items.filter(i=>i.list!=='hadde'&&i.list!=='testet'); }
function drillMatch(group,val){
  const v=norm(val);
  return statBase().filter(i=>{
    if(group==='longevity') return (i.longevity||'Ukjent')===val;
    if(group==='projection') return (i.projection||'Ukjent')===val;
    if(group==='rating') return i.rating===val;
    const arr=(i[group]||[]).map(norm);
    if(group==='season'&&arr.includes('alle')) return true;
    return arr.includes(v);
  });
}
function drillList(group,val){
  const hits=drillMatch(group,val);
  return `<div class="drill">${hits.map(h=>`<button data-open="${h.id}"><b>${esc(h.name)}</b> · ${esc(h.brand)}</button>`).join('')||'<button>Ingen</button>'}</div>`;
}
function bars(voc,max,cls='',group=''){
  return voc.map(v=>{ const key=group?group+'|'+v.label:''; const on=key&&drill===key;
    return `<div class="bar ${group?'clickable':''} ${on?'on':''}" ${group?`data-bar="${esc(key)}"`:''}><span class="l" title="${esc(v.label)}">${esc(v.label)}</span><span class="t"><i class="${cls}" style="width:${Math.round(v.n/max*100)}%"></i></span><span class="v">${v.n}</span></div>${on?drillList(group,v.label):''}`;
  }).join('');
}
function viewStats(){
  const base=statBase();
  const n=base.length||1;
  const notes=vocab(base,'notes'), accords=vocab(base,'accords');
  const cnt=(key,vals)=>vals.map(v=>({label:v,n:base.filter(i=>(i[key]||[]).map(norm).includes(norm(v))).length}));
  const seasons=cnt('season',['Vår','Sommer','Høst','Vinter']).map(s=>({...s,n:s.n+base.filter(i=>(i.season||[]).map(norm).includes('alle')).length}));
  const uses=cnt('use',USES.filter(u=>u!=='Ikke i rotasjon'));
  const lev=k=>LEVELS.map(l=>({label:l,n:base.filter(i=>(i[k]||'Ukjent')===l).length}));
  const rat=RATINGS.filter(r=>r!=='-').map(r=>({label:r,n:base.filter(i=>i.rating===r).length})).filter(x=>x.n);
  const fav=base.filter(i=>i.rating==='Favoritt').length;
  /* gaps: accords that exist on the wishlist/suggestions but are rare in the collection */
  const own=new Set(vocab(listItems('samling'),'accords').map(v=>norm(v.label)));
  const ownNotes=vocab(listItems('samling'),'notes'); const rareNotes=ownNotes.filter(v=>v.n===1).slice(0,18);
  const wish=vocab([...listItems('onske'),...listItems('forslag')],'accords').filter(v=>!own.has(norm(v.label)));
  const lowAcc=accords.filter(v=>v.n<=2);
  const lowUse=uses.filter(u=>u.n<=2), lowSeason=seasons.filter(s=>s.n<n*0.3);
  return `<div class="seg" style="margin-bottom:12px"><button class="${statScope==='samling'?'on':''}" data-scope="samling">Samling</button><button class="${statScope==='begge'?'on':''}" data-scope="begge">+ Ønskeliste</button><button class="${statScope==='alt'?'on':''}" data-scope="alt">+ Forslag</button></div>
  <div class="kpis"><div class="kpi"><b>${base.length}</b><span>flasker</span></div><div class="kpi"><b>${notes.length}</b><span>ulike noter</span></div><div class="kpi"><b>${fav}</b><span>favoritter</span></div></div>
  <div class="stat"><h3>Mest brukte noter</h3><p>Hvor mange flasker hver note inngår i. Trykk på en søyle for å se hvilke.</p>${bars(notes.slice(0,15),notes[0]?.n||1,'','notes')}</div>
  <div class="stat"><h3>Akkorder</h3><p>Duftfamilier i samlingen.</p>${bars(accords.slice(0,14),accords[0]?.n||1,'g','accords')}</div>
  <div class="stat"><h3>Årstid</h3><p>«Alle» regnes med i hver årstid.</p>${bars(seasons,Math.max(...seasons.map(s=>s.n),1),'y','season')}</div>
  <div class="stat"><h3>Brukssituasjon</h3>${bars(uses,Math.max(...uses.map(s=>s.n),1),'y','use')}</div>
  <div class="row"><div class="stat" style="flex:1"><h3>Varighet</h3>${bars(lev('longevity'),n,'','longevity')}</div><div class="stat" style="flex:1"><h3>Projeksjon</h3>${bars(lev('projection'),n,'','projection')}</div></div>
  <div class="stat"><h3>Vurdering</h3>${bars(rat,Math.max(...rat.map(r=>r.n),1),'g','rating')}</div>
  <div class="stat"><h3>Lite av</h3><p>Hull i samlingen: situasjoner og årstider med få flasker, akkorder som er tynt dekket, og akkorder du bare har på ønskeliste/forslag.</p>
    <div class="gaps">${lowUse.map(u=>`<span class="${u.n?'low':'none'}">${esc(u.label)} · ${u.n}</span>`).join('')}${lowSeason.map(s=>`<span class="low">${esc(s.label)} · ${s.n}</span>`).join('')}${lowAcc.map(a=>`<span class="low">${esc(a.label)} · ${a.n}</span>`).join('')}${wish.map(a=>`<span class="none">${esc(a.label)} · mangler</span>`).join('')}${(lowUse.length+lowSeason.length+lowAcc.length+wish.length)?'':'<span>Ingen tydelige hull.</span>'}</div>
    ${rareNotes.length?`<p style="margin-top:12px">Noter du bare har i én flaske: <span style="color:var(--text)">${esc(rareNotes.map(v=>v.label).join(', '))}</span></p>`:''}</div>`;
}

function applyLookup(sh,r){
  const notes=[...(r.notes?.top||[]),...(r.notes?.middle||[]),...(r.notes?.base||[])];
  const seen=new Set(); const uniq=notes.filter(n=>{ const k=norm(n); if(seen.has(k)) return false; seen.add(k); return true; });
  if(uniq.length) sh.querySelector('#e-notes').value=uniq.join(', ');
  if(r.accords?.length) sh.querySelector('#e-accords').value=r.accords.map(cap).join(', ');
  if(r.brand&&!sh.querySelector('#e-brand').value.trim()) sh.querySelector('#e-brand').value=r.brand;
  const setChips=(id,vals)=>{ const want=new Set((vals||[]).map(norm)); sh.querySelectorAll(id+' .chip').forEach(c=>c.classList.toggle('on',want.has(norm(c.dataset.t)))); };
  if(r.seasons?.length) setChips('#e-season',r.seasons); if(r.occasions?.length) setChips('#e-use',r.occasions);
  const lv=v=>LEVELS.find(l=>norm(l)===norm(v||''))||null;
  if(lv(r.longevity)) sh.querySelector('#e-long').value=lv(r.longevity);
  if(lv(r.projection)) sh.querySelector('#e-proj').value=lv(r.projection);
  const cm=sh.querySelector('#e-comment'); const extra=[r.description, r.sources?.length?'Kilde: '+r.sources.slice(0,2).join(', '):''].filter(Boolean).join(' ');
  if(extra&&!cm.value.trim()) cm.value=extra;
  return {notes:uniq.length,accords:(r.accords||[]).length,conf:r.match_confidence||''};
}

/* Parse pasted text from Fragrantica ("Top notes are X, Y and Z; middle notes are …; base notes are …")
   or Parfumo ("Top Notes … Heart Notes … Base Notes …"), plus a "main accords" line if present. */
function parseNotes(t){
  t=(t||'').replace(/\r/g,'\n');
  const out={notes:[],accords:[]};
  const grab=(rx)=>{ const m=t.match(rx); return m?m[1]:''; };
  let top=grab(/top notes?\b(?: are|:)?[ \t]*([^\n;.]+)/i), mid=grab(/(?:middle|heart) notes?\b(?: are|:)?[ \t]*([^\n;.]+)/i), base=grab(/base notes?\b(?: are|:)?[ \t]*([^\n;.]+)/i);
  if(!top&&!mid&&!base){ // Parfumo layout: headings on their own lines followed by note lines
    const lines=t.split('\n').map(s=>s.trim()).filter(Boolean); let cur=null; const acc={top:[],mid:[],base:[]};
    for(const l of lines){ if(/^top notes?$/i.test(l)) cur='top'; else if(/^(heart|middle) notes?$/i.test(l)) cur='mid'; else if(/^base notes?$/i.test(l)) cur='base'; else if(/^(main accords?|fragrance notes?|notes?)$/i.test(l)) cur=null; else if(cur) acc[cur].push(l); }
    top=acc.top.join(', '); mid=acc.mid.join(', '); base=acc.base.join(', ');
  }
  const clean=s=>s.replace(/\band\b/gi,',').split(/[,;•|\n]/).map(x=>x.trim().replace(/\.$/,'')).filter(x=>x&&x.length<40);
  const seen=new Set(); [...clean(top),...clean(mid),...clean(base)].forEach(n=>{ const k=norm(n); if(!seen.has(k)){ seen.add(k); out.notes.push(n.charAt(0).toUpperCase()+n.slice(1)); } });
  const am=t.match(/main accords?:?\s*([^\n]+)/i); if(am) out.accords=clean(am[1]).map(cap);
  return out;
}

/* Automatic lookup: asks Claude (with web search) to find the fragrance on
   Fragrantica/Parfumo and return structured data. Runs straight from the
   browser with the user's own API key. */
async function lookupFragrance(brand,name,url){
  const known=vocab(DB.items,'notes').slice(0,80).map(v=>cap(v.label)).join(', ');
  const prompt=`${url?`Bruk siden ${url} som kilde. `:''}Finn parfymen "${brand} ${name}" på fragrantica.com eller parfumo.com (søk begge om nødvendig). Svar KUN med ett JSON-objekt, uten forklaring og uten kodeblokk:
{"brand":"","name":"","match_confidence":"høy|middels|lav","notes":{"top":[],"middle":[],"base":[]},"accords":[],"seasons":[],"occasions":[],"longevity":"","projection":"","description":"","sources":[]}
Regler:
- notes: notenavn på norsk (f.eks. bergamott, seder, sandeltre, treslag, musk, ambra, lær, vanilje, rosa pepper, einer, safran). Bruk samme skrivemåte som disse eksisterende notene der de passer: ${known}.
- accords: hovedakkorder på engelsk med stor forbokstav, som Woody, Fresh, Citrus, Aromatic, Sweet, Spicy, Oud, Aquatic, Green, Musky, Amber, Leather, Gourmand, Floral, Fruity, Incense, Smoky, Vetiver, Vanilla, Powdery, Tea, Fig.
- seasons: velg blant Vår, Sommer, Høst, Vinter ut fra stemmene på Fragrantica; bruk ["Alle"] hvis den passer hele året.
- occasions: velg blant Hverdag, Kontor, Kveld, Fest, Gym, Strand, Date.
- longevity og projection: én av Lav, Middels, Høy, Svært høy, Ukjent (Fragrantica/Parfumo-stemmer: weak/soft→Lav, moderate→Middels, long lasting/strong→Høy, eternal/enormous→Svært høy).
- description: én setning på norsk om hvordan den lukter.
- sources: URL-ene du brukte.
Hvis du ikke finner duften, sett match_confidence til "lav" og fyll det du kan.`;
  const text = DB.settings.provider==='anthropic' ? await askAnthropic(prompt) : await askGemini(prompt);
  const m=text.match(/\{[\s\S]*\}/); if(!m) throw new Error('Fikk ikke noe brukbart svar');
  return JSON.parse(m[0]);
}
async function askAnthropic(prompt){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':DB.settings.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:curModel(),max_tokens:1500,messages:[{role:'user',content:prompt}],tools:[{type:'web_search_20250305',name:'web_search',max_uses:4}]})});
  const j=await r.json();
  if(!r.ok) throw new Error(j?.error?.message||('HTTP '+r.status));
  return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
/* Gemini with Google Search grounding. Free tier on the Flash models. */
/* Google retires model names now and then. If the error names a replacement,
   switch to it and remember the choice instead of making the user edit settings. */
const GEMINI_FALLBACKS=['gemini-3.6-flash','gemini-3.5-flash-lite','gemini-3.5-flash','gemini-2.5-flash-lite','gemini-flash-latest'];
const GEMINI_CHOICES=[['gemini-3.6-flash','Gemini 3.6 Flash – standard'],['gemini-3.5-flash-lite','Gemini 3.5 Flash-Lite – størst gratiskvote'],['gemini-3.5-flash','Gemini 3.5 Flash'],['gemini-2.5-flash-lite','Gemini 2.5 Flash-Lite']];
async function askGemini(prompt, opt={}){
  const model=opt.model||curModel();
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const body={contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.2,maxOutputTokens:2000}};
  if(!opt.noTools) body.tools=[{google_search:{}}];
  let r,j;
  try{ r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':DB.settings.key},body:JSON.stringify(body)}); j=await r.json(); }
  catch(e){ throw new Error('Fikk ikke kontakt med Google. Sjekk nettforbindelsen.'); }
  if(!r.ok){
    const msg=j?.error?.message||('HTTP '+r.status);
    if(/quota|RESOURCE_EXHAUSTED/i.test(msg)||r.status===429){
      const raw=JSON.stringify(j?.error||{});
      const perMinute=/PerMinute|per minute/i.test(raw);
      const grounded=/grounding|GoogleSearch|search/i.test(raw);
      /* Search grounding has its own quota — try again without it before giving up. */
      if(!opt.noTools && !perMinute) return askGemini(prompt,{...opt,model,noTools:true});
      /* Each model has a separate daily quota, so a sibling model may still work. */
      if(!perMinute && (opt.tried||[]).length<2){
        const next=GEMINI_FALLBACKS.find(m=>m!==model&&!(opt.tried||[]).includes(m));
        if(next) return askGemini(prompt,{...opt,model:next,noTools:opt.noTools,tried:[...(opt.tried||[]),model]});
      }
      if(perMinute) throw new Error('For mange forespørsler på kort tid. Vent et minutt og prøv igjen.');
      throw new Error(grounded
        ? 'Gratiskvoten for nettsøk er brukt opp. Kvoten nullstilles ca. kl. 09 norsk tid. Du kan velge en annen modell under Innstillinger, eller lime inn notene manuelt.'
        : 'Dagskvoten er brukt opp for alle gratismodellene. Den nullstilles ca. kl. 09 norsk tid. Bruk manuell innliming i mellomtiden.');
    }
    if(/API key|API_KEY_INVALID|PERMISSION_DENIED/i.test(msg)&&!/tool|search/i.test(msg)) throw new Error('Nøkkelen ble avvist. Sjekk at den er riktig under Meny → Innstillinger.');
    /* model retired or unknown: take the name Google suggests, else walk a list */
    if(/no longer available|not found|is not supported|does not exist/i.test(msg) && !/tool|google_search/i.test(msg)){
      const sug=(msg.match(/models\/([A-Za-z0-9.\-]+)/g)||[]).map(x=>x.split('/')[1]).filter(m=>m!==model);
      const next=(opt.tried||[]).length<3 ? (sug[0]||GEMINI_FALLBACKS.find(m=>m!==model&&!(opt.tried||[]).includes(m))) : null;
      if(next) return askGemini(prompt,{...opt,model:next,tried:[...(opt.tried||[]),model]});
    }
    /* some keys reject the search tool — fall back to the model's own knowledge once */
    if(!opt.noTools && /google_search|tool|not supported|permission/i.test(msg)) return askGemini(prompt,{...opt,model,noTools:true});
    throw new Error(msg);
  }
  if((opt.tried||[]).length && model!==curModel()){ DB.settings.model=model; save(); }
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
}

async function exportExcel(){ try{ await loadXLSX(); }catch(e){ toast(e.message); return; }
  const wb=XLSX.utils.book_new();
  LISTS.forEach(([k,,status])=>{ const name={samling:'Samling',onske:'Ønskeliste',forslag:'Forslag',testet:'Testet',hadde:'Hadde'}[k]; const ws=XLSX.utils.aoa_to_sheet([COLS,...listItems(k).sort((a,b)=>(a.brand+a.name).localeCompare(b.brand+b.name,'nb')).map(toRow)]); ws['!cols']=[14,26,40,24,22,16,10,10,10,12,40].map(w=>({wch:w})); ws['!autofilter']={ref:`A1:K${listItems(k).length+100}`}; XLSX.utils.book_append_sheet(wb,ws,name); });
  if(DB.wears.length){ const ws=XLSX.utils.aoa_to_sheet([['Dato','Klokkeslett','Merke','Navn','Notat'],
      ...DB.wears.slice().sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time)).map(w=>[w.day,w.time,w.brand,w.name,w.note])]);
    ws['!cols']=[{wch:12},{wch:10},{wch:20},{wch:28},{wch:40}]; XLSX.utils.book_append_sheet(wb,ws,'Bruk'); }
  XLSX.writeFile(wb,'parfymesamling.xlsx'); toast('Eksportert'); }
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
async function importFile(f){
  try{
    if(/\.json$/i.test(f.name)){ const j=JSON.parse(await f.text()); if(!Array.isArray(j.items)) throw new Error('Ikke en gyldig sikkerhetskopi'); if(!confirm(`Erstatte alt med ${j.items.length} dufter fra fila?`)) return; DB=j; save(); render(); toast('Hentet inn'); return; }
    await loadXLSX(); const wb=XLSX.read(await f.arrayBuffer()); const items=[];
    const map={'Samling':'samling','Ønskeliste':'onske','Forslag':'forslag','Testet':'testet','Unngå':'testet','Hadde':'hadde','Solgt':'hadde'};
    for(const [sheet,k] of Object.entries(map)){ const ws=wb.Sheets[sheet]; if(!ws) continue; const rows=XLSX.utils.sheet_to_json(ws,{header:1}).slice(1);
      rows.forEach(r=>{ if(!r[0]&&!r[1]) return; const v=x=>String(x??'').trim(); items.push({id:uid(),list:k,brand:v(r[0]),name:v(r[1]),notes:/ikke verifisert/i.test(v(r[2]))?[]:split(r[2]),notesRaw:v(r[2]),accords:split(r[3]),use:split(r[4]),season:split(r[5]),longevity:v(r[6])||'Ukjent',projection:v(r[7])||'Ukjent',status:v(r[8]),exit:k==='hadde'?(v(r[8])||'Solgt'):'',rating:v(r[9])||'-',comment:v(r[10])}); }); }
    if(!items.length) throw new Error('Fant ingen rader'); migrate(items); if(!confirm(`Erstatte alt med ${items.length} dufter fra regnearket?`)) return; DB={v:1,items}; save(); render(); toast('Hentet inn '+items.length+' dufter');
  }catch(e){ toast(e.message); }
}

/* ---------------- events ---------------- */
document.body.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){
    const grouped=tab.dataset.group!==undefined;
    if(grouped && LISTS.some(l=>l[0]===view)) return openTabMenu();
    closeTabMenu(); view=tab.dataset.tab; drill=null; render(); return;
  }
  const ext=e.target.closest('[data-ext]'); if(ext){ extSearch(ext.dataset.ext); return; }
  const au=e.target.closest('[data-addurl]');
  if(au){ const r=parseFragranceUrl(sq); if(!r) return;
    const list=au.dataset.addurl;
    const it={id:uid(),list,brand:r.brand,name:r.name,notes:[],notesRaw:'',accords:[],use:[],season:[],
      longevity:'Ukjent',projection:'Ukjent',status:LISTS.find(l=>l[0]===list)[2],rating:'Ikke testet',comment:'',url:r.url,
      exit:list==='hadde'?'Solgt':''};
    DB.items.push(it); save(); sq=''; view=list; render(); editSheet(it.id);
    toast(tr('Lagt til')+': '+it.name); return; }
  const open=e.target.closest('[data-open]'); if(open){ const id=open.dataset.open; if(drill){ drill=null; render(); } detailSheet(id); return; }
  const chip=e.target.closest('[data-chip]'); if(chip&&!chip.closest('.sheet')){ const s=sel[chip.dataset.chip]; s.has(chip.dataset.v)?s.delete(chip.dataset.v):s.add(chip.dataset.v); render(); return; }
  const more=e.target.closest('[data-more]'); if(more){ expand[more.dataset.more]=!expand[more.dataset.more]; render(); return; }
  const wr=e.target.closest('[data-wear]');
  if(wr){ const w=DB.wears.find(x=>x.id===wr.dataset.wear); if(w&&confirm(tr('Fjerne')+' '+wearLabel(w)+'?')){ DB.wears=DB.wears.filter(x=>x.id!==w.id); save(); render(); } return; }
  const bar=e.target.closest('[data-bar]'); if(bar){ drill=drill===bar.dataset.bar?null:bar.dataset.bar; render(); return; }
  if(drill && !e.target.closest('.drill')){ drill=null; render(); if(!e.target.closest('[data-open],[data-act],[data-tab],[data-scope]')) return; }
  const md=e.target.closest('[data-mode]'); if(md){ mode=md.dataset.mode; render(); return; }
  const sc=e.target.closest('[data-scope]'); if(sc){ statScope=sc.dataset.scope; drill=null; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='filters'){ showFilters=!showFilters; render(); }
  if(a==='clear'){ q=''; Object.values(sel).forEach(s=>s.clear()); render(); }
  if(a==='add'){ view==='bruk' ? wearSheet() : editSheet(null); }
  if(a==='lang'){ DB.settings.lang = lang()==='en'?'no':'en'; save(); applyTheme(); $('#langLbl').textContent = lang()==='en'?'NO':'EN'; render(); }
  if(a==='theme'){ DB.settings.theme = DB.settings.theme==='light'?'dark':'light'; save(); applyTheme(); }
  if(a==='menu'){ menuSheet(); }
  if(a==='settings'){ closeSheet(); settingsSheet(); }
  if(a==='excel'){ closeSheet(); exportExcel(); }
  if(a==='json'){ closeSheet(); dl(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),'parfymesamling-backup.json'); toast('Sikkerhetskopi lastet ned'); }
  if(a==='reset'){
    const n=DB.items.length, w=(DB.wears||[]).length;
    if(!confirm(`Slette alt? ${n} ${n===1?'duft':'dufter'} og ${w} ${w===1?'logget bruk':'loggede bruk'} forsvinner for godt. Innstillinger, språk og API-nøkkel beholdes.`)) return;
    /* Settings are deliberately kept: they are not collection data, and losing
       the API key to a "clear my list" action would be a nasty surprise. */
    const keep=DB.settings;
    DB={v:1, items:[], wears:[], settings:keep};
    save(); closeSheet(); view='samling'; render(); toast('Tømt');
  }
  if(a==='reseed'){ if(!confirm('Erstatte alt med de opprinnelige duftene fra regnearket?')) return; DB={v:1,items:migrate(SEED.map(x=>({...x}))),wears:DB.wears||[]}; DB.settings=Object.assign({provider:'gemini',key:'',model:'',lang:'no',theme:'dark',lastList:'samling'},DB.settings||{}); save(); closeSheet(); render(); toast('Tilbakestilt'); }
});
document.body.addEventListener('input',e=>{
  if(e.target.id==='sq'){ sq=e.target.value; const el2=document.activeElement; render(); const f=$('#sq'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } return; }
  if(e.target.id==='q'){ q=e.target.value; const all=listItems(view); const items=all.filter(matches); const c=$('.count span'); if(c) c.textContent=`${items.length} av ${all.length}`; document.querySelectorAll('.card').forEach(cd=>{ cd.style.display=items.some(i=>i.id===cd.dataset.open)?'':'none'; }); } });
document.body.addEventListener('change',e=>{ if(e.target.id==='imp'){ const f=e.target.files[0]; closeSheet(); if(f) importFile(f); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeTabMenu(); closeSheet(); } });
save(); applyTheme(); document.getElementById('langLbl').textContent = lang()==='en'?'NO':'EN'; render();
document.addEventListener('change',e=>{
  if(e.target && e.target.id==='sortSel'){ DB.settings.sort=e.target.value; save(); render(); }
});
</script>
</body>
