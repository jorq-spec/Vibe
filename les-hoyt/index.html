<title>Les høyt</title>
<style>
/* Atkinson Hyperlegible was designed for readers with low vision — the one
   typographic choice here that matters. If it can't load (no connection in a
   hospital ward), the system font takes over without any change in layout. */
:root{
  --paper:#F3F6F8; --card:#FFFFFF; --ink:#14212B; --soft:#55636F;
  --rule:#D6DEE4; --speak:#1E5AA8; --speak-ink:#FFFFFF; --speak-down:#174886;
  --chip:#E6EDF3;
  --font:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
html.dark{
  --paper:#101820; --card:#18232D; --ink:#EEF3F7; --soft:#A7B4BF;
  --rule:#2C3A46; --speak:#5B9BEA; --speak-ink:#08172A; --speak-down:#4A86D1;
  --chip:#22303C; color-scheme:dark;
}
.themebtn{display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:48px;border-radius:14px;
  border:2px solid var(--rule);background:var(--card);font-size:17px;font-weight:700}
.themebtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:var(--font); color:var(--ink); background:var(--paper);
  font-size:20px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}
main{max-width:640px;margin:0 auto}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--speak);outline-offset:3px}

header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}

textarea{
  display:block;width:100%;min-height:34vh;resize:vertical;
  padding:18px 18px;border-radius:18px;border:2px solid var(--rule);
  background:var(--card);font-size:28px;line-height:1.35;
}
textarea::placeholder{color:var(--soft);opacity:.8}
textarea:focus{border-color:var(--speak);outline:none}

/* The one bold thing on the page. */
.speak{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;margin-top:14px;padding:22px 20px;min-height:84px;
  border:0;border-radius:20px;background:var(--speak);color:var(--speak-ink);
  font-size:30px;font-weight:700;letter-spacing:.005em;
}
.speak:active{background:var(--speak-down);transform:scale(.99)}
.speak svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.speak.busy{background:var(--speak-down)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.plain{
  padding:16px 12px;min-height:60px;border-radius:16px;border:2px solid var(--rule);
  background:var(--card);font-size:21px;font-weight:700;
}
.plain:active{background:var(--chip)}

section{margin-top:26px}
section > h2{margin:0 2px 10px;font-size:19px;font-weight:700;color:var(--soft)}
.phrases{display:flex;flex-wrap:wrap;gap:10px}
.phrase{
  position:relative;padding:15px 18px;min-height:58px;border-radius:14px;
  border:0;background:var(--chip);font-size:22px;font-weight:700;text-align:left;
}
.phrase:active{background:var(--rule)}
.phrase .x{
  display:none;position:absolute;top:-9px;right:-9px;width:30px;height:30px;border-radius:50%;
  background:var(--ink);color:var(--paper);font-size:17px;line-height:30px;text-align:center;
}
.editing .phrase .x{display:block}
.phrase-tools{display:flex;gap:10px;margin-top:12px}
.phrase-tools button{flex:1;font-size:18px;min-height:52px}

.slider{margin-top:6px}
.slider label{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;font-weight:700;margin:0 2px 6px}
.slider label span{font-weight:400;color:var(--soft);font-size:17px}
input[type=range]{width:100%;height:44px;accent-color:var(--speak)}
.hint{margin:8px 2px 0;font-size:16px;color:var(--soft)}

.notice{
  margin-top:14px;padding:14px 16px;border-radius:14px;
  background:var(--chip);font-size:17px;line-height:1.45;
}
.notice[hidden]{display:none}
.voice{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;margin-bottom:10px;
  border:2px solid var(--rule);border-radius:16px;background:var(--card)}
.voice.on{border-color:var(--speak)}
.voice .pick{flex:1;display:flex;align-items:center;gap:12px;min-height:52px;background:none;border:0;padding:0;text-align:left}
.voice .dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--rule);flex:none}
.voice.on .dot{border-color:var(--speak);background:radial-gradient(circle,var(--speak) 45%,transparent 50%)}
.voice .nm{font-size:20px;font-weight:700;line-height:1.25}
.voice .sub{display:block;font-size:15px;font-weight:400;color:var(--soft)}
.voice .try{flex:none;min-height:52px;padding:0 16px;border-radius:12px;border:2px solid var(--rule);background:var(--chip);font-size:18px;font-weight:700}
@media (prefers-reduced-motion: reduce){ .speak:active{transform:none} }
</style>
</head>
<body>
<main>
  <header>
    <h1>Les høyt</h1>
    <button class="themebtn" id="theme" type="button"></button>
  </header>

  <textarea id="text" placeholder="Skriv her …" aria-label="Tekst som skal leses opp" autocomplete="off" autocorrect="on" spellcheck="true"></textarea>

  <button class="speak" id="speak" type="button" aria-label="Les teksten høyt">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <span id="speakLbl">Les høyt</span>
  </button>

  <div class="row">
    <button class="plain" id="stop" type="button">Stopp</button>
    <button class="plain" id="clear" type="button">Tøm</button>
  </div>

  <p class="notice" id="voiceNotice" hidden></p>

  <section aria-labelledby="qh">
    <h2 id="qh">Trykk for å si</h2>
    <div class="phrases" id="phrases"></div>
    <div class="phrase-tools">
      <button class="plain" id="savePhrase" type="button">Lagre teksten som knapp</button>
      <button class="plain" id="editPhrases" type="button">Fjern knapper</button>
    </div>
  </section>

  <section aria-labelledby="sh">
    <h2 id="sh">Lyd</h2>
    <div class="slider">
      <label for="vol">Volum <span id="volVal"></span></label>
      <input type="range" id="vol" min="0" max="100" step="5">
    </div>
    <div class="slider" style="margin-top:14px">
      <label for="rate">Fart <span id="rateVal"></span></label>
      <input type="range" id="rate" min="50" max="150" step="5">
    </div>
    <p class="hint">Skal det bli høyere enn dette, bruk volumknappene på siden av telefonen.</p>
  </section>

  <section aria-labelledby="vh">
    <h2 id="vh">Stemme</h2>
    <div id="voices"></div>
  </section>
</main>

<script>
const KEY='lesHoyt_v1';
const DEFAULT_PHRASES=['Ja','Nei','Takk','Kan jeg få noe å drikke?','Jeg er sulten','Jeg må tisse',
  'Jeg må bæsje','Jeg har vondt','Hvor er brillene mine?','Jeg er sliten','Jeg fryser','Kan du synge en sang for meg?'];
/* The list the app first shipped with. If a phone still has exactly this saved,
   nobody has customised it, so it is safe to swap in the current defaults. Any
   list someone has edited is left alone. */
const OLD_DEFAULTS=['Ja','Nei','Takk','Jeg har vondt','Jeg trenger vann','Jeg må på toalettet',
  'Kan du hjelpe meg?','Jeg er sliten','Jeg fryser','Ring sykepleieren'];

let S={text:'', volume:100, rate:90, phrases:DEFAULT_PHRASES.slice(), dark:false, voiceName:null};
try{ const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j) S=Object.assign(S,j); }catch(e){}
if(JSON.stringify(S.phrases)===JSON.stringify(OLD_DEFAULTS)){ S.phrases=DEFAULT_PHRASES.slice(); }
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
let voice=null, editing=false;

/* ---- voice --------------------------------------------------------------
   Norwegian shows up under several tags depending on the phone: nb-NO on most,
   no-NO or nn-NO on some. Voices also load after the page does, so this runs
   again when the list arrives. */
function norwegianVoices(){
  if(!synth) return [];
  return synth.getVoices().filter(v=>/^(nb|no|nn)([-_]|$)/i.test(v.lang));
}
function pickVoice(){
  const no=norwegianVoices();
  if(S.voiceName){ const chosen=no.find(v=>v.name===S.voiceName); if(chosen) return chosen; }
  return no.find(v=>/nb/i.test(v.lang) && v.localService) || no.find(v=>/nb/i.test(v.lang)) || no[0] || null;
}
function refreshVoice(){
  voice=pickVoice();
  const n=$('voiceNotice');
  if(!synth){
    n.hidden=false;
    n.textContent='Denne nettleseren kan ikke lese opp tekst. Prøv Chrome på Android eller Safari på iPhone.';
  } else if(!voice && synth.getVoices().length){
    n.hidden=false;
    n.innerHTML='Fant ingen norsk stemme på telefonen, så teksten leses med feil uttale.<br><br>'+
      '<b>Android:</b> Innstillinger → Tilgjengelighet → Tekst-til-tale → Googles tale­motor → Installer talelyd → Norsk.<br>'+
      '<b>iPhone:</b> Innstillinger → Tilgjengelighet → Opplest innhold → Stemmer → Norsk.';
  } else {
    n.hidden=true;
  }
  renderVoices();
}
if(synth){ refreshVoice(); synth.onvoiceschanged=refreshVoice; }
else refreshVoice();

/* ---- speaking -----------------------------------------------------------
   Long passages are split into sentences: some Android versions silently stop
   a single utterance after roughly fifteen seconds. */
function chunks(t){
  const parts=t.replace(/\s+/g,' ').trim().match(/[^.!?…\n]+[.!?…]*|\n/g)||[];
  const out=[]; let cur='';
  for(const raw of parts){
    const p=raw.trim(); if(!p) continue;
    if((cur+' '+p).length>180 && cur){ out.push(cur.trim()); cur=p; }
    else cur=cur?cur+' '+p:p;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
function setBusy(b){
  $('speak').classList.toggle('busy',b);
  $('speakLbl').textContent=b?'Leser …':'Les høyt';
}
function speak(text, useVoice){
  text=(text||'').trim();
  if(!text){ $('text').focus(); return; }
  if(!synth) return;
  synth.cancel();
  const v=useVoice||voice;
  const parts=chunks(text);
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);
    u.lang=v?v.lang:'nb-NO';
    if(v) u.voice=v;
    u.volume=S.volume/100;
    u.rate=S.rate/100;
    if(i===0) u.onstart=()=>setBusy(true);
    if(i===parts.length-1){ u.onend=()=>setBusy(false); u.onerror=()=>setBusy(false); }
    synth.speak(u);
  });
}

/* ---- voice picker -------------------------------------------------------
   Android usually hands the browser a single Norwegian voice and keeps the
   rest in system settings, so with one voice the section explains where the
   real choice lives instead of pretending there is one here. */
const SAMPLE='Hei. Dette er stemmen min.';
function voiceLabel(v){
  const nm=v.name.replace(/^(Microsoft|Google|Apple)\s+/i,'').replace(/\s*\((?:Natural|Online)[^)]*\)/gi,'').trim();
  const kind=/nn/i.test(v.lang)?'nynorsk':'bokmål';
  return {nm, sub:`${kind}${v.localService?'':' · trenger nett'}`};
}
function renderVoices(){
  const box=$('voices'); if(!box) return;
  const no=norwegianVoices();
  const cur=voice?voice.name:null;
  const help=`<p class="hint" style="margin-top:4px">Flere stemmer ligger i telefonens innstillinger:<br>
    <b>Android:</b> Innstillinger → Tilgjengelighet → Tekst-til-tale → tannhjulet ved Googles talemotor → Installer talelyd → Norsk.<br>
    <b>iPhone:</b> Innstillinger → Tilgjengelighet → Opplest innhold → Stemmer → Norsk. Last ned «forbedret» for best lyd.</p>`;
  if(!no.length){ box.innerHTML=`<p class="hint" style="margin-top:0">Ingen norsk stemme funnet på telefonen.</p>`+help; return; }
  box.innerHTML=no.map((v,i)=>{ const l=voiceLabel(v);
    return `<div class="voice${v.name===cur?' on':''}">
      <button class="pick" type="button" data-i="${i}" aria-pressed="${v.name===cur}">
        <span class="dot" aria-hidden="true"></span>
        <span class="nm">${l.nm.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}<span class="sub">${l.sub}</span></span>
      </button>
      <button class="try" type="button" data-try="${i}">Prøv</button>
    </div>`; }).join('') + (no.length===1
      ? `<p class="hint" style="margin-top:2px">Telefonen viser bare én norsk stemme her. Den kan byttes i telefonens innstillinger:</p>`+help.replace('<p class="hint" style="margin-top:4px">Flere stemmer ligger i telefonens innstillinger:<br>','<p class="hint" style="margin-top:4px">')
      : help);
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const v=no[+b.dataset.i]; S.voiceName=v.name; save(); voice=v; renderVoices(); speak(SAMPLE, v);
  });
  box.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>speak(SAMPLE, no[+b.dataset.try]));
}

/* ---- phrases ------------------------------------------------------------ */
function renderPhrases(){
  const box=$('phrases');
  box.classList.toggle('editing',editing);
  box.innerHTML='';
  S.phrases.forEach((p,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='phrase'; b.textContent=p;
    const x=document.createElement('span'); x.className='x'; x.textContent='✕'; x.setAttribute('aria-hidden','true');
    b.appendChild(x);
    b.setAttribute('aria-label', editing?`Fjern «${p}»`:`Si «${p}»`);
    b.onclick=()=>{
      if(editing){ S.phrases.splice(i,1); save(); renderPhrases(); }
      else speak(p);
    };
    box.appendChild(b);
  });
  $('editPhrases').textContent=editing?'Ferdig':'Fjern knapper';
}

/* ---- wiring ------------------------------------------------------------- */
const ta=$('text');
ta.value=S.text||'';
ta.addEventListener('input',()=>{ S.text=ta.value; save(); });
$('speak').onclick=()=>speak(ta.value);
$('stop').onclick=()=>{ if(synth) synth.cancel(); setBusy(false); };
$('clear').onclick=()=>{ ta.value=''; S.text=''; save(); if(synth) synth.cancel(); setBusy(false); ta.focus(); };
$('savePhrase').onclick=()=>{
  const t=ta.value.trim(); if(!t){ ta.focus(); return; }
  if(!S.phrases.includes(t)){ S.phrases.push(t); save(); }
  editing=false; renderPhrases();
};
$('editPhrases').onclick=()=>{ editing=!editing; renderPhrases(); };

const vol=$('vol'), rate=$('rate');
vol.value=S.volume; rate.value=S.rate;
const showVals=()=>{ $('volVal').textContent=S.volume+' %'; $('rateVal').textContent=S.rate<85?'rolig':S.rate>115?'rask':'normal'; };
vol.oninput=()=>{ S.volume=+vol.value; save(); showVals(); };
rate.oninput=()=>{ S.rate=+rate.value; save(); showVals(); };
const SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
/* The button names what it switches TO, so the label is an action, not a state. */
function applyTheme(){
  document.documentElement.classList.toggle('dark', !!S.dark);
  document.querySelector('meta[name=theme-color]').content = S.dark ? '#101820' : '#F3F6F8';
  $('theme').innerHTML = S.dark ? SUN+'Lys' : MOON+'Mørk';
  $('theme').setAttribute('aria-label', S.dark ? 'Bytt til lyst tema' : 'Bytt til mørkt tema');
}
$('theme').onclick=()=>{ S.dark=!S.dark; save(); applyTheme(); };
applyTheme(); showVals(); renderPhrases();
</script>
</body>
